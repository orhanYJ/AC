<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Ombre du Fenua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0f1f2a; --night-deep:#08141c;
    --stone:#d9bf95; --sand:#c8a86f;
    --lantern:#f0a94b; --blood:#c0392b; --sage:#5f9f93;
    --ui-text:#f3e9d6; --ui-dim:#a79c88;
    --panel:rgba(11,17,32,.72); --edge:rgba(240,169,75,.35);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ color-scheme:dark; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--night-deep);color:var(--ui-text);
    font-family:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hidden{display:none !important}

  #hud{position:fixed;inset:0;pointer-events:none}
  .panel{background:var(--panel);border:1px solid rgba(240,169,75,.18);border-radius:3px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #objectives{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
    max-width:min(58vw,290px);padding:9px 11px}
  #objectives h3{font-family:"Marcellus",Georgia,serif;margin:0 0 5px;font-size:12.5px;letter-spacing:.06em;color:var(--lantern);font-weight:400}
  #objlist{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.4}
  #objlist li{display:flex;gap:6px;align-items:flex-start}
  #objlist li .mk{width:11px;flex:none;color:var(--lantern)}
  #objlist li.done{color:var(--ui-dim);text-decoration:line-through}
  #objlist li.done .mk{color:var(--sage)}
  #objlist li.opt .mk{color:var(--ui-dim)}

  #topcenter{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    width:min(46vw,230px);text-align:center}
  #detectwrap{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  #detectbar{height:100%;width:0%;background:var(--lantern);transition:width .07s linear}
  #statetxt{font-size:11.5px;letter-spacing:.09em;margin-top:5px;color:var(--ui-dim);font-family:"Marcellus",Georgia,serif}
  #statetxt.warn{color:var(--lantern)} #statetxt.bad{color:var(--blood)}
  #tags{font-size:10.5px;margin-top:2px;letter-spacing:.06em;color:var(--ui-dim);min-height:14px}
  #tags .hide{color:var(--sage)} #tags .lit{color:var(--lantern)} #tags .body{color:var(--blood)}

  #stats{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
    padding:7px 10px;font-size:11.5px;text-align:right;line-height:1.55}
  #stats b{font-weight:600;color:var(--lantern);font-variant-numeric:tabular-nums}
  #levelname{font-family:"Marcellus",Georgia,serif;font-size:12px;color:var(--ui-dim)}

  #mini{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));width:140px;height:140px;
    background:var(--panel);border:1px solid rgba(240,169,75,.18);border-radius:3px}

  #prompt .alt{margin-left:14px;opacity:.85}
  #tools{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;pointer-events:auto}
  .tool{font:inherit;font-size:11px;cursor:pointer;background:transparent;color:var(--ui-dim);
    border:1px solid transparent;border-radius:3px;padding:5px 9px;line-height:1.25;text-align:center;min-width:58px}
  .tool .n{display:block;font-size:9.5px;opacity:.6}
  .tool b{display:block;font-weight:600;color:var(--ui-text);font-variant-numeric:tabular-nums}
  .tool.sel{border-color:var(--edge);background:rgba(240,169,75,.14);color:var(--ui-text)}
  .tool.empty{opacity:.35}

  #prompt{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    padding:7px 13px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .15s}
  #prompt.on{opacity:1}
  #prompt kbd{font:inherit;font-weight:600;color:var(--lantern);border:1px solid var(--edge);
    border-radius:3px;padding:0 5px;margin-right:6px}
  #toast{position:absolute;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    padding:7px 15px;font-size:12.5px;opacity:0;transition:opacity .3s;font-family:"Marcellus",Georgia,serif;white-space:nowrap}
  #toast.on{opacity:1}
  #vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    box-shadow:inset 0 0 140px 30px rgba(192,57,43,.55)}
  #vignette.on{opacity:1}

  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,rgba(29,39,64,.25) 0%,rgba(11,17,32,.78) 70%);
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;z-index:10}
  .sheet{width:min(580px,100%);margin:auto;background:rgba(11,17,32,.66);border:1px solid rgba(240,169,75,.14);
    border-radius:4px;padding:clamp(18px,4vw,30px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  h1{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(28px,7vw,44px);margin:0 0 4px;line-height:1.1}
  h1 .sub{display:block;font-size:clamp(11px,3vw,14px);color:var(--lantern);letter-spacing:.22em;margin-bottom:10px}
  .lede{color:var(--ui-dim);font-size:14px;line-height:1.6;max-width:58ch;margin:0 0 18px}
  h2{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(22px,5.5vw,32px);margin:0 0 6px}
  .levels{display:grid;gap:7px;margin:0 0 18px}
  .lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.035);border:1px solid rgba(240,169,75,.16);border-radius:3px;
    padding:11px 13px;color:var(--ui-text);font:inherit;transition:background .15s,border-color .15s}
  .lvl:hover,.lvl:focus-visible{background:rgba(240,169,75,.1);border-color:var(--edge);outline:none}
  .lvl .num{font-family:"Marcellus",Georgia,serif;font-size:19px;color:var(--lantern);width:20px;flex:none}
  .lvl .t{font-family:"Marcellus",Georgia,serif;font-size:15.5px}
  .lvl .d{font-size:12px;color:var(--ui-dim);margin-top:2px}
  .lvl .best{margin-left:auto;font-size:11px;color:var(--sage);flex:none;text-align:right}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:3px 18px;
    font-size:12px;color:var(--ui-dim);border-top:1px solid rgba(240,169,75,.16);padding-top:13px}
  .keys div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .keys b{color:var(--ui-text);font-weight:600}
  .btn{font:inherit;font-size:14px;cursor:pointer;background:var(--lantern);color:#1a1205;border:0;
    border-radius:3px;padding:11px 22px;font-weight:600}
  .btn:hover{background:#ffbc60}
  .btn.ghost{background:transparent;color:var(--ui-text);border:1px solid var(--edge)}
  .btn.ghost:hover{background:rgba(240,169,75,.12)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .rec{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:13px;margin:14px 0 0;
    color:var(--ui-dim);border-top:1px solid rgba(240,169,75,.16);padding-top:13px}
  .rec b{color:var(--ui-text);font-weight:600;font-variant-numeric:tabular-nums}
  .tips{font-size:12.5px;color:var(--ui-dim);line-height:1.6;margin:12px 0 0;padding-left:18px}
  .grade{font-family:"Marcellus",Georgia,serif;font-size:clamp(30px,8vw,46px);color:var(--lantern);margin:2px 0 8px}
  .win h2{color:var(--lantern)} .lose h2{color:var(--blood)}
  .codex{border-top:1px solid rgba(240,169,75,.16);padding-top:13px;margin-top:16px;
    font-size:12.5px;color:var(--ui-dim);line-height:1.6}
  .codex h4{font-family:"Marcellus",Georgia,serif;font-weight:400;color:var(--ui-text);
    font-size:14px;margin:10px 0 3px}
  .codex b{color:var(--ui-text);font-weight:600}

  #touch{position:fixed;inset:0;z-index:5;pointer-events:none}
  #stick{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));
    bottom:calc(22px + env(safe-area-inset-bottom,0px));width:118px;height:118px;border-radius:50%;
    border:1px solid rgba(240,169,75,.3);background:rgba(11,17,32,.35);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(240,169,75,.45)}
  #tbtns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;
    grid-template-columns:repeat(2,64px);pointer-events:auto}
  .tb{height:54px;border-radius:5px;border:1px solid rgba(240,169,75,.3);background:rgba(11,17,32,.55);
    color:var(--ui-text);font:inherit;font-size:11px;line-height:1.15;touch-action:none;cursor:pointer;padding:2px}
  .tb.on{background:rgba(240,169,75,.35)}
  #look{position:absolute;right:0;top:0;bottom:250px;left:38%;pointer-events:auto;touch-action:none}
  @media (hover:hover) and (pointer:fine){ #touch{display:none} }
  @media (hover:none){
    #tools{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
    #prompt{bottom:calc(206px + env(safe-area-inset-bottom,0px))}
    #mini{left:auto;bottom:auto;right:calc(12px + env(safe-area-inset-right,0px));
      top:calc(96px + env(safe-area-inset-top,0px));width:96px;height:96px}
  }
  @media (max-width:520px){ #mini{width:104px;height:104px} .tool{min-width:50px;font-size:10px;padding:4px 6px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="objectives" class="panel"><h3>Contrat</h3><ul id="objlist"></ul></div>
  <div id="topcenter">
    <div id="detectwrap"><div id="detectbar"></div></div>
    <div id="statetxt">Dans l'ombre</div>
    <div id="tags"></div>
  </div>
  <div id="stats" class="panel">
    <div id="levelname"></div>
    <div><b id="time">0:00</b> écoulées</div>
    <div><b id="kills">0</b> éliminations</div>
  </div>
  <canvas id="mini" width="300" height="300"></canvas>
  <div id="tools" class="panel"></div>
  <div id="prompt" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="vignette"></div>
</div>

<div id="touch" class="hidden">
  <div id="look"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button class="tb" id="tbRun">Courir</button>
    <button class="tb" id="tbCrouch">Accroupi</button>
    <button class="tb" id="tbTool">Outil ▸</button>
    <button class="tb" id="tbThrow">Lancer</button>
    <button class="tb" id="tbAct">Agir</button>
    <button class="tb" id="tbKO">Assommer</button>
    <button class="tb" id="tbClimb">Grimper</button>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   0. Outils généraux
   ============================================================ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function angDelta(a,b){let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
function fmtTime(s){const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+String(r).padStart(2,"0");}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
// distance d'un point au segment, dans le plan horizontal
function distPtSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az, l2=dx*dx+dz*dz;
  if(l2<1e-8) return Math.hypot(px-ax,pz-az);
  const t=clamp(((px-ax)*dx+(pz-az)*dz)/l2,0,1);
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));
}

/* ============================================================
   1. Socle Three.js
   ============================================================ */
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
const TOUCH_DEV=matchMedia("(hover:none)").matches;
function basePR(){return Math.min(devicePixelRatio,TOUCH_DEV?1.5:2);}
renderer.setPixelRatio(basePR());
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;

const scene=new THREE.Scene();
const HORIZON=0x2e2b4a;
scene.background=new THREE.Color(HORIZON);
scene.fog=new THREE.Fog(HORIZON,40,140);
const camera=new THREE.PerspectiveCamera(62,1,0.1,440);

scene.add(new THREE.HemisphereLight(0x5b6fa6,0x221a12,0.42));
const moon=new THREE.DirectionalLight(0x9fb3e6,0.58);
moon.position.set(38,52,26); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
const sc=moon.shadow.camera;
sc.left=-46;sc.right=46;sc.top=46;sc.bottom=-46;sc.near=1;sc.far=140;
moon.shadow.bias=-0.0006; moon.shadow.normalBias=0.05;
scene.add(moon); scene.add(moon.target);
const MOON_DIR=new THREE.Vector3(38,52,26).normalize().multiplyScalar(300);

// lumières ponctuelles, réaffectées chaque image aux torches les plus proches
const LIGHT_POOL=[];
for(let i=0;i<6;i++){const l=new THREE.PointLight(0xff9038,0,15,2);scene.add(l);LIGHT_POOL.push(l);}

function onResize(){renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener("resize",onResize);onResize();

/* ---- textures peintes dans un canvas ---- */
function canvasTex(w,h,draw){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}
function wrap(w,h,fn){for(const dx of [-w,0,w])for(const dy of [-h,0,h])fn(dx,dy);}
function speckle(x,w,h,n,a){
  for(let i=0;i<n;i++){
    x.fillStyle=Math.random()<.5?"rgba(0,0,0,"+(Math.random()*a)+")":"rgba(255,240,215,"+(Math.random()*a)+")";
    const s=1+Math.random()*2.2; x.fillRect(Math.random()*w,Math.random()*h,s,s);
  }
}
function plaster(base,brick){
  return canvasTex(512,512,(x,w,h)=>{
    x.fillStyle=base; x.fillRect(0,0,w,h);
    for(let i=0;i<55;i++){
      const r=24+Math.random()*90, px=Math.random()*w, py=Math.random()*h, dk=Math.random()<.55;
      wrap(w,h,(dx,dy)=>{
        const g=x.createRadialGradient(px+dx,py+dy,0,px+dx,py+dy,r);
        g.addColorStop(0,dk?"rgba(55,35,18,.13)":"rgba(255,245,225,.11)"); g.addColorStop(1,"rgba(0,0,0,0)");
        x.fillStyle=g; x.fillRect(px+dx-r,py+dy-r,r*2,r*2);
      });
    }
    // plâtre écaillé qui laisse voir la brique crue
    for(let k=0;k<2;k++){
      const cx=60+Math.random()*(w-120), cy=60+Math.random()*(h-120), rw=34+Math.random()*60, rh=24+Math.random()*40, rot=Math.random()*3;
      x.save(); x.beginPath(); x.ellipse(cx,cy,rw,rh,rot,0,TAU); x.clip();
      x.fillStyle=brick; x.fillRect(cx-rw-60,cy-rh-60,rw*2+120,rh*2+120);
      x.strokeStyle="rgba(35,22,10,.4)"; x.lineWidth=1.5;
      for(let yy=cy-rh-60,row=0;yy<cy+rh+60;yy+=13,row++){
        x.beginPath(); x.moveTo(cx-rw-60,yy); x.lineTo(cx+rw+60,yy); x.stroke();
        for(let xx=cx-rw-60+(row%2?13:0);xx<cx+rw+60;xx+=26){x.beginPath();x.moveTo(xx,yy);x.lineTo(xx,yy+13);x.stroke();}
      }
      x.restore();
      x.strokeStyle="rgba(45,28,14,.22)"; x.lineWidth=1.5;
      x.beginPath(); x.ellipse(cx,cy,rw,rh,rot,0,TAU); x.stroke();
    }
    x.strokeStyle="rgba(40,26,12,.38)"; x.lineWidth=1.3;
    for(let k=0;k<8;k++){
      let px=30+Math.random()*(w-60), py=20+Math.random()*(h-140); x.beginPath(); x.moveTo(px,py);
      for(let s=0;s<7;s++){px+=(Math.random()-.5)*24; py+=6+Math.random()*14; x.lineTo(px,py);} x.stroke();
    }
    speckle(x,w,h,9000,.13);
  });
}
function fabric(c1,c2){
  return canvasTex(128,128,(x,w,h)=>{
    for(let i=0;i<8;i++){x.fillStyle=i%2?c2:c1; x.fillRect(i*w/8,0,w/8,h);}
    x.fillStyle="rgba(0,0,0,.18)"; for(let i=0;i<8;i++) x.fillRect(i*w/8+w/8-2,0,2,h);
    speckle(x,w,h,900,.12);
  });
}
const TEX={};
TEX.plA=plaster("#b39468","#7f5d3c");
TEX.plB=plaster("#9c7a52","#6e4f31");
TEX.plC=plaster("#c4b08c","#8a6b4a");
TEX.roof=plaster("#9a8060","#6f5539");
TEX.cobble=canvasTex(512,512,(x,w,h)=>{
  x.fillStyle="#241e17"; x.fillRect(0,0,w,h);
  const n=11, cs=w/n;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const off=(j%2)*cs/2;
    const cx=i*cs+off+(Math.random()-.5)*cs*.18, cy=j*cs+cs/2+(Math.random()-.5)*cs*.18;
    const rx=cs*.43*(.86+Math.random()*.2), ry=cs*.41*(.86+Math.random()*.2), rot=Math.random()*.7;
    const t=70+(Math.random()*30|0);
    wrap(w,h,(dx,dy)=>{
      const g=x.createRadialGradient(cx+dx-rx*.35,cy+dy-ry*.35,2,cx+dx,cy+dy,Math.max(rx,ry));
      g.addColorStop(0,"rgb("+(t+16)+","+(t+8)+","+(t-6)+")");
      g.addColorStop(1,"rgb("+(t-26)+","+(t-32)+","+(t-40)+")");
      x.fillStyle=g; x.beginPath(); x.ellipse(cx+dx,cy+dy,rx,ry,rot,0,TAU); x.fill();
    });
  }
  speckle(x,w,h,7000,.16);
});
TEX.cobble.repeat.set(72,72);
TEX.crate=canvasTex(256,256,(x,w,h)=>{
  x.fillStyle="#5a3d20"; x.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){
    const y=i*h/5;
    x.fillStyle="rgb("+(112+Math.random()*24|0)+","+(76+Math.random()*16|0)+","+(40+Math.random()*12|0)+")";
    x.fillRect(0,y+2,w,h/5-4);
    x.strokeStyle="rgba(50,30,12,.35)";
    for(let g=0;g<6;g++){const yy=y+5+Math.random()*(h/5-10); x.beginPath(); x.moveTo(0,yy);
      x.bezierCurveTo(w*.3,yy+3,w*.6,yy-3,w,yy); x.stroke();}
  }
  x.fillStyle="#4a3118"; x.fillRect(0,0,w,15); x.fillRect(0,h-15,w,15); x.fillRect(0,0,15,h); x.fillRect(w-15,0,15,h);
  x.save(); x.translate(w/2,h/2); x.rotate(Math.PI/4); x.fillRect(-w*.72,-9,w*1.44,18); x.restore();
  x.fillStyle="#1e140a"; [[8,8],[w-8,8],[8,h-8],[w-8,h-8],[w/2,8],[w/2,h-8]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],3.2,0,TAU);x.fill();});
  speckle(x,w,h,2200,.12);
});
TEX.tiles=canvasTex(256,256,(x,w,h)=>{
  x.fillStyle="#4a2416"; x.fillRect(0,0,w,h);
  const rows=8, cols=8, cw=w/cols, ch=h/rows;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const off=(j%2)*cw/2, cx=i*cw+off, cy=j*ch, t=150+(Math.random()*40|0);
    wrap(w,h,(dx,dy)=>{
      const g=x.createLinearGradient(cx+dx,0,cx+dx+cw,0);
      g.addColorStop(0,"rgb("+(t-55)+","+(t/2.8|0)+","+(t/4.2|0)+")");
      g.addColorStop(.5,"rgb("+t+","+(t/2|0)+","+(t/3.2|0)+")");
      g.addColorStop(1,"rgb("+(t-65)+","+(t/3|0)+","+(t/4.6|0)+")");
      x.fillStyle=g; x.fillRect(cx+dx+1.5,cy+dy,cw-3,ch-2);
    });
  }
  speckle(x,w,h,1500,.14);
});
TEX.tiles.repeat.set(.35,.35);
TEX.glaze=canvasTex(256,256,(x,w,h)=>{
  x.fillStyle="#173c55"; x.fillRect(0,0,w,h);
  const n=8, s=w/n;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const cx=i*s+s/2, cy=j*s+s/2;
    x.fillStyle=(i+j)%2?"#2d7a8c":"#1c5d78";
    x.beginPath(); x.moveTo(cx,cy-s/2+1); x.lineTo(cx+s/2-1,cy); x.lineTo(cx,cy+s/2-1); x.lineTo(cx-s/2+1,cy); x.fill();
    x.fillStyle="rgba(232,214,160,.85)"; x.beginPath(); x.arc(cx,cy,s*.11,0,TAU); x.fill();
  }
  speckle(x,w,h,1200,.1);
});

const stars=(function(){
  const N=1600, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    let v; do{ v=new THREE.Vector3(Math.random()*2-1,Math.random(),Math.random()*2-1); }while(v.lengthSq()>1||v.y<0.07);
    v.normalize().multiplyScalar(350); pos.set([v.x,v.y,v.z],i*3);
    const b=0.35+Math.random()*0.65, warm=Math.random()<.2;
    col.set([b,b*(warm?0.85:0.95),b*(warm?0.7:1)],i*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3)); g.setAttribute("color",new THREE.BufferAttribute(col,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:1.7,sizeAttenuation:false,vertexColors:true,fog:false,
    transparent:true,depthWrite:false,toneMapped:false}));
  p.renderOrder=-1; scene.add(p); return p;
})();

/* ============================================================
   3. Géométrie : collisions, vue
   ============================================================ */
function circleVsBoxes(pos,r,feetY,headY,boxes){
  for(let i=0;i<boxes.length;i++){
    const bx=boxes[i];
    if(bx.y1<=feetY+0.45) continue;
    if(bx.y0>=headY) continue;
    const cx=clamp(pos.x,bx.minX,bx.maxX), cz=clamp(pos.z,bx.minZ,bx.maxZ);
    const dx=pos.x-cx, dz=pos.z-cz, d2=dx*dx+dz*dz;
    if(d2>r*r) continue;
    if(d2>1e-8){ const d=Math.sqrt(d2),push=r-d; pos.x+=dx/d*push; pos.z+=dz/d*push; }
    else{
      const l=pos.x-bx.minX, ri=bx.maxX-pos.x, u=pos.z-bx.minZ, dn=bx.maxZ-pos.z;
      const m=Math.min(l,ri,u,dn);
      if(m===l)pos.x=bx.minX-r; else if(m===ri)pos.x=bx.maxX+r;
      else if(m===u)pos.z=bx.minZ-r; else pos.z=bx.maxZ+r;
    }
  }
}
function groundAt(x,z,fromY,boxes){
  let g=0;
  for(let i=0;i<boxes.length;i++){
    const bx=boxes[i];
    if(x<bx.minX||x>bx.maxX||z<bx.minZ||z>bx.maxZ) continue;
    if(bx.y1>fromY+0.45) continue;
    if(bx.y1>g) g=bx.y1;
  }
  return g;
}
function insideBox(x,z,bx,m){return x>bx.minX-m&&x<bx.maxX+m&&z>bx.minZ-m&&z<bx.maxZ+m;}
function rayBoxXZ(ox,oz,dx,dz,bx,maxT){
  let tmin=0,tmax=maxT;
  if(Math.abs(dx)<1e-7){ if(ox<bx.minX||ox>bx.maxX) return null; }
  else{ let t1=(bx.minX-ox)/dx,t2=(bx.maxX-ox)/dx; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  if(Math.abs(dz)<1e-7){ if(oz<bx.minZ||oz>bx.maxZ) return null; }
  else{ let t1=(bx.minZ-oz)/dz,t2=(bx.maxZ-oz)/dz; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  return tmin>=0?tmin:null;
}
function rayBoxSpanXZ(ox,oz,dx,dz,bx,maxT){
  let tmin=0,tmax=maxT;
  if(Math.abs(dx)<1e-7){ if(ox<bx.minX||ox>bx.maxX) return null; }
  else{ let t1=(bx.minX-ox)/dx,t2=(bx.maxX-ox)/dx; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  if(Math.abs(dz)<1e-7){ if(oz<bx.minZ||oz>bx.maxZ) return null; }
  else{ let t1=(bx.minZ-oz)/dz,t2=(bx.maxZ-oz)/dz; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  return tmin<=tmax?[Math.max(tmin,0),tmax]:null;
}
function lineOfSight(ax,ay,az,bx2,by,bz,boxes){
  const dx=bx2-ax, dz=bz-az, dist=Math.hypot(dx,dz);
  if(dist<1e-4) return true;
  const nx=dx/dist, nz=dz/dist, lowest=Math.min(ay,by);
  for(let i=0;i<boxes.length;i++){
    const bo=boxes[i];
    if(bo.y1<lowest-0.05) continue;
    const sp=rayBoxSpanXZ(ax,az,nx,nz,bo,dist-0.15);
    if(!sp||sp[0]>=dist-0.15) continue;
    const t2=Math.min(sp[1],dist-0.15);
    const h1=ay+(by-ay)*(sp[0]/dist), h2=ay+(by-ay)*(t2/dist);
    if(Math.min(h1,h2)<bo.y1-0.05&&Math.max(h1,h2)>bo.y0+0.05) return false;
  }
  return true;
}

}

let actx=null,muted=false;
function sfx(type){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const S=(ty,f1,f2,v,d)=>{o.type=ty;o.frequency.setValueAtTime(f1,t);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.01);};
    if(type==="tick") S("sine",760,null,.05,.08);
    else if(type==="alarm"){o.type="sawtooth";o.frequency.setValueAtTime(320,t);
      o.frequency.linearRampToValueAtTime(640,t+.35);g.gain.setValueAtTime(.09,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.7);o.start(t);o.stop(t+.72);}
    else if(type==="kill") S("triangle",210,70,.12,.25);
    else if(type==="good") S("sine",520,880,.08,.3);
    else if(type==="stone") S("square",420,180,.06,.13);
    else if(type==="knife") S("square",1200,500,.05,.12);
    else if(type==="smoke") S("sawtooth",180,60,.07,.5);
    else if(type==="boom") S("sawtooth",520,90,.11,.5);
    else if(type==="thud") S("sine",120,45,.11,.35);
    else if(type==="rope") S("sawtooth",300,900,.05,.5);
  }catch(e){}
}

function collectWindows(bx,boxes,wins,doors){
  const h=bx.y1-bx.y0;
  if(bx.y0>0.1||h<3.8||bx.type==="crate"||bx.type==="roofedge"||Math.min(bx.w,bx.d)<3.2) return;
  const faces=[[1,0,bx.d,bx.maxX,bx.z],[-1,0,bx.d,bx.minX,bx.z],[0,1,bx.w,bx.x,bx.maxZ],[0,-1,bx.w,bx.x,bx.minZ]];
  const rows=[2.3]; if(h>5.3) rows.push(4.4); if(h>7.5) rows.push(6.5);
  const doorFace=Math.abs(Math.round(bx.x*3+bx.z*7))%4;
  faces.forEach((f,fi)=>{
    const nx=f[0],nz=f[1],len=f[2],cx=f[3],cz=f[4];
    const at=(off,out)=>[cx+(nz?off:0)+nx*out, cz+(nx?off:0)+nz*out];
    const blocked=(off,y)=>{const o=at(off,0.4);
      return boxes.some(q=>q!==bx&&q.y1>y-0.6&&q.y0<y+0.6&&insideBox(o[0],o[1],q,0.05));};
    const rot=nx?Math.PI/2:0;
    let doorOff=null;
    if(fi===doorFace&&len>=4&&!blocked(0,1.1)){
      doorOff=0; const p=at(0,0.08); doors.push({x:p[0],z:p[1],rot,nx,nz});
    }
    const n=Math.floor((len-1.4)/2.7); if(n<1) return;
    const step=len/(n+1);
    for(let k=1;k<=n;k++){
      const off=-len/2+step*k;
      rows.forEach(y=>{
        if(y>h-0.9) return;
        if(doorOff!==null&&y<3.5&&Math.abs(off-doorOff)<1.5) return;
        if(Math.random()<0.3||blocked(off,y)) return;
        const p=at(off,0.02);
        wins.push({x:p[0],y,z:p[1],rot,nx,nz,lit:Math.random()<0.22,shut:Math.random()<0.45});
      });
    }
  });
}

}

function buildForest(lv){
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  lv.boxes.forEach(q=>{minX=Math.min(minX,q.minX);maxX=Math.max(maxX,q.maxX);minZ=Math.min(minZ,q.minZ);maxZ=Math.max(maxZ,q.maxZ);});
  const oc=(lv.ocean||[]);
  const wet=(x,z)=>oc.some(o=>Math.abs(x-o.x)<o.w/2+3&&Math.abs(z-o.z)<o.d/2+3);
  const floor=new THREE.MeshLambertMaterial({color:0x0e1a0f}), clumps=[];
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([sx,sz])=>{
    const probe=[sx?(sx>0?maxX+20:minX-20):(minX+maxX)/2, sz?(sz>0?maxZ+20:minZ-20):(minZ+maxZ)/2];
    if(wet(probe[0],probe[1])) return;
    const W=sx?70:(maxX-minX+140), D=sx?(maxZ-minZ+140):70;
    const f=new THREE.Mesh(new THREE.PlaneGeometry(W,D),floor); f.rotation.x=-Math.PI/2;
    f.position.set(sx?(sx>0?maxX+35:minX-35):(minX+maxX)/2,0.02,sz?(sz>0?maxZ+35:minZ-35):(minZ+maxZ)/2); G.root.add(f);
    for(let k=0;k<80;k++){ const dist=1.5+Math.pow(Math.random(),1.5)*55, t=Math.random();
      const along=sx?(minZ-60+t*(maxZ-minZ+120)):(minX-60+t*(maxX-minX+120));
      const x=sx?(sx>0?maxX+dist:minX-dist):along, z=sz?(sz>0?maxZ+dist:minZ-dist):along;
      if(!wet(x,z)) clumps.push([x,z,1.6+dist*0.09+Math.random()*2.2]); }
    for(let k=0;k<4;k++){ const dist=3+Math.random()*16, t=(k+0.5)/4;
      const along=sx?(minZ+t*(maxZ-minZ)):(minX+t*(maxX-minX));
      const x=sx?(sx>0?maxX+dist:minX-dist):along, z=sz?(sz>0?maxZ+dist:minZ-dist):along;
      if(!wet(x,z)) palmTree(x,z,9+Math.random()*4,false,true); }
  });
  if(!clumps.length) return;
  const im=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshLambertMaterial({color:0x1d311b}),clumps.length), o=new THREE.Object3D();
  clumps.forEach((c,k)=>{ o.position.set(c[0],c[2]*0.5,c[1]); o.rotation.set(Math.random(),Math.random()*3,0);
    o.scale.set(c[2],c[2]*(0.7+Math.random()*0.4),c[2]); o.updateMatrix(); im.setMatrixAt(k,o.matrix); });
  im.instanceMatrix.needsUpdate=true; G.root.add(im);
}

function buildMountains(lv){
  const oc=(lv.ocean||[])[0], seaA=oc?Math.atan2(oc.x,oc.z):null;
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,fog:false});
  let k=0;
  for(let a=0.2;a<TAU;a+=TAU/13){
    if(seaA!==null&&Math.abs(angDelta(a,seaA))<1.25) continue;
    const r=190+((k*53)%70), h=80+((k*37)%90), rad=50+((k*29)%45); k++;
    const geo=new THREE.ConeGeometry(rad,h,9,6,true), p=geo.attributes.position, col=new Float32Array(p.count*3);
    for(let i=0;i<p.count;i++){ const y=p.getY(i), t=(y+h/2)/h;
      if(t<0.97){ const j=0.8+Math.random()*0.35; p.setX(i,p.getX(i)*j); p.setZ(i,p.getZ(i)*j); p.setY(i,y+(Math.random()-.5)*h*0.07); }
      const c=0.02+t*0.038; col.set([c*0.75,c*1.05,c*1.2],i*3); }
    geo.setAttribute("color",new THREE.BufferAttribute(col,3));

function palmTree(x,z,h,straight,cheap){
  const g=new THREE.Group(); g.position.set(x,0,z);
  const dir=Math.random()*TAU, lean=straight?0:0.8+Math.random()*1.4, segs=cheap?5:8;
  let top=new THREE.Vector3(0,h,0);
  for(let k=0;k<segs;k++){
    const t0=k/segs, t1=(k+1)/segs, o0=t0*t0*lean, o1=t1*t1*lean;
    const a=new THREE.Vector3(Math.cos(dir)*o0,t0*h,Math.sin(dir)*o0);
    const b2=new THREE.Vector3(Math.cos(dir)*o1,t1*h,Math.sin(dir)*o1);
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.19-k*0.01,0.23-k*0.01,a.distanceTo(b2)*1.05,7),MAT.trunk);
    seg.position.copy(a).add(b2).multiplyScalar(.5);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b2.clone().sub(a).normalize());
    seg.castShadow=true; g.add(seg); top=b2;
  }
  const nl=cheap?7:10;
  for(let k=0;k<nl;k++){
    const leaf=new THREE.Mesh(LEAF_GEO,MAT.leaf); leaf.position.copy(top);
    leaf.rotation.set(0.95+Math.random()*0.5,k/nl*TAU+Math.random()*0.3,0,"YXZ");
    leaf.castShadow=true; g.add(leaf);
  }
  if(!cheap) for(let k=0;k<3;k++){ const c=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6),MAT.wood);
    c.position.set(top.x+Math.cos(k*2.1)*0.22,top.y-0.2,top.z+Math.sin(k*2.1)*0.22); g.add(c); }
  G.root.add(g); if(!cheap) G.anim.push({o:g,k:Math.random()*TAU,type:"palm"});
}

function ropeOK(p,from,to){
  const dx=to.x-from.x, dz=to.z-from.z, l=Math.hypot(dx,dz)||1;
  return to.y<=from.y+0.5&&(dx*Math.sin(p.yaw)+dz*Math.cos(p.yaw))/l>0.3;
}
const CLIMBABLE={stone:1,wood:1,rock:1,tower:1,hull:1};
function poleNear(p){
  return G.boxes.find(bx=>(bx.type==="palm"||bx.type==="mast")&&Math.hypot(p.pos.x-bx.x,p.pos.z-bx.z)<1.3
    &&p.pos.y>=bx.y0-0.3&&p.pos.y<=bx.y1+0.3);
}
function palmClimb(p){
  const pb=poleNear(p); if(!pb) return false;
  if(Math.abs(p.pos.y-pb.y1)<0.3){
    const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw), tx=pb.x+fx*0.85, tz=pb.z+fz*0.85;
    const gy=groundAt(tx,tz,pb.y1-0.5,G.boxes);
    p.climbing={t:0,dur:0.35+0.17*(pb.y1-gy),from:p.pos.clone(),to:new THREE.Vector3(tx,gy,tz),tree:true};
    sfx("rope"); return true;
  }
  if(p.pos.y<pb.y1-0.5){
    p.yaw=Math.atan2(pb.x-p.pos.x,pb.z-p.pos.z);
    p.climbing={t:0,dur:0.35+0.2*(pb.y1-p.pos.y),from:p.pos.clone(),to:new THREE.Vector3(pb.x,pb.y1,pb.z),tree:true};
    p.vy=0; sfx("rope"); return true;
  }
  return false;
}
function wallClimb(p){
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw), px=p.pos.x+fx*0.8, pz=p.pos.z+fz*0.8;
  let wall=null,bd=1e9;
  for(const bx of G.boxes){
    if(!CLIMBABLE[bx.type]||isRingWall(bx)||bx.y1<=p.pos.y+2.35||bx.y0>p.pos.y+1.2) continue;
    const cx=clamp(px,bx.minX,bx.maxX), cz=clamp(pz,bx.minZ,bx.maxZ), d=Math.hypot(px-cx,pz-cz);
    if(d<0.75&&d<bd){bd=d;wall=bx;}
  }
  return wall;
}
function startWallClimb(p,wall){
  const cx=clamp(p.pos.x,wall.minX,wall.maxX), cz=clamp(p.pos.z,wall.minZ,wall.maxZ);
  let ox=p.pos.x-cx, oz=p.pos.z-cz; const ol=Math.hypot(ox,oz)||1; ox/=ol; oz/=ol;
  const from=new THREE.Vector3(cx+ox*0.4,p.pos.y,cz+oz*0.4);
  const tx=clamp(cx-ox*0.8,wall.minX+0.35,wall.maxX-0.35), tz=clamp(cz-oz*0.8,wall.minZ+0.35,wall.maxZ-0.35);
  p.yaw=Math.atan2(-ox,-oz);
  p.climbing={t:0,dur:0.45+0.26*(wall.y1-p.pos.y),from,to:new THREE.Vector3(tx,wall.y1,tz),tree:true,wall:true};
  p.vy=0; sfx("stone");
}

/* ---- braises, lumière, impacts ---- */
function setupEmbers(){
  G.embers=null;
  const N=G.quality==="low"?0:200;
  if(!N||!G.torches.length) return;
  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("color",new THREE.BufferAttribute(col,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.11,vertexColors:true,transparent:true,
    depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false}));
  pts.frustumCulled=false; G.root.add(pts);
  const data=[]; for(let k=0;k<N;k++) data.push({life:Math.random()*2,max:2,vx:0,vy:0,vz:0});
  G.embers={pts,pos,col,data,N};
}
function updateEmbers(dt){
  const E=G.embers; if(!E||!E.pts.visible) return;
  for(let k=0;k<E.N;k++){
    const d=E.data[k]; d.life-=dt;
    if(d.life<=0){
      const tr=G.torches[(Math.random()*G.torches.length)|0];
      if(!tr.on){ E.col[k*3]=E.col[k*3+1]=E.col[k*3+2]=0; d.life=0.3; continue; }
      E.pos[k*3]=tr.x+(Math.random()-.5)*0.25; E.pos[k*3+1]=3.05; E.pos[k*3+2]=tr.z+(Math.random()-.5)*0.25;
      d.vx=(Math.random()-.5)*0.4; d.vy=0.7+Math.random()*0.9; d.vz=(Math.random()-.5)*0.4;
      d.max=d.life=1+Math.random()*1.6;
    }
    d.vx+=Math.sin(VT*2+k)*dt*0.3;
    E.pos[k*3]+=d.vx*dt; E.pos[k*3+1]+=d.vy*dt; E.pos[k*3+2]+=d.vz*dt;
    const it=Math.max(0,d.life/d.max);
    E.col[k*3]=it; E.col[k*3+1]=it*0.5; E.col[k*3+2]=it*0.12;
  }
  E.pts.geometry.attributes.position.needsUpdate=true;
  E.pts.geometry.attributes.color.needsUpdate=true;
}
function updateLightPool(cx,cz){
  const src=[];
  G.torches.forEach((t,k)=>{ if(t.on) src.push({x:t.x,y:3.1,z:t.z,d:(t.x-cx)**2+(t.z-cz)**2,f:k*1.7,r:15,i:2.4}); });
  for(const g of G.guards) if(!g.dead&&g.def.torch)
    src.push({x:g.pos.x,y:g.pos.y+1.8,z:g.pos.z,d:(g.pos.x-cx)**2+(g.pos.z-cz)**2,f:g.pos.x,r:10,i:1.8});
  src.sort((a,b)=>a.d-b.d);
  const max=G.quality==="low"?2:LIGHT_POOL.length;
  const cut=src[max]?Math.sqrt(src[max].d):1e9;
  for(let k=0;k<LIGHT_POOL.length;k++){
    const l=LIGHT_POOL[k], s=k<max?src[k]:null;
    if(s){
      const fade=clamp((cut-Math.sqrt(s.d))/5,0,1);
      l.position.set(s.x,s.y,s.z); l.distance=s.r;
      l.intensity=s.i*fade*(0.9+Math.sin(VT*10+s.f)*0.06+Math.sin(VT*23+s.f*2)*0.04);
    }else l.intensity=0;
  }
}
function killFX(g){
  const N=28, pos=new Float32Array(N*3), vel=[];
  for(let k=0;k<N;k++){
    pos.set([g.pos.x,g.pos.y+0.9,g.pos.z],k*3);
    vel.push(new THREE.Vector3((Math.random()-.5)*3.2,Math.random()*2.4,(Math.random()-.5)*3.2));
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xcbb38a,size:0.09,transparent:true,depthWrite:false}));
  G.root.add(pts); G.fx.push({pts,vel,t:0});
}
function updateFX(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i]; f.t+=dt;
    const a=f.pts.geometry.attributes.position;
    for(let k=0;k<f.vel.length;k++){
      f.vel[k].y-=6*dt;
      a.array[k*3]+=f.vel[k].x*dt; a.array[k*3+1]=Math.max(0.05,a.array[k*3+1]+f.vel[k].y*dt); a.array[k*3+2]+=f.vel[k].z*dt;
    }
    a.needsUpdate=true;
    f.pts.material.opacity=Math.max(0,1-f.t/0.9);
    if(f.t>0.9){ G.root.remove(f.pts); f.pts.geometry.dispose(); G.fx.splice(i,1); }
  }
}

}

  G.camYaw=lv.start.yaw+Math.PI; G.camPitch=0.35; G.camDistEff=G.camDist;

  G.guards=lv.guards.map((def,gi)=>{
    const mesh=humanoid(guardLook(def,gi));
    const y=def.y||0; mesh.position.set(def.x,y,def.z); G.root.add(mesh);

function lightAt(x,z){
  let l=0;
  for(const t of G.torches){
    if(!t.on) continue;
    const d=Math.hypot(x-t.x,z-t.z);
    if(d<t.r) l=Math.max(l,1-d/t.r);
  }
  for(const g of G.guards){
    if(g.dead||!g.def.torch) continue;
    const d=Math.hypot(x-g.pos.x,z-g.pos.z);
    if(d<8) l=Math.max(l,(1-d/8)*0.9);
  }
  return Math.min(1,l);
}
function smokeBlocks(ax,az,bx,bz){
  for(const s of G.smokes){
    if(s.t<0.25) continue;
    if(distPtSeg(s.x,s.z,ax,az,bx,bz)<s.r) return true;
  }
  return false;
}

  let dy=(t.clientY-(r.top+r.height/2))/(r.height/2);
  const l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;}
  touch.move.x=dx; touch.move.y=dy;
  knob.style.transform="translate("+(dx*34)+"px,"+(dy*34)+"px)";
}

  for(const t of e.changedTouches) if(t.identifier===stickId) stickPos(t);},{passive:false});

  stickId=null;touch.move.x=touch.move.y=0;knob.style.transform="";}}

function playerHeight(){return G.player.crouch?1.15:1.8;}
function chestY(){return G.player.pos.y+(G.player.crouch?0.62:1.28);}
function inHide(x,z){
  for(const h of G.hides)
    if(x>h.x-h.w/2&&x<h.x+h.w/2&&z>h.z-h.d/2&&z<h.z+h.d/2) return h;
  return null;
}
function makeNoise(x,z,radius,bump){
  for(const g of G.guards){
    if(g.dead) continue;
    const d=Math.hypot(g.pos.x-x,g.pos.z-z);
    if(d<radius){
      g.aware=clamp(g.aware+bump*(1-d/radius),0,0.85);
      if(g.state!=="ALERT"){ g.state="INVESTIGATE"; g.poi={x,z}; g.searchT=0; }
    }
  }
}
function selectTool(k){ if(G.tool!==k){G.tool=k;updateToolsUI();} }
function cycleTool(){
  const i=TOOLS.findIndex(t=>t.k===G.tool);
  for(let s=1;s<=TOOLS.length;s++){
    const t=TOOLS[(i+s)%TOOLS.length];
    if(G.tools[t.k]>0){selectTool(t.k);return;}
  }
  selectTool(TOOLS[(i+1)%TOOLS.length].k);
}
function tryClimb(){
  const p=G.player; if(p.climbing||p.gliding||p.stun>0) return;
  // tyrolienne prioritaire
  for(const r of G.ropes){
    for(const [from,to] of [[r.a,r.b],[r.b,r.a]]){
      if(Math.hypot(p.pos.x-from.x,p.pos.z-from.z)<2&&Math.abs(p.pos.y-(from.y-0.2))<1.6&&ropeOK(p,from,to)){
        if(p.carrying){toast("Impossible avec un corps sur l'épaule");return;}
        p.gliding={t:0,dur:Math.max(0.7,from.distanceTo(to)/11),from:p.pos.clone(),
          to:new THREE.Vector3(to.x,to.y,to.z)};
        sfx("rope"); return;
      }
    }
  }
  if(p.carrying){toast("Impossible de grimper avec un corps");return;}
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  let best=null,bestD=1e9;
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.y1<=p.pos.y+0.35||bx.y1>p.pos.y+2.35) continue;
    const px=p.pos.x+fx*0.8, pz=p.pos.z+fz*0.8;
    const cx=clamp(px,bx.minX,bx.maxX), cz=clamp(pz,bx.minZ,bx.maxZ);
    const d=Math.hypot(px-cx,pz-cz);
    if(d<0.75&&d<bestD){bestD=d;best=bx;}
  }
  if(best){
    const tx=clamp(p.pos.x+fx*1.5,best.minX+0.45,best.maxX-0.45);
    const tz=clamp(p.pos.z+fz*1.5,best.minZ+0.45,best.maxZ-0.45);
    p.climbing={t:0,dur:0.55,from:p.pos.clone(),to:new THREE.Vector3(tx,best.y1,tz)};
    p.vy=0; sfx("stone");
  }else{
    const w=wallClimb(p);
    if(w) startWallClimb(p,w);
    else if(palmClimb(p)){}
    else if(p.onGround&&!p.swim){ const run=p.speedNow>4.2; p.vy=run?6.3:5.0; p.onGround=false; }
  }
}
function throwDir(){ return new THREE.Vector3(-Math.sin(G.camYaw),0,-Math.cos(G.camYaw)); }
function useTool(){
  const p=G.player;
  if(p.carrying){toast("Les mains sont prises");return;}
  const k=G.tool;
  if(!G.tools[k]){toast("Plus de "+TOOLS.find(t=>t.k===k).n.toLowerCase());return;}
  if(k==="knife") return throwKnife(false);
  if(k==="dart") return throwKnife(true);
  G.tools[k]--; updateToolsUI();
  const dir=throwDir();
  const mat=k==="smoke"?MAT.steel:(k==="coins"?MAT.gold:MAT.wood);
  const m=new THREE.Mesh(new THREE.SphereGeometry(k==="stone"?0.11:0.16,6,5),mat);
  m.position.set(p.pos.x,p.pos.y+1.3,p.pos.z); G.root.add(m);
  G.projectiles.push({kind:k,mesh:m,vel:new THREE.Vector3(dir.x*13,4.4,dir.z*13),t:0,landed:false,fuse:0});
  sfx("stone");
}
function throwKnife(dart){
  const p=G.player;
  const dir=throwDir(), range=dart?15:18;
  // visée assistée : la cible la plus proche dans un cône devant
  let best=null,bd=1e9;
  for(const g of G.guards){
    if(g.dead||g.poison>0) continue;
    const dx=g.pos.x-p.pos.x, dz=g.pos.z-p.pos.z, d=Math.hypot(dx,dz);
    if(d>range||d<0.6) continue;
    const dot=(dx*dir.x+dz*dir.z)/d;
    if(dot<0.9) continue;
    if(!lineOfSight(p.pos.x,chestY(),p.pos.z,g.pos.x,g.pos.y+1.3,g.pos.z,G.boxes)) continue;
    if(d<bd){bd=d;best=g;}
  }
  if(!best){toast("Aucune cible en ligne de mire");return;}
  G.tools[dart?"dart":"knife"]--; updateToolsUI();
  const m=new THREE.Mesh(dart?new THREE.BoxGeometry(0.03,0.03,0.26):new THREE.SphereGeometry(0.07,8,6),dart?MAT.bambooPole:MAT.pebble);
  m.position.set(p.pos.x,chestY(),p.pos.z); G.root.add(m);
  G.projectiles.push({kind:dart?"dart":"knife",mesh:m,target:best,t:0,
    from:m.position.clone(),dur:Math.max(0.12,bd/(dart?40:34))});

}
const KILL_NOTE={
  ko:"Assommé — il se réveillera, sauf si tu le caches",
  accident:"Un accident — personne ne soupçonnera une lame",
  poison:"Le poison a fait son œuvre"
};
function killGuard(g,type,label){

  if(g.torch) g.torch.visible=false;

function reviveGuard(g){
  g.dead=false; g.ko=false; g.fall=null; g.deadT=0;

function poisonGuard(g){

  toast("Touché — il ne le sait pas encore"); sfx("tick");
}
function scatterCoins(x,y,z){
  const grp=new THREE.Group(); grp.position.set(x,y+0.02,z);
  for(let k=0;k<9;k++){ const c=new THREE.Mesh(COIN_GEO,MAT.gold);
    c.position.set((Math.random()-.5)*0.8,0.01,(Math.random()-.5)*0.8); c.rotation.set(Math.random()*0.3,Math.random()*3,0); grp.add(c); }
  const gl=new THREE.Sprite(GLOW_GOLD_MAT); gl.scale.set(1.2,1.2,1); gl.position.y=0.2; grp.add(gl);
  G.root.add(grp); G.coinPiles.push({mesh:grp,t:0});
  sfx("stone");
  let n=0;
  for(const g of G.guards){
    if(g.dead||g.state==="ALERT"||g.poison>0||g.frozen||Math.abs(g.pos.y-y)>1.5) continue;
    const d=Math.hypot(g.pos.x-x,g.pos.z-z); if(d>10) continue;
    if(d>4&&!lineOfSight(g.pos.x,g.pos.y+1.5,g.pos.z,x,y+0.3,z,G.boxes)) continue;
    const a=n*2.4; g.coins={x:x+Math.cos(a)*0.7,z:z+Math.sin(a)*0.7,t:0}; n++;
  }
  toast(n?(n>1?n+" gardes accourent vers les pièces":"Un garde a entendu tinter les pièces"):"Personne n'a entendu tinter les pièces");
}
function supportBox(g){
  if(g.pos.y<0.5) return null;
  for(const bx of G.boxes) if(Math.abs(bx.y1-g.pos.y)<0.25&&insideBox(g.pos.x,g.pos.z,bx,0.05)) return bx;
  return null;
}
function startTakedown(a,ko){
  const p=G.player, g=a.guard;
  if(a.type==="chute"){
    // tiré par la cheville depuis le pied du mur : il tombe à côté de l'assassin
    const bx=supportBox(g);
    let ox=p.pos.x-clamp(p.pos.x,bx.minX,bx.maxX), oz=p.pos.z-clamp(p.pos.z,bx.minZ,bx.maxZ);
    const ol=Math.hypot(ox,oz)||1;
    const to=new THREE.Vector3(p.pos.x+ox/ol*0.9,0,p.pos.z+oz/ol*0.9);
    to.y=groundAt(to.x,to.z,p.pos.y+0.5,G.boxes);
    g.frozen=true; g.pull={t:0,dur:0.7,from:g.pos.clone(),to};
    p.yaw=Math.atan2(g.pos.x-p.pos.x,g.pos.z-p.pos.z); p.grabT=0.75; p.stun=0.75; G.slow=0.7;
    sfx("rope"); return;
  }
  const aerial=a.type==="aerien"||a.type==="tyrolienne";
  let dx=p.pos.x-g.pos.x, dz=p.pos.z-g.pos.z; const dl=Math.hypot(dx,dz)||1; dx/=dl; dz/=dl;
  const to=new THREE.Vector3(g.pos.x+dx*0.65,g.pos.y,g.pos.z+dz*0.65);
  const second=ko?null:a.second;
  g.frozen=true; if(second) second.frozen=true;
  p.yaw=Math.atan2(g.pos.x-p.pos.x,g.pos.z-p.pos.z);
  p.lunge={t:0,dur:aerial?0.5:(a.type==="elan"?0.28:0.22),from:p.pos.clone(),to,arc:aerial?0.9:0.12,
    pending:{g,type:ko?"ko":a.type,label:ko?"assommé":a.label,second}};
  p.climbing=null; p.gliding=null;
  G.slow=ko?0.35:(aerial?0.85:0.55); p.bladeT=ko?0:0.9; sfx(ko?"thud":"knife");
}
function tryKO(){
  if(G.phase!=="play"||!G.player||G.player.lunge) return;
  const a=G.promptAction;
  if(!a||a.kind!=="kill") return;
  if(!a.koOK){ toast(a.guard.def.isTarget?"Une cible ne s'assomme pas":"Impossible de l'assommer ainsi"); return; }
  startTakedown(a,true); G.promptAction=null; updatePrompt();
}

/* ---- charges suspendues : l'accident parfait ---- */
function buildHazards(list){
  G.hazards=list.map(hz=>{
    const ang=Math.atan2(hz.x-hz.px,hz.z-hz.pz), len=Math.hypot(hz.x-hz.px,hz.z-hz.pz);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,5.4,8),MAT.wood);
    post.position.set(hz.px,2.7,hz.pz); post.castShadow=true; G.root.add(post);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,len+0.5),MAT.wood);
    arm.position.set((hz.px+hz.x)/2+Math.sin(ang)*0.25,5.2,(hz.pz+hz.z)/2+Math.cos(ang)*0.25);
    arm.rotation.y=ang; arm.castShadow=true; G.root.add(arm);
    const brace=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,1.4),MAT.wood);
    brace.rotation.order="YXZ"; brace.rotation.set(-0.78,ang,0);
    brace.position.set(hz.px+Math.sin(ang)*0.5,4.7,hz.pz+Math.cos(ang)*0.5); G.root.add(brace);
    const cleat=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.3,0.1),MAT.iron);
    cleat.position.set(hz.px+Math.sin(ang)*0.16,1.1,hz.pz+Math.cos(ang)*0.16); G.root.add(cleat);
    const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1,4),MAT.rope); G.root.add(rope);
    const load=new THREE.Group();
    const cr=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9),MAT.crate); cr.castShadow=true; load.add(cr);
    for(let k=0;k<9;k++){ const j=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),MAT.trunk);
      j.position.set((Math.random()-.5)*0.8,0.3+Math.random()*0.4,(Math.random()-.5)*0.8); j.castShadow=true; load.add(j); }
    const net=new THREE.Mesh(new THREE.IcosahedronGeometry(0.78,1),NET); net.position.y=0.15; load.add(net);
    load.position.set(hz.x,3.6,hz.z); G.root.add(load);
    return {x:hz.x,z:hz.z,px:hz.px,pz:hz.pz,load,rope,y:3.6,vy:0,cut:false,done:false};
  });
}
function cutHazard(h){ h.cut=true; sfx("rope"); toast("La corde cède…"); }
function updateHazards(dt){
  for(const h of G.hazards){
    if(h.cut&&!h.done){
      h.vy-=19*dt; h.y+=h.vy*dt;
      if(h.y<=0.45){
        h.y=0.45; h.done=true; sfx("boom"); makeNoise(h.x,h.z,9,0.3);
        let n=0;
        for(const g of G.guards){
          if(g.dead||g.pos.y>1) continue;
          if(Math.hypot(g.pos.x-h.x,g.pos.z-h.z)<1.9){ killGuard(g,"accident","accident"); n++; }
        }
        const p=G.player;
        if(Math.hypot(p.pos.x-h.x,p.pos.z-h.z)<1.3&&p.pos.y<1){ p.stun=0.9; toast("Tu as failli y passer"); }
        else if(!n) toast("La charge s'écrase… sur personne");
        h.load.rotation.set(0.15,h.load.rotation.y,0.25);
      }
    }
    h.load.position.y=h.y;
    if(!h.cut) h.load.rotation.y=Math.sin(VT*0.6+h.x)*0.15;
    h.rope.visible=!h.cut;
    const top=5.1, bot=h.y+0.75;
    h.rope.scale.y=Math.max(0.01,top-bot); h.rope.position.set(h.x,(top+bot)/2,h.z);
  }
  for(let i=G.coinPiles.length-1;i>=0;i--){
    const c=G.coinPiles[i]; c.t+=dt;
    if(c.t>14){ G.root.remove(c.mesh); G.coinPiles.splice(i,1); }
  }
}
function dropBody(){
  const p=G.player; if(!p.carrying) return;
  const g=p.carrying;
  g.mesh.parent.remove(g.mesh); G.root.add(g.mesh);
  g.pos.set(p.pos.x,p.pos.y,p.pos.z);
  g.mesh.position.copy(g.pos); g.mesh.rotation.set(0,g.yaw,Math.PI/2.1);
  g.carried=false; p.carrying=null; toast("Corps déposé");
}
function tryAction(){
  if(G.player.lunge) return;
  const a=G.promptAction; if(!a) return;
  const p=G.player;
  if(a.kind==="kill"){ startTakedown(a,false); }
  else if(a.kind==="hazard"){ cutHazard(a.hazard); }
  else if(a.kind==="vista"){ syncVista(); }
  else if(a.kind==="pickup"){
    a.pickup.taken=true; a.pickup.mesh.visible=false;
    completeObjective(a.pickup.oid); sfx("good"); toast(a.pickup.label+" en main");
  }else if(a.kind==="inter"){
    a.item.done=true; if(a.item.oid!=="bell") a.item.mesh.visible=false;
    if(a.item.oid==="bell") G.bellSabotaged=true;
    completeObjective(a.item.oid); sfx("good"); toast(a.item.toast||"Fait");
  }else if(a.kind==="torch"){
    a.torch.on=false; a.torch.flame.visible=false; a.torch.halo.visible=false;
    a.torch.relightT=0; sfx("smoke"); toast(a.torch.style==="lan"?"Lanterne éteinte":"Flambeau éteint");
  }else if(a.kind==="carry"){
    const g=a.guard; g.carried=true; p.carrying=g;
    G.root.remove(g.mesh); p.mesh.add(g.mesh);
    g.mesh.position.set(0,1.55,-0.35); g.mesh.rotation.set(0,0,Math.PI/2);
    g.mesh.scale.setScalar(0.92); toast("Corps sur l'épaule");
  }else if(a.kind==="stash"){
    const g=p.carrying; g.stashed=true; g.mesh.visible=false;
    p.mesh.remove(g.mesh); p.carrying=null;
    G.bodiesHidden++; sfx("good"); toast("Corps dissimulé — il ne sera pas trouvé");
  }else if(a.kind==="drop"){ dropBody(); }
  G.promptAction=null; updatePrompt();
}
function completeObjective(id){
  const o=G.level.objectives.find(o=>o.id===id);
  if(o&&!o.done){o.done=true;updateObjectivesUI();}
}
function mainObjectivesDone(){
  return G.level.objectives.every(o=>o.done||o.optional||o.exit);
}

/* ============================================================
   11. Perception
   ============================================================ */
function guardForward(g){return {x:Math.sin(g.yaw),z:Math.cos(g.yaw)};}
function perceive(g,dt){
  const p=G.player;
  const dx=p.pos.x-g.pos.x, dz=p.pos.z-g.pos.z, dist=Math.hypot(dx,dz);
  const range=g.def.range*(G.alarm>0?1.15:1)*(g.picking?0.45:1);
  let visible=false, rate=0;
  if(dist<range+0.5){
    const f=guardForward(g);
    const dot=(dx*f.x+dz*f.z)/(dist||1);
    const inCone=Math.acos(clamp(dot,-1,1))<g.def.fov*(g.picking?0.35:1)/2;
    const close=dist<2.3;
    const hidden=p.hidden&&dist>2.2;
    if((inCone||close)&&!hidden&&!smokeBlocks(g.pos.x,g.pos.z,p.pos.x,p.pos.z)){
      if(lineOfSight(g.pos.x,g.pos.y+1.62,g.pos.z,p.pos.x,chestY(),p.pos.z,G.boxes)){
        visible=true;
        const prox=clamp(1-dist/range,0.08,1);
        rate=(0.32+prox*0.92)*g.def.note;
        rate*=(0.5+1.15*p.light);          // la lumière trahit
        if(p.crouch) rate*=0.58;
        if(p.speedNow>4.2) rate*=1.5;
        if(p.carrying) rate*=1.35;          // un corps sur l'épaule se voit
        if(p.swim) rate*=0.6;               // seule la tête dépasse
        if(p.onPalm) rate*=0.35;            // perdu dans les palmes
        if(!inCone) rate*=0.6;
        if(G.alarm>0) rate*=1.35;
      }
    }
  }
  if(visible){ g.aware=clamp(g.aware+rate*dt,0,1); g.lastSeen={x:p.pos.x,z:p.pos.z}; }
  else g.aware=clamp(g.aware-(g.state==="ALERT"?0.16:0.34)*dt,0,1);
  return visible;
}
function hearNoise(g,dt){
  const p=G.player;
  let radius=0;
  if(p.speedNow>4.2) radius=13; else if(p.speedNow>1.2) radius=p.crouch?2.5:7;
  if(radius<=0) return;
  const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
  if(d<radius){
    g.aware=clamp(g.aware+0.32*dt*(1-d/radius),0,0.72);
    if(g.state==="PATROL"&&g.aware>0.3){g.state="INVESTIGATE";g.poi={x:p.pos.x,z:p.pos.z};g.searchT=0;}
  }
}
function triggerAlarm(from){
  if(G.alarm<=0){ G.alarmCount++; sfx("alarm"); toast("Alarme ! Les gardes convergent."); }
  G.alarm=G.bellSabotaged?14:26;
  G.guards.forEach(g=>{ if(g.dead||g.def.isTarget) return;
    g.coins=null; g.state="ALERT"; g.poi={x:from.x,z:from.z}; g.searchT=0; g.aware=Math.max(g.aware,0.55); });
}

/* ============================================================
   12. Boucle : joueur
   ============================================================ */
function updatePlayer(dt){
  const p=G.player;
  if(p.stun>0){ p.stun-=dt; p.speedNow=0; }

  if(p.lunge){
    const c=p.lunge; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1);
    p.pos.lerpVectors(c.from,c.to,k); p.pos.y+=Math.sin(k*Math.PI)*c.arc;
    p.speedNow=0;
    if(k>=1){
      p.pos.copy(c.to); const pd=c.pending; p.lunge=null; p.vy=0; p.onGround=true; p.fallFrom=p.pos.y;
      pd.g.frozen=false; killGuard(pd.g,pd.type,pd.label);
      if(pd.type==="elan") makeNoise(p.pos.x,p.pos.z,9,0.3);
      if(pd.second){ pd.second.frozen=false; killGuard(pd.second,"double","double assassinat"); }
    }
  }else if(p.gliding){
    const c=p.gliding; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1);
    p.pos.lerpVectors(c.from,c.to,k);
    p.pos.y-=Math.sin(k*Math.PI)*0.35;
    p.yaw=Math.atan2(c.to.x-c.from.x,c.to.z-c.from.z);
    p.speedNow=0;
    if(k>=1){ p.pos.copy(c.to); p.gliding=null; p.vy=0; p.fallFrom=p.pos.y; }
  }else if(p.climbing){
    const c=p.climbing; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1), e=k*k*(3-2*k);
    if(c.wall){ const kx=clamp((k-0.9)/0.1,0,1);
      p.pos.x=lerp(c.from.x,c.to.x,kx); p.pos.z=lerp(c.from.z,c.to.z,kx); p.pos.y=lerp(c.from.y,c.to.y+0.1,Math.min(1,k/0.9)); }
    else{ p.pos.x=lerp(c.from.x,c.to.x,e); p.pos.z=lerp(c.from.z,c.to.z,e);
      p.pos.y=c.tree?lerp(c.from.y,c.to.y,e):lerp(c.from.y,c.to.y+0.2,Math.sin(e*Math.PI/2)); }
    p.speedNow=0;
    if(k>=1){ p.pos.copy(c.to); p.climbing=null; p.vy=0; p.onGround=true; p.fallFrom=p.pos.y; }
  }else{
    let ix=0,iz=0;
    if(p.stun<=0){
      if(K.KeyW||K.ArrowUp) iz+=1;
      if(K.KeyS||K.ArrowDown) iz-=1;
      if(K.KeyA||K.ArrowLeft) ix-=1;
      if(K.KeyD||K.ArrowRight) ix+=1;
      if(Math.abs(touch.move.x)>0.12||Math.abs(touch.move.y)>0.12){ix+=touch.move.x;iz-=touch.move.y;}
    }
    const mag=Math.hypot(ix,iz);
    const running=(K.ShiftLeft||K.ShiftRight||touch.run)&&!p.crouch&&!p.carrying;
    let spd=p.crouch?1.65:(running?5.4:3.1);
    if(p.swim) spd*=p.crouch?0.85:0.6;
    if(p.carrying) spd*=0.6;
    if(mag>0.01){
      ix/=Math.max(mag,1); iz/=Math.max(mag,1);
      const fwd={x:-Math.sin(G.camYaw),z:-Math.cos(G.camYaw)};
      const rgt={x:Math.cos(G.camYaw),z:-Math.sin(G.camYaw)};
      const mx=fwd.x*iz+rgt.x*ix, mz=fwd.z*iz+rgt.z*ix;
      const ml=Math.hypot(mx,mz)||1;
      p.pos.x+=mx/ml*spd*dt; p.pos.z+=mz/ml*spd*dt;
      p.speedNow=spd*Math.min(mag,1);
      p.yaw+=angDelta(p.yaw,Math.atan2(mx,mz))*Math.min(1,dt*13);
      p.phase+=dt*(running?13:8.5);
    }else{ p.speedNow=0; p.phase+=dt*1.2; }
    circleVsBoxes(p.pos,0.42,p.pos.y,p.pos.y+playerHeight(),G.boxes);

    p.vy-=19*dt;
    let ny=p.pos.y+p.vy*dt;
    const gy=groundAt(p.pos.x,p.pos.z,p.pos.y,G.boxes);
    if(ny<=gy){
      const drop=p.fallFrom-gy;
      if(!p.onGround&&drop>3.5){
        const h=inHide(p.pos.x,p.pos.z);
        if(inWater(p.pos.x,p.pos.z)){ toast("Plongeon — personne n'a rien entendu"); splashFX(p.pos.x,p.pos.z); }
        else if(h&&(h.kind==="hay"||h.kind==="stall")){
          toast("Saut de la foi — atterrissage silencieux"); sfx("good");
        }else{
          sfx("thud"); makeNoise(p.pos.x,p.pos.z,14,0.4);
          p.stun=0.45; toast("Chute lourde : le bruit a porté");
        }
      }
      ny=gy; p.vy=0; p.onGround=true; p.fallFrom=gy;
    }else{ p.onGround=false; if(p.vy>0) p.fallFrom=Math.max(p.fallFrom,ny); }
    p.pos.y=ny;
  }

  const wasSwim=p.swim;
  p.swim=p.pos.y<0.3&&inWater(p.pos.x,p.pos.z);
  if(p.swim&&!wasSwim&&!p.lunge) splashFX(p.pos.x,p.pos.z);
  p.onPalm=G.boxes.some(bx=>bx.type==="palm"&&Math.abs(p.pos.y-bx.y1)<0.25&&Math.hypot(p.pos.x-bx.x,p.pos.z-bx.z)<0.9);
  { const tp=inTapu(p.pos.x,p.pos.z); if(tp&&!p.inTapu) toast("Marae — lieu tapu. Ici, on ne verse pas le sang."); p.inTapu=tp; }
  p.mesh.position.copy(p.pos);
  if(p.swim) p.mesh.position.y-=(p.crouch?2.05:1.2)+Math.sin(VT*2.4)*0.05;
  p.mesh.rotation.y=p.yaw;
  p.mesh.scale.y=lerp(p.mesh.scale.y,(p.crouch&&!p.swim)?0.66:1,Math.min(1,dt*12));
  poseWalk(p.mesh,p.phase,p.speedNow>0.2?(p.crouch?0.28:0.55):0.04);
  const ud=p.mesh.userData;
  if(ud.cape){
    const want=0.07+p.speedNow*0.075+((p.gliding||p.lunge||!p.onGround)?0.7:0)+Math.sin(VT*2.3)*0.03;
    ud.cape.rotation.x=lerp(ud.cape.rotation.x,want,Math.min(1,dt*7));
  }
  if(ud.blade){ p.bladeT=Math.max(0,p.bladeT-dt); ud.blade.scale.z=lerp(ud.blade.scale.z,p.bladeT>0?1:0.05,Math.min(1,dt*18)); }
  if(p.lunge){ const ty=p.lunge.pending.type;
    if(ty==="aerien"||ty==="tyrolienne"){ ud.armR.rotation.x=-2.6; ud.armL.rotation.x=-2.6; }
    else if(ty==="ko"){ ud.armR.rotation.x=-1.1; ud.armL.rotation.x=-1.4; }
    else{ ud.armR.rotation.x=-1.5; ud.armL.rotation.x=-0.6; } }
  if(p.swim){ ud.armL.rotation.x=-1.6+Math.sin(p.phase)*1.3; ud.armR.rotation.x=-1.6-Math.sin(p.phase)*1.3; }
  if(p.climbing&&p.climbing.tree){ const k=Math.sin(VT*9); ud.armL.rotation.x=-2.6+k*0.4; ud.armR.rotation.x=-2.6-k*0.4;
    ud.legL.rotation.x=k*0.5; ud.legR.rotation.x=-k*0.5; }
  { // saut de la foi : le piqué, bras en croix
    const diving=!p.onGround&&!p.climbing&&!p.gliding&&!p.lunge&&p.vy<-5&&(p.fallFrom-p.pos.y)>2;
    const kk=Math.min(1,dt*7);
    p.mesh.rotation.x=lerp(p.mesh.rotation.x,diving?1.2:0,kk);
    ud.armL.rotation.z=lerp(ud.armL.rotation.z,diving?-1.4:0,kk); ud.armR.rotation.z=lerp(ud.armR.rotation.z,diving?1.4:0,kk); }
  if(p.grabT>0){ p.grabT-=dt; ud.armR.rotation.x=-2.9; ud.armL.rotation.x=-2.9; }
  if(ud.sash) ud.sash.rotation.x=lerp(ud.sash.rotation.x,
    0.12+p.speedNow*0.09+Math.sin(VT*7)*0.05*Math.min(1,p.speedNow/3)+(p.onGround?0:0.5),Math.min(1,dt*8));

  const h=inHide(p.pos.x,p.pos.z);
  p.hidden=(!!h&&p.pos.y<1.6&&(h.kind==="jar"||p.crouch))||(p.swim&&p.crouch);
  p.light=lightAt(p.pos.x,p.pos.z)*(p.hidden?0.25:(h?0.6:1))*(p.onPalm?0.5:1);

  updateProjectiles(dt);
  updateSmokes(dt);
}
function updateProjectiles(dt){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const s=G.projectiles[i]; s.t+=dt;
    if(s.kind==="knife"||s.kind==="dart"){
      const k=clamp(s.t/s.dur,0,1);
      s.mesh.position.lerpVectors(s.from,
        new THREE.Vector3(s.target.pos.x,s.target.pos.y+1.3,s.target.pos.z),k);
      if(k>=1){
        if(!s.target.dead){ if(s.kind==="dart") poisonGuard(s.target);
          else killGuard(s.target,"distance","pierre de fronde"); }
        G.root.remove(s.mesh); s.mesh.geometry.dispose(); G.projectiles.splice(i,1);
      }
      continue;
    }
    if(!s.landed){
      s.vel.y-=19*dt;
      s.mesh.position.addScaledVector(s.vel,dt);
      const gy=groundAt(s.mesh.position.x,s.mesh.position.z,s.mesh.position.y+2,G.boxes);
      let hitWall=false;
      for(const bx of G.boxes)
        if(insideBox(s.mesh.position.x,s.mesh.position.z,bx,0)&&
           s.mesh.position.y<bx.y1&&s.mesh.position.y>bx.y0){hitWall=true;break;}
      if(s.mesh.position.y<=gy+0.1||hitWall||s.t>3.2){
        s.mesh.position.y=Math.max(gy+0.1,s.mesh.position.y);
        s.landed=true; s.fuse=0;
        if(s.kind==="stone"){ sfx("stone"); makeNoise(s.mesh.position.x,s.mesh.position.z,11,0.35);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
        else if(s.kind==="coins"){ scatterCoins(s.mesh.position.x,gy,s.mesh.position.z);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
        else if(s.kind==="smoke"){ sfx("smoke");
          spawnSmoke(s.mesh.position.x,s.mesh.position.z);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
      }
    }else if(s.kind==="cracker"){
      s.fuse+=dt;
      if(s.fuse>2.6){
        sfx("boom"); makeNoise(s.mesh.position.x,s.mesh.position.z,19,0.6);
        for(const g of G.guards) if(!g.dead&&
          Math.hypot(g.pos.x-s.mesh.position.x,g.pos.z-s.mesh.position.z)<19&&g.state!=="ALERT"){
          g.searchT=-3; }
        G.root.remove(s.mesh); G.projectiles.splice(i,1);
      }
    }
  }
}
function spawnSmoke(x,z){
  const g=new THREE.Group(); g.position.set(x,0,z);
  const puffs=[];
  for(let k=0;k<7;k++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:SMOKE_TEX,transparent:true,
      depthWrite:false,opacity:0.9}));
    const a=Math.random()*TAU, r=Math.random()*3.2;
    sp.position.set(Math.cos(a)*r,0.8+Math.random()*1.6,Math.sin(a)*r);
    sp.scale.setScalar(4+Math.random()*2.5);
    g.add(sp); puffs.push(sp);
  }
  G.root.add(g);
  G.smokes.push({x,z,r:4.6,t:0,life:12,mesh:g,puffs});
}
function updateSmokes(dt){
  for(let i=G.smokes.length-1;i>=0;i--){
    const s=G.smokes[i]; s.t+=dt;
    const fade=s.t>s.life-2.5?clamp((s.life-s.t)/2.5,0,1):Math.min(1,s.t*3);
    s.puffs.forEach((p,k)=>{ p.material.opacity=0.85*fade;
      p.position.y+=dt*0.12; p.rotation=k*0.3+s.t*0.1; });
    if(s.t>s.life){ G.root.remove(s.mesh); G.smokes.splice(i,1); }
  }
}

/* ============================================================
   13. Boucle : gardes
   ============================================================ */
function moveGuard(g,tx,tz,speed,dt){
  const dx=tx-g.pos.x, dz=tz-g.pos.z, d=Math.hypot(dx,dz);
  if(d<0.25) return true;
  const nx=dx/d, nz=dz/d;
  const ox=g.pos.x, oz=g.pos.z;
  g.pos.x+=nx*speed*dt; g.pos.z+=nz*speed*dt;
  circleVsBoxes(g.pos,0.45,g.pos.y,g.pos.y+1.8,G.boxes);
  if(g.pos.y<0.5&&inWater(g.pos.x,g.pos.z,0.3)){ g.pos.x=ox; g.pos.z=oz;
    g.yaw+=angDelta(g.yaw,Math.atan2(nx,nz))*Math.min(1,dt*6); return true; }
  g.yaw+=angDelta(g.yaw,Math.atan2(nx,nz))*Math.min(1,dt*6);
  g.phase+=dt*speed*2.6;
  return false;
}
function nearestWaypoint(g){
  let bi=0,bd=1e9;
  g.def.path.forEach((w,i)=>{const d=Math.hypot(w[0]-g.pos.x,w[1]-g.pos.z); if(d<bd){bd=d;bi=i;}});
  return bi;
}
function updateGuards(dt){
  const p=G.player;
  let maxAware=0;

  // les torches éteintes sont rallumées par un garde qui passe
  for(const t of G.torches){
    if(t.on) continue;
    let near=false;
    for(const g of G.guards)
      if(!g.dead&&g.state!=="ALERT"&&Math.hypot(g.pos.x-t.x,g.pos.z-t.z)<4){near=true;break;}
    if(near){ t.relightT+=dt;
      if(t.relightT>3){ t.on=true; t.flame.visible=true; t.halo.visible=true;
        makeNoise(t.x,t.z,6,0.15); toast("Un soldat a rallumé la flamme"); }
    }else t.relightT=0;
  }

  for(const g of G.guards){
    if(g.dead){
      if(g.stashed) continue;
      if(g.fall&&!g.carried){
        g.fall.t=Math.min(1,g.fall.t+dt*3.2); const e=1-Math.pow(1-g.fall.t,3);
        g.mesh.rotation.z=Math.PI/2.1*e*g.fall.dir; g.mesh.position.y=g.pos.y+0.25*e;
        if(g.fall.t>=1) g.fall=null;
      }
      if(g.ko&&!g.carried){ g.koT-=dt; if(g.koT<=0){ reviveGuard(g); continue; } }
      if(g.carried) continue;
      g.deadT+=dt;
      if(g.deadT<26||g.ko){
        for(const o of G.guards){
          if(o===g||o.dead||o.state==="ALERT") continue;
          const d=Math.hypot(o.pos.x-g.pos.x,o.pos.z-g.pos.z);
          if(d<7&&lineOfSight(o.pos.x,o.pos.y+1.6,o.pos.z,g.pos.x,g.pos.y+0.4,g.pos.z,G.boxes)){
            if(g.accident){
              if(o.state==="PATROL"){ o.state="INVESTIGATE"; o.poi={x:g.pos.x,z:g.pos.z}; o.aware=Math.max(o.aware,0.3); o.searchT=0; }
              if(!g.accSeen){ g.accSeen=true; toast("Un garde découvre l'accident — il n'y voit que de la malchance"); }
              continue;
            }
            if(o.state!=="INVESTIGATE"){G.bodiesFound++;toast(g.ko?"Un garde inconscient a été découvert":"Un corps a été découvert");}
            if(g.ko) g.koT=Math.min(g.koT,3.5);
            o.state="INVESTIGATE"; o.poi={x:g.pos.x,z:g.pos.z};
            o.aware=Math.max(o.aware,0.6); o.searchT=0;
          }
        }
      }
      continue;
    }

    if(g.pull){
      const c=g.pull; c.t+=dt; const k=clamp(c.t/c.dur,0,1);
      g.pos.x=lerp(c.from.x,c.to.x,k); g.pos.z=lerp(c.from.z,c.to.z,k);
      g.pos.y=lerp(c.from.y,c.to.y,k*k)+Math.sin(k*Math.PI)*0.6;
      g.mesh.position.copy(g.pos); g.mesh.rotation.x=k*1.4;
      if(k>=1){ g.pos.copy(c.to); g.mesh.rotation.x=0; killGuard(g,"chute","tiré dans le vide");
        sfx("thud"); makeNoise(g.pos.x,g.pos.z,6,0.2); }
      continue;
    }
    if(g.frozen) continue;
    if(g.poison>0){
      g.poison-=dt; g.spr.visible=false;
      if(g.poison<=0){ killGuard(g,"poison","poison"); continue; }
      const path=g.def.path;
      if(path.length>1){ const w=path[g.wp%path.length]; if(moveGuard(g,w[0],w[1],g.def.speed*0.5,dt)) g.wp=(g.wp+1)%path.length; }
      g.yaw+=Math.sin(VT*4.3+g.pos.x)*dt*1.6;
      g.pos.y=lerp(g.pos.y,groundAt(g.pos.x,g.pos.z,g.pos.y+0.4,G.boxes),Math.min(1,dt*10));
      g.mesh.position.copy(g.pos); g.mesh.rotation.set(0,g.yaw,Math.sin(VT*3.1)*0.2);
      poseWalk(g.mesh,g.phase,0.3);
      const u=g.mesh.userData; u.armL.rotation.x=-0.5; u.headG.rotation.x=0.4;
      continue;
    }
    const visible=perceive(g,dt);
    hearNoise(g,dt);

    if(g.aware>=1){
      g.state="ALERT"; triggerAlarm(p.pos);
    }else if(g.aware>0.45&&g.state==="PATROL"){
      g.state="INVESTIGATE"; g.coins=null;
      g.poi=g.lastSeen?{x:g.lastSeen.x,z:g.lastSeen.z}:{x:p.pos.x,z:p.pos.z};
      g.searchT=0;
    }
    if(g.aware>G.maxSeen) G.maxSeen=g.aware;

    const boost=G.alarm>0?1.3:1;
    g.picking=false;
    if(g.coins&&g.state!=="ALERT"){
      // penché sur les pièces : il ne voit presque plus rien
      const c=g.coins;
      if(moveGuard(g,c.x,c.z,g.def.speed*1.1,dt)){ c.t+=dt; g.picking=true; g.phase+=dt*0.5;
        if(c.t>6){ g.coins=null; g.state="PATROL"; g.wp=nearestWaypoint(g); g.waitT=0; } }
    }else if(g.state==="PATROL"){
      const path=g.def.path;
      if(path.length>1){
        if(g.waitT>0){ g.waitT-=dt; g.phase+=dt*0.8;
          if(g.idle==="look") g.yaw=g.restYaw+Math.sin((g.def.wait-g.waitT)*1.9)*0.6; }
        else{
          const w=path[g.wp%path.length];
          if(moveGuard(g,w[0],w[1],g.def.speed,dt)){ g.wp=(g.wp+1)%path.length; g.waitT=g.def.wait;
            g.restYaw=g.yaw; g.idle=["look","look","stretch","lean"][(Math.random()*4)|0]; }
        }
      }else g.yaw+=dt*0.35;
    }else if(g.state==="INVESTIGATE"){
      if(visible) g.poi={x:p.pos.x,z:p.pos.z};
      const arrived=g.poi?moveGuard(g,g.poi.x,g.poi.z,g.def.speed*1.18*boost,dt):true;
      if(arrived){
        g.searchT+=dt; g.yaw+=Math.sin(g.searchT*2.1)*dt*2.4;
        if(g.searchT>4.5&&g.aware<0.35){ g.state="PATROL"; g.wp=nearestWaypoint(g); g.waitT=0; g.poi=null; }
      }
    }else{
      if(visible){ g.poi={x:p.pos.x,z:p.pos.z}; g.searchT=0; }
      const arrived=g.poi?moveGuard(g,g.poi.x,g.poi.z,g.def.speed*1.45*boost,dt):true;
      if(arrived&&!visible){
        g.searchT+=dt; g.yaw+=Math.sin(g.searchT*2.6)*dt*3;
        if(g.searchT>7){ g.state="INVESTIGATE"; g.searchT=0; }
      }
      const catchD=g.def.brute?1.7:1.35;
      if(visible&&Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z)<catchD&&Math.abs(p.pos.y-g.pos.y)<2){
        endLevel(false,"Rattrapé par "+g.def.name.toLowerCase()+"."); return;
      }
    }

    const gy=groundAt(g.pos.x,g.pos.z,g.pos.y+0.4,G.boxes);
    g.pos.y=lerp(g.pos.y,gy,Math.min(1,dt*10));
    g.mesh.position.copy(g.pos);
    g.mesh.rotation.y=g.yaw;
    poseWalk(g.mesh,g.phase,g.state==="PATROL"?0.42:0.55);
    { // petite vie : respiration, regard, étirements, ramassage
      const u=g.mesh.userData, idle=g.state==="PATROL"&&g.waitT>0&&!g.coins;
      g.mesh.rotation.z=0;
      u.torso.scale.y=1+Math.sin(VT*2.2+g.pos.x)*0.014;
      u.headG.rotation.x=lerp(u.headG.rotation.x,g.picking?0.6:0,Math.min(1,dt*5));
      u.headG.rotation.y=idle&&g.idle==="look"?Math.sin(VT*1.3+g.pos.z)*0.45:lerp(u.headG.rotation.y,0,Math.min(1,dt*4));
      if(idle&&g.idle==="stretch"){ const k=Math.sin(clamp((g.def.wait-g.waitT)/g.def.wait,0,1)*Math.PI);
        u.armL.rotation.x=-2.8*k; u.armR.rotation.x=-2.8*k; }
      if(idle&&g.idle==="lean"){ g.mesh.rotation.z=0.08; }
      if(g.picking){ u.armR.rotation.x=-0.9; u.armL.rotation.x=-0.6; }
      g.mesh.scale.y=lerp(g.mesh.scale.y,g.picking?0.74:1,Math.min(1,dt*6));
      if(u.pennant) u.pennant.rotation.y=Math.sin(VT*3+g.pos.x)*0.4;
    }

    if(g.aware>0.25){
      g.spr.visible=true;
      g.spr.material.map=(g.state==="ALERT"||g.aware>=1)?TEX_X:TEX_Q;
      g.spr.material.needsUpdate=true;
      g.spr.position.set(g.pos.x,g.pos.y+2.35,g.pos.z);
    }else g.spr.visible=false;
    if(g.marker) g.marker.position.set(g.pos.x,g.pos.y+2.95+Math.sin(VT*3)*0.08,g.pos.z);
    if(g.tag) g.tag.position.set(g.pos.x,g.pos.y+2.45,g.pos.z);

    if(g.aware>maxAware) maxAware=g.aware;
  }

  G.coneTick++;
  if(G.showCones&&G.coneTick%3===0) for(const g of G.guards) if(!g.dead) refreshCone(g);
  G.guards.forEach(g=>{g.cone.visible=G.showCones&&!g.dead;});
  G.player.detect=maxAware;
  if(maxAware>0.3&&maxAware<1&&Math.random()<0.06) sfx("tick");
}
function refreshCone(g){
  const N=g.coneN, half=g.def.fov*(g.picking?0.35:1)/2, R=g.def.range*(g.picking?0.45:1);
  const pts=[];
  for(let i=0;i<=N;i++){
    const a=-half+(2*half)*(i/N);
    const wx=Math.sin(g.yaw+a), wz=Math.cos(g.yaw+a);
    let t=R;
    for(const bx of G.boxes){
      if(bx.y1<g.pos.y+1.0||bx.y0>g.pos.y+1.8) continue;
      const h=rayBoxXZ(g.pos.x,g.pos.z,wx,wz,bx,t);
      if(h!==null&&h<t) t=h;
    }
    for(const s of G.smokes){
      const d=distPtSeg(s.x,s.z,g.pos.x,g.pos.z,g.pos.x+wx*t,g.pos.z+wz*t);
      if(d<s.r){ const dd=Math.hypot(s.x-g.pos.x,s.z-g.pos.z)-s.r; if(dd>0&&dd<t) t=dd; }
    }
    pts.push([Math.sin(a)*t,Math.cos(a)*t]);
  }
  const arr=g.cone.geometry.attributes.position.array;
  for(let i=0;i<N;i++){
    const o=i*9;
    arr[o]=0;arr[o+1]=0;arr[o+2]=0;
    arr[o+3]=pts[i][0];arr[o+4]=0;arr[o+5]=pts[i][1];
    arr[o+6]=pts[i+1][0];arr[o+7]=0;arr[o+8]=pts[i+1][1];
  }
  g.cone.geometry.attributes.position.needsUpdate=true;
  g.cone.geometry.computeBoundingSphere();
  g.cone.position.set(g.pos.x,g.pos.y+0.07,g.pos.z);
  g.cone.rotation.y=g.yaw;
  const c=g.state==="ALERT"?0xe0503c:(g.state==="INVESTIGATE"?0xf0a94b:0xf0d060);
  g.cone.material.color.setHex(c);
  g.cone.material.opacity=g.state==="ALERT"?0.62:(g.state==="INVESTIGATE"?0.46:0.34);
}

/* ============================================================
   14. Caméra
   ============================================================ */
function updateCamera(dt){
  const p=G.player;
  const tgt=new THREE.Vector3(p.pos.x,p.pos.y+(p.crouch?1.0:1.45),p.pos.z);
  const cp=Math.cos(G.camPitch);
  const dir=new THREE.Vector3(Math.sin(G.camYaw)*cp,Math.sin(G.camPitch),Math.cos(G.camYaw)*cp);
  if(G.sync){ G.sync.t+=dt; G.camYaw+=dt*2.2; G.camPitch=lerp(G.camPitch,0.3,Math.min(1,dt*2)); if(G.sync.t>2.8) G.sync=null; }
  G.camDistEff=lerp(G.camDistEff||G.camDist,G.slow>0?3.3:(G.sync?10:G.camDist),Math.min(1,dt*6));
  let dist=G.camDistEff;
  const fovT=G.slow>0?50:62;
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov=lerp(camera.fov,fovT,Math.min(1,dt*6));camera.updateProjectionMatrix();}
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.type==="palm"||bx.type==="mast") continue;
    const t=rayBoxXZ(tgt.x,tgt.z,dir.x,dir.z,bx,dist);
    if(t!==null){
      const hy=tgt.y+dir.y*t;
      if(hy>bx.y0+0.1&&hy<bx.y1-0.05&&t<dist) dist=Math.max(1.6,t-0.35);
    }
  }
  const want=tgt.clone().addScaledVector(dir,dist);
  if(want.y<0.6) want.y=0.6;
  camera.position.lerp(want,Math.min(1,dt*14));
  camera.lookAt(tgt);
  moon.target.position.set(p.pos.x,0,p.pos.z);
  moon.position.set(p.pos.x+34,52,p.pos.z+24);
}
function snapCamera(){
  const p=G.player, cp=Math.cos(G.camPitch);
  camera.fov=62; camera.updateProjectionMatrix();
  camera.position.set(p.pos.x+Math.sin(G.camYaw)*cp*G.camDist,
    p.pos.y+1.45+Math.sin(G.camPitch)*G.camDist,
    p.pos.z+Math.cos(G.camYaw)*cp*G.camDist);
  camera.lookAt(p.pos.x,p.pos.y+1.45,p.pos.z);
}

/* ============================================================
   15. Invites contextuelles
   ============================================================ */
function assassinationOn(g){
  if(g.frozen||g.pull) return null;
  const p=G.player;
  const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
  const dy=p.pos.y-g.pos.y;
  if(p.gliding) return (dy>0.8&&dy<8&&d<3.4)?{type:"tyrolienne",label:"assassinat depuis la tyrolienne"}:null;
  if(dy>1.7&&dy<7&&d<2.8) return {type:"aerien",label:"assassinat aérien"};
  if(-dy>2.2&&-dy<7.5&&d<3.9&&p.onGround&&g.aware<0.6){
    const bx=supportBox(g);
    if(bx&&Math.hypot(p.pos.x-clamp(p.pos.x,bx.minX,bx.maxX),p.pos.z-clamp(p.pos.z,bx.minZ,bx.maxZ))<0.95)
      return {type:"chute",label:"tirer dans le vide"};
  }
  if(Math.abs(dy)>1.3) return null;
  if(p.speedNow>4.2&&d<2.7&&g.aware<0.5&&!g.def.brute&&!p.carrying) return {type:"elan",label:"assassinat en pleine course"};
  if(d>2.0) return null;
  if(p.hidden) return {type:"embuscade",label:"assassinat depuis la cachette"};
  if(g.picking||g.poison>0) return {type:"dos",label:"assassinat par surprise"};
  const f=guardForward(g);
  const dot=((p.pos.x-g.pos.x)*f.x+(p.pos.z-g.pos.z)*f.z)/(d||1);
  if(g.def.brute){ return dot<-0.35?{type:"dos",label:"assassinat dans le dos"}:null; }
  if(dot<0.2||g.aware<0.4) return {type:"dos",label:"assassinat dans le dos"};
  return null;
}
function computePrompt(){
  const p=G.player; G.promptAction=null;

  if(p.carrying){
    const h=inHide(p.pos.x,p.pos.z);
    if(h&&h.kind!=="bush") G.promptAction={kind:"stash",text:"dissimuler le corps"};
    else G.promptAction={kind:"drop",text:"déposer le corps"};
    return updatePrompt();
  }
  // assassinats
  let best=null,bd=1e9,info=null;
  for(const g of G.guards){
    if(g.dead) continue;
    const a=assassinationOn(g);
    if(!a) continue;
    const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
    if(d<bd){bd=d;best=g;info=a;}
  }
  if(best&&(inTapu(p.pos.x,p.pos.z)||inTapu(best.pos.x,best.pos.z))){
    G.promptAction={kind:"tapu",text:"lieu tapu : on n'y verse pas le sang"}; return updatePrompt(); }
  if(best){
    let second=null;
    for(const o of (info.type==="chute"||info.type==="tyrolienne"?[]:G.guards)){
      if(o===best||o.dead||o.frozen) continue;
      if(Math.hypot(o.pos.x-best.pos.x,o.pos.z-best.pos.z)<2.6&&
         Math.hypot(o.pos.x-p.pos.x,o.pos.z-p.pos.z)<3.4&&
         Math.abs(o.pos.y-best.pos.y)<1.2){ second=o; break; }
    }
    G.promptAction={kind:"kill",guard:best,type:second?"double":info.type,
      koOK:!best.def.isTarget&&info.type!=="chute"&&info.type!=="elan",
      label:second?"double assassinat":info.label,second,
      text:(second?"double assassinat sur ":info.label+" sur ")+best.def.name.toLowerCase()};
    return updatePrompt();
  }
  // corps à emporter
  for(const g of G.guards){
    if(!g.dead||g.carried||g.stashed) continue;
    if(Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z)<1.8&&Math.abs(p.pos.y-g.pos.y)<1.4){
      G.promptAction={kind:"carry",guard:g,text:"charger le corps"}; return updatePrompt();
    }
  }
  if(G.vista&&!G.vista.done&&Math.hypot(p.pos.x-G.vista.x,p.pos.z-G.vista.z)<1.7&&Math.abs(p.pos.y-G.vista.y)<0.6){
    G.promptAction={kind:"vista",text:"synchroniser le point de vue"}; return updatePrompt(); }
  for(const pk of G.pickups){
    if(pk.taken) continue;
    if(Math.hypot(p.pos.x-pk.x,p.pos.z-pk.z)<1.8&&p.pos.y<1.5){
      G.promptAction={kind:"pickup",pickup:pk,text:"prendre « "+pk.label+" »"}; return updatePrompt();
    }
  }
  for(const it of G.inter){
    if(it.done) continue;
    if(Math.hypot(p.pos.x-it.x,p.pos.z-it.z)<it.r){
      G.promptAction={kind:"inter",item:it,text:it.prompt}; return updatePrompt();
    }
  }
  for(const hz of G.hazards){
    if(hz.cut) continue;
    if(Math.hypot(p.pos.x-hz.px,p.pos.z-hz.pz)<1.7&&p.pos.y<1.5){
      G.promptAction={kind:"hazard",hazard:hz,text:"couper la corde du filet de noix de coco"}; return updatePrompt();
    }
  }
  for(const t of G.torches){
    if(!t.on) continue;
    if(Math.hypot(p.pos.x-t.x,p.pos.z-t.z)<1.9&&p.pos.y<1.5){
      G.promptAction={kind:"torch",torch:t,text:t.style==="lan"?"éteindre la lanterne":"éteindre le flambeau"}; return updatePrompt();
    }
  }
  updatePrompt();
}
const promptEl=document.getElementById("prompt");
function updatePrompt(){
  const a=G.promptAction;
  if(a){ promptEl.innerHTML=(a.kind==="tapu"?"":"<kbd>E</kbd>")+a.text+(a.koOK?'<span class="alt"><kbd>R</kbd>assommer</span>':'');
    promptEl.classList.add("on"); return; }
  const p=G.player;
  for(const r of G.ropes)
    for(const [from,to] of [[r.a,r.b],[r.b,r.a]])
      if(Math.hypot(p.pos.x-from.x,p.pos.z-from.z)<2&&Math.abs(p.pos.y-(from.y-0.2))<1.6&&ropeOK(p,from,to)){
        promptEl.innerHTML="<kbd>Espace</kbd>tyrolienne"; promptEl.classList.add("on"); return; }
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.y1<=p.pos.y+0.35||bx.y1>p.pos.y+2.35) continue;
    const px=p.pos.x+fx*0.8,pz=p.pos.z+fz*0.8;
    const cx=clamp(px,bx.minX,bx.maxX),cz=clamp(pz,bx.minZ,bx.maxZ);
    if(Math.hypot(px-cx,pz-cz)<0.75){
      promptEl.innerHTML="<kbd>Espace</kbd>grimper"; promptEl.classList.add("on"); return; }
  }
  if(!p.climbing&&wallClimb(p)){ promptEl.innerHTML="<kbd>Espace</kbd>escalader"; promptEl.classList.add("on"); return; }
  const pn=poleNear(p);
  if(pn&&!p.climbing&&(Math.abs(p.pos.y-pn.y1)<0.3||p.pos.y<pn.y1-0.5)){
    promptEl.innerHTML="<kbd>Espace</kbd>"+(Math.abs(p.pos.y-pn.y1)<0.3?"redescendre":(pn.type==="mast"?"grimper au mât":"grimper au cocotier"));
    promptEl.classList.add("on"); return; }
  promptEl.classList.remove("on");
}

function updateHUD(dt){
  const p=G.player,d=p.detect;
  elBar.style.width=(d*100).toFixed(0)+"%";

  else if(d>=0.75){elState.textContent="Repéré";elState.className="bad";}

  else {elState.textContent="Dans l'ombre";elState.className="";}
  const tg=[];
  if(p.hidden) tg.push('<span class="hide">Caché</span>');
  if(p.light>0.55) tg.push('<span class="lit">Pleine lumière</span>');
  else if(p.light>0.2) tg.push('Pénombre');

  elTags.innerHTML=tg.join(" · ");
  elTime.textContent=fmtTime(G.time);
  elKills.textContent=G.kills;
  elLevelName.textContent=G.level.name;
  elVig.classList.toggle("on",d>0.6||G.alarm>0);

  drawMini();

function drawMini(){
  const lv=G.level;
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const bx of lv.boxes){minX=Math.min(minX,bx.minX);maxX=Math.max(maxX,bx.maxX);
    minZ=Math.min(minZ,bx.minZ);maxZ=Math.max(maxZ,bx.maxZ);}
  const W=mini.width,pad=10,span=Math.max(maxX-minX,maxZ-minZ)||1,s=(W-pad*2)/span;
  const ox=pad-minX*s+((span-(maxX-minX))*s)/2, oz=pad-minZ*s+((span-(maxZ-minZ))*s)/2;
  const X=x=>ox+x*s, Z=z=>oz+z*s;
  mctx.clearRect(0,0,W,W);
  mctx.fillStyle="rgba(60,140,160,.35)";
  for(const w of lv.water||[]) mctx.fillRect(X(w.x-w.w/2),Z(w.z-w.d/2),w.w*s,w.d*s);
  for(const bx of lv.boxes){
    if(bx.type==="void") continue;
    mctx.fillStyle=(bx.type==="palm"||bx.type==="mast")?"rgba(111,160,106,.8)":(bx.y1<1.2?"rgba(255,255,255,.10)":
      "rgba(217,191,149,"+Math.min(0.75,0.18+bx.y1*0.04).toFixed(2)+")");
    mctx.fillRect(X(bx.minX),Z(bx.minZ),(bx.maxX-bx.minX)*s,(bx.maxZ-bx.minZ)*s);
  }
  mctx.fillStyle="rgba(111,143,106,.45)";
  for(const h of lv.hides) mctx.fillRect(X(h.x-h.w/2),Z(h.z-h.d/2),h.w*s,h.d*s);
  mctx.strokeStyle="rgba(240,169,75,.5)"; mctx.lineWidth=2;
  for(const r of G.ropes){mctx.beginPath();mctx.moveTo(X(r.a.x),Z(r.a.z));mctx.lineTo(X(r.b.x),Z(r.b.z));mctx.stroke();}
  for(const t of G.torches){
    mctx.fillStyle=t.on?"rgba(240,169,75,.75)":"rgba(120,110,95,.5)";
    mctx.beginPath();mctx.arc(X(t.x),Z(t.z),3,0,TAU);mctx.fill();
  }
  mctx.strokeStyle=mainObjectivesDone()?"#6f8f6a":"rgba(111,143,106,.35)";
  mctx.lineWidth=3; mctx.beginPath(); mctx.arc(X(lv.exit.x),Z(lv.exit.z),lv.exit.r*s,0,TAU); mctx.stroke();
  mctx.fillStyle="#f0a94b";
  G.pickups.forEach(pk=>{if(!pk.taken){mctx.beginPath();mctx.arc(X(pk.x),Z(pk.z),5,0,TAU);mctx.fill();}});
  G.guards.forEach(g=>{
    if(g.dead){
      if(g.stashed||g.carried) return;
      mctx.fillStyle="rgba(192,57,43,.55)";
      mctx.beginPath();mctx.arc(X(g.pos.x),Z(g.pos.z),4,0,TAU);mctx.fill(); return;
    }
    const c=g.def.isTarget?"#f0a94b":(g.state==="ALERT"?"#e0503c":(g.state==="INVESTIGATE"?"#f0d060":"#c9ab7c"));
    mctx.fillStyle=c;
    mctx.beginPath();mctx.arc(X(g.pos.x),Z(g.pos.z),g.def.isTarget?6:5,0,TAU);mctx.fill();
    mctx.strokeStyle=c;mctx.lineWidth=2;mctx.beginPath();
    mctx.moveTo(X(g.pos.x),Z(g.pos.z));
    mctx.lineTo(X(g.pos.x+Math.sin(g.yaw)*4.5),Z(g.pos.z+Math.cos(g.yaw)*4.5));mctx.stroke();
  });
  const p=G.player,a=p.yaw;
  mctx.fillStyle=p.hidden?"#6f8f6a":"#ffffff";
  mctx.beginPath();
  mctx.moveTo(X(p.pos.x+Math.sin(a)*6),Z(p.pos.z+Math.cos(a)*6));
  mctx.lineTo(X(p.pos.x+Math.sin(a+2.4)*4.5),Z(p.pos.z+Math.cos(a+2.4)*4.5));
  mctx.lineTo(X(p.pos.x+Math.sin(a-2.4)*4.5),Z(p.pos.z+Math.cos(a-2.4)*4.5));
  mctx.closePath();mctx.fill();
}

  if(G.phase!=="play") return;
