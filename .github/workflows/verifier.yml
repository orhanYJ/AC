# Vérifie le jeu à chaque poussée. La mise en ligne elle-même est faite par
# GitHub Pages, réglé sur « Deploy from a branch », dossier /docs : Pages sert
# le contenu de docs/, où index.html ouvre le jeu.
#
# On ne publie pas depuis ce workflow : le jeton d'Actions n'a pas le droit de
# créer le site Pages la première fois (« Resource not accessible by
# integration »), donc l'activation reste un réglage du dépôt, à faire une fois.
name: Vérifier le jeu

on:
  push:
    branches: [claude/jeu-infiltration-file-pxebtb]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier le jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Géométrie des niveaux
        run: node outils/valider-niveaux.js

      - name: Syntaxe, crochet de test et sources externes
        run: node outils/verifier-script.js

      - name: Le dossier publié ouvre bien le jeu
        run: |
          test -f docs/fenua.html || { echo "docs/fenua.html manque : c'est le jeu lui-même."; exit 1; }
          test -f docs/index.html || { echo "docs/index.html manque : la racine du site renverrait une erreur 404."; exit 1; }
          grep -q 'fenua.html' docs/index.html || { echo "docs/index.html ne renvoie pas vers fenua.html."; exit 1; }
          echo "docs/ contient le jeu et un index qui y renvoie"
