# Vérifie le jeu, puis le met en ligne sur GitHub Pages.
# Le site publié sert fenua.html à la racine, donc https://orhanyj.github.io/AC/
# ouvre directement le jeu.
name: Mettre le jeu en ligne

on:
  push:
    branches: [claude/jeu-infiltration-file-pxebtb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule mise en ligne à la fois, sans interrompre celle qui est en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier le jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Géométrie des niveaux
        run: node outils/valider-niveaux.js
      - name: Syntaxe, crochet de test et sources externes
        run: node outils/verifier-script.js

  publier:
    name: Publier sur GitHub Pages
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true active Pages tout seul la première fois,
      # il n'y a rien à cocher dans les réglages du dépôt
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp fenua.html _site/index.html   # la racine ouvre le jeu
          cp fenua.html _site/fenua.html   # l'ancienne adresse continue de marcher
          touch _site/.nojekyll            # pas de Jekyll, on sert les fichiers tels quels
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
