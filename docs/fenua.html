function tryAction(){
  if(G.player.lunge) return;
  const a=G.promptAction; if(!a) return;
  const p=G.player;
  if(a.kind==="kill"){ startTakedown(a,false); }
  else if(a.kind==="hazard"){ cutHazard(a.hazard); }
  else if(a.kind==="vista"){ syncVista(); }
  else if(a.kind==="pickup"){
    a.pickup.taken=true; a.pickup.mesh.visible=false;
    completeObjective(a.pickup.oid); sfx("good"); toast(a.pickup.label+" en main");
  }else if(a.kind==="inter"){
    a.item.done=true;
    if(a.item.look==="captif"){ a.item.captif.visible=false; sfx("rope"); }          // il file, les liens restent
    else if(a.item.look==="keg"){ spawnSmoke(a.item.x,a.item.z); a.item.mesh.visible=false; sfx("boom");
      makeNoise(a.item.x,a.item.z,10,0.35); }                                         // la poudre prend
    else if(a.item.oid!=="bell") a.item.mesh.visible=false;
    if(a.item.oid==="bell") G.bellSabotaged=true;
    completeObjective(a.item.oid); sfx("good"); toast(a.item.toast||"Fait");
  }else if(a.kind==="torch"){
    a.torch.on=false; a.torch.flame.visible=false; a.torch.halo.visible=false;
    a.torch.relightT=0; sfx("smoke"); toast(a.torch.style==="lan"?"Lanterne éteinte":"Flambeau éteint");
  }else if(a.kind==="carry"){
    const g=a.guard; g.carried=true; p.carrying=g;
    G.root.remove(g.mesh); p.mesh.add(g.mesh);
    g.mesh.position.set(0,1.55,-0.35); g.mesh.rotation.set(0,0,Math.PI/2);
    g.mesh.scale.setScalar(0.92); toast("Corps sur l'épaule");
  }else if(a.kind==="stash"){
    const g=p.carrying; g.stashed=true; g.mesh.visible=false;
    g.pos.set(p.pos.x,p.pos.y,p.pos.z);      // le corps reste là où on l'a glissé
    p.mesh.remove(g.mesh); p.carrying=null;
    G.bodiesHidden++; sfx("good"); toast("Corps dissimulé — il ne sera pas trouvé");
  }else if(a.kind==="drop"){ dropBody(); }
  G.promptAction=null; updatePrompt();
}
function completeObjective(id){
  const o=G.level.objectives.find(o=>o.id===id);
  if(o&&!o.done){o.done=true;updateObjectivesUI();}
}
function mainObjectivesDone(){
  return G.level.objectives.every(o=>o.done||o.optional||o.exit);
}

/* ============================================================
   11. Perception
   ============================================================ */
function guardForward(g){return {x:Math.sin(g.yaw),z:Math.cos(g.yaw)};}
function perceive(g,dt){
  const p=G.player;
  const dx=p.pos.x-g.pos.x, dz=p.pos.z-g.pos.z, dist=Math.hypot(dx,dz);
  const range=g.def.range*(G.alarm>0?1.15:1)*(g.picking?0.45:1);
  let visible=false, rate=0;
  if(dist<range+0.5){
    const f=guardForward(g);
    const dot=(dx*f.x+dz*f.z)/(dist||1);
    const inCone=Math.acos(clamp(dot,-1,1))<g.def.fov*(g.picking?0.35:1)/2;
    const close=dist<2.3;
    const hidden=p.hidden&&dist>2.2;
    if((inCone||close)&&!hidden&&!smokeBlocks(g.pos.x,g.pos.z,p.pos.x,p.pos.z)){
      if(lineOfSight(g.pos.x,g.pos.y+1.62,g.pos.z,p.pos.x,chestY(),p.pos.z,G.boxes)){
        visible=true;
        const prox=clamp(1-dist/range,0.08,1);
        rate=(0.32+prox*0.92)*g.def.note;
        rate*=(0.5+1.15*p.light);          // la lumière trahit
        if(p.crouch) rate*=0.58;
        if(p.speedNow>4.2) rate*=1.5;
        if(p.carrying) rate*=1.35;          // un corps sur l'épaule se voit
        if(p.swim) rate*=0.6;               // seule la tête dépasse
        if(p.onPalm) rate*=0.35;            // perdu dans les palmes
        if(p.hang) rate*=0.45;              // suspendu : on n'offre que la tête et les mains
        if(!inCone) rate*=0.6;
        if(G.alarm>0) rate*=1.35;
      }
    }
  }
  if(visible){ g.aware=clamp(g.aware+rate*dt,0,1); g.lastSeen={x:p.pos.x,z:p.pos.z}; }
  else g.aware=clamp(g.aware-(g.state==="ALERT"?0.16:0.34)*dt,0,1);
  return visible;
}
function hearNoise(g,dt){
  const p=G.player;
  let radius=0;
  if(p.speedNow>4.2) radius=13; else if(p.speedNow>1.2) radius=p.crouch?2.5:7;
  if(radius<=0) return;
  const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
  if(d<radius){
    g.aware=clamp(g.aware+0.32*dt*(1-d/radius),0,0.72);
    if(g.state==="PATROL"&&g.aware>0.3){g.state="INVESTIGATE";g.poi={x:p.pos.x,z:p.pos.z};g.searchT=0;}
  }
}
function triggerAlarm(from){
  if(G.alarm<=0){ G.alarmCount++; sfx("alarm"); toast("Alarme ! Les gardes convergent."); }
  G.alarm=G.bellSabotaged?14:26;
  G.guards.forEach(g=>{ if(g.dead||g.def.isTarget) return;
    g.coins=null; g.state="ALERT"; g.poi={x:from.x,z:from.z}; g.searchT=0; g.aware=Math.max(g.aware,0.55); });
}

/* ============================================================
   12. Boucle : joueur
   ============================================================ */
function updatePlayer(dt){
  const p=G.player;
  if(p.stun>0){ p.stun-=dt; p.speedNow=0; }

  if(p.lunge){
    const c=p.lunge; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1);
    p.pos.lerpVectors(c.from,c.to,k); p.pos.y+=Math.sin(k*Math.PI)*c.arc;
    p.speedNow=0;
    if(k>=1){
      p.pos.copy(c.to); const pd=c.pending; p.lunge=null; p.vy=0; p.onGround=true; p.fallFrom=p.pos.y;
      pd.g.frozen=false; killGuard(pd.g,pd.type,pd.label);
      if(pd.type==="elan") makeNoise(p.pos.x,p.pos.z,9,0.3);
      if(pd.second){ pd.second.frozen=false; killGuard(pd.second,"double","double assassinat"); }
    }
  }else if(p.gliding){
    const c=p.gliding; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1);
    p.pos.lerpVectors(c.from,c.to,k);
    p.pos.y-=Math.sin(k*Math.PI)*0.35;
    p.yaw=Math.atan2(c.to.x-c.from.x,c.to.z-c.from.z);
    p.speedNow=0;
    if(k>=1){ p.pos.copy(c.to); p.gliding=null; p.vy=0; p.fallFrom=p.pos.y; }
  }else if(p.saut){
    // vol entre deux corniches : on lâche, on passe, on rattrape
    const c=p.saut; c.t+=dt;
    const t=clamp(c.t/c.dur,0,1);
    p.pos.lerpVectors(c.from,c.to,t); p.pos.y-=Math.sin(t*Math.PI)*0.45;
    p.speedNow=0;
    if(t>=1){ p.saut=null; startHang(p,c.cible); }
  }else if(p.vault){
    // franchissement : une courbe par-dessus l'obstacle, sans perdre l'élan
    const c=p.vault; c.t+=dt;
    const t=clamp(c.t/c.dur,0,1);
    p.pos.x=lerp(c.from.x,c.to.x,t); p.pos.z=lerp(c.from.z,c.to.z,t);
    p.pos.y=lerp(c.from.y,c.to.y,t)+Math.sin(t*Math.PI)*(c.haut-Math.max(c.from.y,c.to.y)+0.25);
    p.speedNow=5.4;
    if(t>=1){
      p.pos.copy(c.to); p.vault=null; p.onGround=true; p.vy=0; p.fallFrom=p.pos.y;
      const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
      p.vx=fx*4.2; p.vz=fz*4.2;                     // on repart dans la foulée
    }
  }else if(p.hang){
    // suspendu : on ne se déplace que de côté, le long du rebord
    const h=p.hang;
    let ix=0;
    if(p.stun<=0){
      if(K.KeyA||K.ArrowLeft) ix-=1;
      if(K.KeyD||K.ArrowRight) ix+=1;
      if(Math.abs(touch.move.x)>0.25) ix+=touch.move.x;
      if(Math.abs(PAD.mx)>0.25) ix+=PAD.mx;
    }
    ix=clamp(ix,-1,1);
    const yaw=hangYaw(h.side), r=hangAxisX(h.side)?Math.cos(yaw):-Math.sin(yaw);
    if(ix) hangShimmy(h,r*ix*1.6*dt);
    p.pos.copy(hangPos(h)); p.yaw=yaw;
    p.speedNow=Math.abs(ix)>0.1?1.1:0;
    p.phase+=dt*(Math.abs(ix)>0.1?5:1.2);
  }else if(p.climbing){
    const c=p.climbing; c.t+=dt;
    const k=clamp(c.t/c.dur,0,1), e=k*k*(3-2*k);
    if(c.wall){ const kx=clamp((k-0.9)/0.1,0,1);
      p.pos.x=lerp(c.from.x,c.to.x,kx); p.pos.z=lerp(c.from.z,c.to.z,kx); p.pos.y=lerp(c.from.y,c.to.y+0.1,Math.min(1,k/0.9)); }
    else{ p.pos.x=lerp(c.from.x,c.to.x,e); p.pos.z=lerp(c.from.z,c.to.z,e);
      p.pos.y=c.tree?lerp(c.from.y,c.to.y,e):lerp(c.from.y,c.to.y+0.2,Math.sin(e*Math.PI/2)); }
    p.speedNow=0;
    if(k>=1){ p.pos.copy(c.to); p.climbing=null; p.vy=0; p.onGround=true; p.fallFrom=p.pos.y; }
  }else{
    let ix=0,iz=0;
    if(p.stun<=0){
      if(K.KeyW||K.ArrowUp) iz+=1;
      if(K.KeyS||K.ArrowDown) iz-=1;
      if(K.KeyA||K.ArrowLeft) ix-=1;
      if(K.KeyD||K.ArrowRight) ix+=1;
      if(Math.abs(touch.move.x)>0.12||Math.abs(touch.move.y)>0.12){ix+=touch.move.x;iz-=touch.move.y;}
      if(Math.abs(PAD.mx)>0.12||Math.abs(PAD.my)>0.12){ix+=PAD.mx;iz-=PAD.my;}
    }
    const mag=Math.hypot(ix,iz);
    const running=(K.ShiftLeft||K.ShiftRight||touch.run||PAD.run)&&!p.crouch&&!p.carrying;
    let spd=p.crouch?1.65:(running?5.4:3.1);
    if(p.swim) spd*=p.crouch?0.85:0.6;
    if(p.carrying) spd*=0.6;
    // Vitesse lissée : le corps met un instant à se lancer et à s'arrêter.
    // On se relance vite, on s'arrête plus vite encore, et en l'air on garde son élan.
    let wx=0,wz=0;
    if(mag>0.01){
      ix/=Math.max(mag,1); iz/=Math.max(mag,1);
      const fwd={x:-Math.sin(G.camYaw),z:-Math.cos(G.camYaw)};
      const rgt={x:Math.cos(G.camYaw),z:-Math.sin(G.camYaw)};
      const mx=fwd.x*iz+rgt.x*ix, mz=fwd.z*iz+rgt.z*ix;
      const ml=Math.hypot(mx,mz)||1;
      wx=mx/ml*spd*Math.min(mag,1); wz=mz/ml*spd*Math.min(mag,1);
    }
    const prise=p.onGround?(mag>0.01?9:13):2.6;      // en l'air, on ne change presque plus de cap
    const k=Math.min(1,dt*prise);
    p.vx=lerp(p.vx,wx,k); p.vz=lerp(p.vz,wz,k);
    if(Math.abs(p.vx)<0.02) p.vx=0;
    if(Math.abs(p.vz)<0.02) p.vz=0;
    p.speedNow=Math.hypot(p.vx,p.vz);
    const ox=p.pos.x, oz=p.pos.z;
    p.pos.x+=p.vx*dt; p.pos.z+=p.vz*dt;
    if(p.speedNow>0.25){
      p.yaw+=angDelta(p.yaw,Math.atan2(p.vx,p.vz))*Math.min(1,dt*13);
      p.phase+=dt*(running?2.4:2.75)*p.speedNow;
    }else p.phase+=dt*1.2;

    // trop raide pour y marcher : on garde la part du pas qui longe la pente
    if(G.hills.length&&p.onGround&&!p.swim){
      const h0=hAt(ox,oz);
      if(Math.abs(p.pos.y-h0)<0.3){
        const dd=Math.hypot(p.pos.x-ox,p.pos.z-oz);
        if(dd>1e-5&&hAt(p.pos.x,p.pos.z)-h0>dd*SLOPE_MAX){
          if(hAt(p.pos.x,oz)-h0<=Math.abs(p.pos.x-ox)*SLOPE_MAX) p.pos.z=oz;
          else if(hAt(ox,p.pos.z)-h0<=Math.abs(p.pos.z-oz)*SLOPE_MAX) p.pos.x=ox;
          else{ p.pos.x=ox; p.pos.z=oz; }
          p.vx*=0.6; p.vz*=0.6;
        }
      }
    }
    const avant=groundAt(p.pos.x,p.pos.z,p.pos.y+0.05,G.boxes,true);
    circleVsBoxes(p.pos,0.42,p.pos.y,p.pos.y+playerHeight(),G.boxes);
    // Marche d'escalier : on monte tout seul les ressauts jusqu'à 55 cm, au lieu de buter.
    if(p.onGround&&!p.swim&&avant>p.pos.y+0.02&&avant<p.pos.y+0.55){
      p.pos.x=ox+p.vx*dt; p.pos.z=oz+p.vz*dt;
      p.pos.y=avant; p.fallFrom=avant; p.vy=0; p.step=0.18;
    }
    // Franchissement en course : un obstacle à hauteur de hanche se passe d'un appui de main.
    if(!p.vault&&p.onGround&&!p.swim&&!p.carrying&&p.speedNow>4&&p.stun<=0){
      const fx=Math.sin(p.yaw), fz=Math.cos(p.yaw);
      const bx=lowObstacle(p,fx,fz);
      if(bx) startVault(p,bx,fx,fz);
    }

    p.vy-=19*dt;
    let ny=p.pos.y+p.vy*dt;
    // la main trouve le rebord au passage : on s'y accroche au lieu de tomber
    if(p.vy<0&&!p.onGround&&!p.carrying&&p.noGrab<=0){
      const lg=ledgeGrab(p.pos.x,ny,p.pos.z);
      if(lg){ startHang(p,lg); toast("Accroché au rebord"); }
    }
    if(p.hang){ /* accroché : plus de chute cette image */ }
    else{
    const gy=groundAt(p.pos.x,p.pos.z,p.pos.y,G.boxes);
    if(ny<=gy){
      const drop=p.fallFrom-gy;
      if(!p.onGround&&drop>3.5){
        const h=inHide(p.pos.x,p.pos.z);
        if(inWater(p.pos.x,p.pos.z)){ toast("Plongeon — personne n'a rien entendu"); splashFX(p.pos.x,p.pos.z); }
        else if(h&&SOFT_HIDE[h.kind]){
          toast("Saut de la foi — atterrissage silencieux"); sfx("good");
        }else if(drop<7&&p.speedNow>2.6){
          // roulade : en arrivant lancé, on roule et on repart, presque sans bruit
          p.roll=0.5; sfx("stone"); makeNoise(p.pos.x,p.pos.z,6,0.15);
          toast("Roulade — l'élan a absorbé la chute");
        }else{
          sfx("thud"); makeNoise(p.pos.x,p.pos.z,14,0.4);
          p.stun=0.45; toast("Chute lourde : le bruit a porté");
        }
      }
      ny=gy; p.vy=0; p.onGround=true; p.fallFrom=gy;
    }else if(p.onGround&&p.vy<=0&&p.pos.y-gy<0.36){
      ny=gy; p.vy=0; p.fallFrom=gy;          // descente de pente ou de marche : les pieds restent au sol
    }else{ p.onGround=false; if(p.vy>0) p.fallFrom=Math.max(p.fallFrom,ny); }
    p.pos.y=ny;
    }
  }
  if(p.noGrab>0) p.noGrab-=dt;
  if(p.siffleT>0) p.siffleT-=dt;

  const wasSwim=p.swim;
  p.swim=p.pos.y<0.3&&inWater(p.pos.x,p.pos.z);
  if(p.swim&&!wasSwim&&!p.lunge) splashFX(p.pos.x,p.pos.z);
  // une trace à chaque foulée : poussière sur le sable, rides sur l'eau
  if(p.speedNow>0.4&&G.quality!=="low"){
    p.stepT=(p.stepT||0)+dt*p.speedNow;
    const cadence=p.swim?2.6:(p.speedNow>4.2?2.2:3.2);
    if(p.stepT>cadence){
      p.stepT=0;
      if(p.swim) rippleFX(p.pos.x,p.pos.z);
      else if(p.onGround&&p.speedNow>3.4&&!p.crouch) dustFX(p.pos.x,p.pos.y,p.pos.z);
    }
  }
  p.onPalm=G.boxes.some(bx=>(bx.type==="palm"||bx.type==="ora"||bx.type==="uru")&&Math.abs(p.pos.y-bx.y1)<0.25
    &&Math.hypot(p.pos.x-bx.x,p.pos.z-bx.z)<(bx.type==="ora"?2.2:bx.type==="uru"?1.6:0.9))
    ||G.boxes.some(bx=>bx.type==="branch"&&Math.abs(p.pos.y-bx.y1)<0.25&&insideBox(p.pos.x,p.pos.z,bx,0.4));
  { const tp=inTapu(p.pos.x,p.pos.z); if(tp&&!p.inTapu) toast("Marae — lieu tapu. Ici, on ne verse pas le sang."); p.inTapu=tp; }
  p.mesh.position.copy(p.pos);
  if(p.swim) p.mesh.position.y-=(p.crouch?2.05:1.2)+Math.sin(VT*2.4)*0.05;
  p.mesh.rotation.y=p.yaw;
  p.mesh.scale.y=lerp(p.mesh.scale.y,(p.crouch&&!p.swim)?0.66:1,Math.min(1,dt*12));
  poseWalk(p.mesh,p.phase,p.speedNow>0.2?(p.crouch?0.28:0.55):0.04);
  const ud=p.mesh.userData;
  if(ud.cape){
    const want=0.07+p.speedNow*0.075+((p.gliding||p.lunge||!p.onGround)?0.7:0)+Math.sin(VT*2.3)*0.03;
    ud.cape.rotation.x=lerp(ud.cape.rotation.x,want,Math.min(1,dt*7));
  }
  if(ud.blade){ p.bladeT=Math.max(0,p.bladeT-dt); ud.blade.scale.z=lerp(ud.blade.scale.z,p.bladeT>0?1:0.05,Math.min(1,dt*18)); }
  if(p.lunge){ const ty=p.lunge.pending.type;
    if(ty==="aerien"||ty==="tyrolienne"){ ud.armR.rotation.x=-2.6; ud.armL.rotation.x=-2.6; }
    else if(ty==="ko"){ ud.armR.rotation.x=-1.1; ud.armL.rotation.x=-1.4; }
    else{ ud.armR.rotation.x=-1.5; ud.armL.rotation.x=-0.6; } }
  if(p.swim){ ud.armL.rotation.x=-1.6+Math.sin(p.phase)*1.3; ud.armR.rotation.x=-1.6-Math.sin(p.phase)*1.3;
    straighten(ud,true,true); }
  if(p.climbing&&p.climbing.tree){ const k=Math.sin(VT*9); ud.armL.rotation.x=-2.6+k*0.4; ud.armR.rotation.x=-2.6-k*0.4;
    ud.legL.rotation.x=k*0.5; ud.legR.rotation.x=-k*0.5;
    ud.legL.lower.rotation.x=0.5+k*0.3; ud.legR.lower.rotation.x=0.5-k*0.3;
    ud.armL.lower.rotation.x=-0.25; ud.armR.lower.rotation.x=-0.25; }
  { // saut de la foi : le piqué, bras en croix
    const diving=!p.onGround&&!p.climbing&&!p.gliding&&!p.lunge&&p.vy<-5&&(p.fallFrom-p.pos.y)>2;
    const kk=Math.min(1,dt*7);
    p.mesh.rotation.x=lerp(p.mesh.rotation.x,diving?1.2:0,kk);
    ud.armL.rotation.z=lerp(ud.armL.rotation.z,diving?-1.4:0,kk); ud.armR.rotation.z=lerp(ud.armR.rotation.z,diving?1.4:0,kk);
    if(diving) straighten(ud,true,true); }
  if(p.vault){                      // franchissement : une main sur l'obstacle, jambes repliées
    const t=p.vault.t/p.vault.dur;
    ud.armR.rotation.x=-1.9-Math.sin(t*Math.PI)*0.7; ud.armL.rotation.x=-0.5;
    ud.legL.rotation.x=-0.9*Math.sin(t*Math.PI); ud.legR.rotation.x=-1.2*Math.sin(t*Math.PI);
    ud.legL.lower.rotation.x=1.5*Math.sin(t*Math.PI); ud.legR.lower.rotation.x=1.7*Math.sin(t*Math.PI);
    p.mesh.rotation.x=Math.sin(t*Math.PI)*0.35;
  }
  if(p.saut){                       // vol entre deux corniches : bras tendus vers la prise
    ud.armL.rotation.x=-2.8; ud.armR.rotation.x=-2.8; straighten(ud,true,false);
    ud.legL.rotation.x=0.5; ud.legR.rotation.x=0.2;
    ud.legL.lower.rotation.x=0.9; ud.legR.lower.rotation.x=0.5;
  }
  if(p.roll>0){                     // roulade : le corps fait un tour vers l'avant
    p.roll-=dt;
    p.mesh.rotation.x=(1-clamp(p.roll/0.5,0,1))*TAU;
    ud.armL.rotation.x=-1.9; ud.armR.rotation.x=-1.9;
    ud.legL.rotation.x=-1.1; ud.legR.rotation.x=-1.1;
    ud.legL.lower.rotation.x=1.9; ud.legR.lower.rotation.x=1.9;
    if(p.roll<=0) p.mesh.rotation.x=0;
  }
  if(p.step>0){                     // ressaut franchi : un petit fléchissement
    p.step-=dt;
    const t=clamp(p.step/0.18,0,1);
    ud.legL.lower.rotation.x+=t*0.5; ud.legR.lower.rotation.x+=t*0.5;
  }
  if(p.hang){                       // bras levés au rebord, jambes qui pendent
    const sw=Math.sin(p.phase)*(p.speedNow>0.1?0.5:0.12);
    ud.armL.rotation.x=-2.95+sw*0.25; ud.armR.rotation.x=-2.95-sw*0.25;
    ud.armL.rotation.z=0.12; ud.armR.rotation.z=-0.12;
    ud.legL.rotation.x=0.22+sw*0.4; ud.legR.rotation.x=0.22-sw*0.4;
    ud.legL.lower.rotation.x=0.45-sw*0.3; ud.legR.lower.rotation.x=0.45+sw*0.3;
    ud.armL.lower.rotation.x=0; ud.armR.lower.rotation.x=0;
    p.mesh.rotation.x=0;
  }
  if(p.grabT>0){ p.grabT-=dt; ud.armR.rotation.x=-2.9; ud.armL.rotation.x=-2.9; straighten(ud,true,false); }
  // respiration, et la tête qui suit le soldat le plus proche
  ud.torso.scale.y=1+Math.sin(VT*1.9)*(p.speedNow>3?0.03:0.016);
  { let look=0,bd=13;
    for(const g of G.guards){
      if(g.dead) continue;
      const d=Math.hypot(g.pos.x-p.pos.x,g.pos.z-p.pos.z);
      if(d<bd){ bd=d; look=clamp(angDelta(p.yaw,Math.atan2(g.pos.x-p.pos.x,g.pos.z-p.pos.z)),-0.95,0.95); }
    }
    ud.headG.rotation.y=lerp(ud.headG.rotation.y,look,Math.min(1,dt*4));
  }
  if(ud.sash) ud.sash.rotation.x=lerp(ud.sash.rotation.x,
    0.12+p.speedNow*0.09+Math.sin(VT*7)*0.05*Math.min(1,p.speedNow/3)+(p.onGround?0:0.5),Math.min(1,dt*8));

  const h=inHide(p.pos.x,p.pos.z);
  const cache=!!h&&p.pos.y-hAt(p.pos.x,p.pos.z)<1.6&&(STAND_HIDE[h.kind]||p.crouch);
  p.hidden=cache||(p.swim&&p.crouch);
  if(cache&&!p.wasHidden){ sfx("tick"); toast(HIDE_NOTE[h.kind]||"Tu te fonds dans l'ombre"); }
  p.wasHidden=cache;
  p.light=lightAt(p.pos.x,p.pos.z)*(p.hidden?0.25:(h?0.6:1))*(p.onPalm?0.5:1);

  updateProjectiles(dt);
  updateSmokes(dt);
}
function updateProjectiles(dt){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const s=G.projectiles[i]; s.t+=dt;
    if(s.kind==="knife"||s.kind==="dart"){
      const k=clamp(s.t/s.dur,0,1);
      s.mesh.position.lerpVectors(s.from,
        new THREE.Vector3(s.target.pos.x,s.target.pos.y+1.3,s.target.pos.z),k);
      if(k>=1){
        if(!s.target.dead){ if(s.kind==="dart") poisonGuard(s.target);
          else killGuard(s.target,"distance","pierre de fronde"); }
        G.root.remove(s.mesh); s.mesh.geometry.dispose(); G.projectiles.splice(i,1);
      }
      continue;
    }
    if(!s.landed){
      s.vel.y-=19*dt;
      s.mesh.position.addScaledVector(s.vel,dt);
      const gy=groundAt(s.mesh.position.x,s.mesh.position.z,s.mesh.position.y+2,G.boxes);
      let hitWall=false;
      for(const bx of G.boxes)
        if(insideBox(s.mesh.position.x,s.mesh.position.z,bx,0)&&
           s.mesh.position.y<bx.y1&&s.mesh.position.y>bx.y0){hitWall=true;break;}
      if(s.mesh.position.y<=gy+0.1||hitWall||s.t>3.2){
        s.mesh.position.y=Math.max(gy+0.1,s.mesh.position.y);
        s.landed=true; s.fuse=0;
        if(s.kind==="stone"){ sfx("stone"); makeNoise(s.mesh.position.x,s.mesh.position.z,11,0.35);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
        else if(s.kind==="coins"){ scatterCoins(s.mesh.position.x,gy,s.mesh.position.z);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
        else if(s.kind==="smoke"){ sfx("smoke");
          spawnSmoke(s.mesh.position.x,s.mesh.position.z);
          G.root.remove(s.mesh); G.projectiles.splice(i,1); }
      }
    }else if(s.kind==="cracker"){
      s.fuse+=dt;
      if(s.fuse>2.6){
        sfx("boom"); makeNoise(s.mesh.position.x,s.mesh.position.z,19,0.6);
        for(const g of G.guards) if(!g.dead&&
          Math.hypot(g.pos.x-s.mesh.position.x,g.pos.z-s.mesh.position.z)<19&&g.state!=="ALERT"){
          g.searchT=-3; }
        G.root.remove(s.mesh); G.projectiles.splice(i,1);
      }
    }
  }
}
function spawnSmoke(x,z){
  const g=new THREE.Group(); g.position.set(x,0,z);
  const puffs=[];
  for(let k=0;k<7;k++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:SMOKE_TEX,transparent:true,
      depthWrite:false,opacity:0.9}));
    const a=Math.random()*TAU, r=Math.random()*3.2;
    sp.position.set(Math.cos(a)*r,0.8+Math.random()*1.6,Math.sin(a)*r);
    sp.scale.setScalar(4+Math.random()*2.5);
    g.add(sp); puffs.push(sp);
  }
  G.root.add(g);
  G.smokes.push({x,z,r:4.6,t:0,life:12,mesh:g,puffs});
}
function updateSmokes(dt){
  for(let i=G.smokes.length-1;i>=0;i--){
    const s=G.smokes[i]; s.t+=dt;
    const fade=s.t>s.life-2.5?clamp((s.life-s.t)/2.5,0,1):Math.min(1,s.t*3);
    s.puffs.forEach((p,k)=>{ p.material.opacity=0.85*fade;
      // c'est la matière du sprite qui porte la rotation, pas l'objet :
      // l'ancienne ligne levait une exception et figeait le jeu dès qu'un nuage existait
      p.position.y+=dt*0.12; p.material.rotation=k*0.3+s.t*0.1; });
    if(s.t>s.life){ G.root.remove(s.mesh); G.smokes.splice(i,1); }
  }
}

/* ============================================================
   13. Boucle : gardes
   ============================================================ */
function moveGuard(g,tx,tz,speed,dt){
  const dx=tx-g.pos.x, dz=tz-g.pos.z, d=Math.hypot(dx,dz);
  if(d<0.25) return true;
  const nx=dx/d, nz=dz/d;
  const ox=g.pos.x, oz=g.pos.z;
  g.pos.x+=nx*speed*dt; g.pos.z+=nz*speed*dt;
  circleVsBoxes(g.pos,0.45,g.pos.y,g.pos.y+1.8,G.boxes);
  if(g.pos.y<0.5&&inWater(g.pos.x,g.pos.z,0.3)){ g.pos.x=ox; g.pos.z=oz;
    g.yaw+=angDelta(g.yaw,Math.atan2(nx,nz))*Math.min(1,dt*6); return true; }
  g.yaw+=angDelta(g.yaw,Math.atan2(nx,nz))*Math.min(1,dt*6);
  g.phase+=dt*speed*2.6;
  return false;
}
// les cachettes autour d'un point, de la plus proche à la plus lointaine
function hidesNear(x,z,r){
  return G.hides.filter(h=>Math.hypot(h.x-x,h.z-z)<r)
    .sort((a,b)=>Math.hypot(a.x-x,a.z-z)-Math.hypot(b.x-x,b.z-z));
}
// un garde écarte le feuillage : il y trouve ce qu'on y a mis
function fouillerCachette(g,h){
  const p=G.player;
  if(inHide(p.pos.x,p.pos.z)===h&&p.pos.y-hAt(p.pos.x,p.pos.z)<1.6&&Math.abs(p.pos.y-g.pos.y)<2
     &&Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z)<3.4){
    g.aware=1; g.lastSeen={x:p.pos.x,z:p.pos.z};
    toast("Il a fouillé ta cachette !");
  }
  for(const o of G.guards){
    if(!o.stashed||Math.hypot(o.pos.x-g.pos.x,o.pos.z-g.pos.z)>3.2) continue;
    o.stashed=false; o.mesh.visible=true; o.mesh.position.copy(o.pos);
    G.bodiesHidden=Math.max(0,G.bodiesHidden-1); G.bodiesFound++;
    g.aware=Math.max(g.aware,0.8);
    toast("Un corps dissimulé a été découvert");
  }
}
function nearestWaypoint(g){
  let bi=0,bd=1e9;
  g.def.path.forEach((w,i)=>{const d=Math.hypot(w[0]-g.pos.x,w[1]-g.pos.z); if(d<bd){bd=d;bi=i;}});
  return bi;
}
function updateGuards(dt){
  const p=G.player;
  let maxAware=0;

  // les torches éteintes sont rallumées par un garde qui passe
  for(const t of G.torches){
    if(t.on) continue;
    let near=false;
    for(const g of G.guards)
      if(!g.dead&&g.state!=="ALERT"&&Math.hypot(g.pos.x-t.x,g.pos.z-t.z)<4){near=true;break;}
    if(near){ t.relightT+=dt;
      if(t.relightT>3){ t.on=true; t.flame.visible=true; t.halo.visible=true;
        makeNoise(t.x,t.z,6,0.15); toast("Un soldat a rallumé la flamme"); }
    }else t.relightT=0;
  }

  for(const g of G.guards){
    if(g.dead){
      if(g.stashed) continue;
      if(g.fall&&!g.carried){
        g.fall.t=Math.min(1,g.fall.t+dt*3.2); const e=1-Math.pow(1-g.fall.t,3);
        g.mesh.rotation.z=Math.PI/2.1*e*g.fall.dir; g.mesh.position.y=g.pos.y+0.25*e;
        if(g.fall.t>=1) g.fall=null;
      }
      if(g.ko&&!g.carried){ g.koT-=dt; if(g.koT<=0){ reviveGuard(g); continue; } }
      if(g.carried) continue;
      g.deadT+=dt;
      if(g.deadT<26||g.ko){
        for(const o of G.guards){
          if(o===g||o.dead||o.state==="ALERT") continue;
          const d=Math.hypot(o.pos.x-g.pos.x,o.pos.z-g.pos.z);
          if(d<7&&lineOfSight(o.pos.x,o.pos.y+1.6,o.pos.z,g.pos.x,g.pos.y+0.4,g.pos.z,G.boxes)){
            if(g.accident){
              if(o.state==="PATROL"){ o.state="INVESTIGATE"; o.poi={x:g.pos.x,z:g.pos.z}; o.aware=Math.max(o.aware,0.3); o.searchT=0; }
              if(!g.accSeen){ g.accSeen=true; toast("Un garde découvre l'accident — il n'y voit que de la malchance"); }
              continue;
            }
            if(o.state!=="INVESTIGATE"){G.bodiesFound++;toast(g.ko?"Un garde inconscient a été découvert":"Un corps a été découvert");}
            if(g.ko) g.koT=Math.min(g.koT,3.5);
            o.state="INVESTIGATE"; o.poi={x:g.pos.x,z:g.pos.z};
            o.aware=Math.max(o.aware,0.6); o.searchT=0;
          }
        }
      }
      continue;
    }

    if(g.pull){
      const c=g.pull; c.t+=dt; const k=clamp(c.t/c.dur,0,1);
      g.pos.x=lerp(c.from.x,c.to.x,k); g.pos.z=lerp(c.from.z,c.to.z,k);
      g.pos.y=lerp(c.from.y,c.to.y,k*k)+Math.sin(k*Math.PI)*(c.arc===undefined?0.6:c.arc);
      g.mesh.position.copy(g.pos); g.mesh.rotation.x=k*1.4;
      if(k>=1){ g.pos.copy(c.to); g.mesh.rotation.x=0;
        killGuard(g,c.type||"chute",c.label||"tiré dans le vide");
        if(c.type==="eau") splashFX(g.pos.x,g.pos.z);          // la noyade ne porte pas
        else { sfx("thud"); makeNoise(g.pos.x,g.pos.z,6,0.2); } }
      continue;
    }
    if(g.frozen) continue;
    if(g.poison>0){
      g.poison-=dt; g.spr.visible=false;
      if(g.poison<=0){ killGuard(g,"poison","poison"); continue; }
      const path=g.def.path;
      if(path.length>1){ const w=path[g.wp%path.length]; if(moveGuard(g,w[0],w[1],g.def.speed*0.5,dt)) g.wp=(g.wp+1)%path.length; }
      g.yaw+=Math.sin(VT*4.3+g.pos.x)*dt*1.6;
      g.pos.y=lerp(g.pos.y,groundAt(g.pos.x,g.pos.z,g.pos.y+0.4,G.boxes),Math.min(1,dt*10));
      g.mesh.position.copy(g.pos); g.mesh.rotation.set(0,g.yaw,Math.sin(VT*3.1)*0.2);
      poseWalk(g.mesh,g.phase,0.3);
      const u=g.mesh.userData; u.armL.rotation.x=-0.5; u.headG.rotation.x=0.4;
      continue;
    }
    const visible=perceive(g,dt);
    hearNoise(g,dt);

    if(g.aware>=1){
      g.state="ALERT"; triggerAlarm(p.pos);
    }else if(g.aware>0.45&&g.state==="PATROL"){
      g.state="INVESTIGATE"; g.coins=null; g.meet=null; g.fouille=null;
      g.poi=g.lastSeen?{x:g.lastSeen.x,z:g.lastSeen.z}:{x:p.pos.x,z:p.pos.z};
      g.searchT=0;
    }
    if(g.aware>G.maxSeen) G.maxSeen=g.aware;

    const boost=G.alarm>0?1.3:1;
    g.picking=false;
    if(g.coins&&g.state!=="ALERT"){
      // penché sur les pièces : il ne voit presque plus rien
      const c=g.coins;
      if(moveGuard(g,c.x,c.z,g.def.speed*1.1,dt)){ c.t+=dt; g.picking=true; g.phase+=dt*0.5;
        if(c.t>6){ g.coins=null; g.state="PATROL"; g.wp=nearestWaypoint(g); g.waitT=0; } }
    }else if(g.state==="PATROL"){
      // deux hommes qui se croisent échangent un regard : la ronde s'arrête un instant
      if(g.meet){
        g.meet.t-=dt;
        g.yaw+=angDelta(g.yaw,Math.atan2(g.meet.o.pos.x-g.pos.x,g.meet.o.pos.z-g.pos.z))*Math.min(1,dt*5);
        g.phase+=dt*0.6;
        g.mesh.userData.headG.rotation.y=Math.sin(VT*1.8+g.pos.x)*0.25;
        if(g.meet.t<=0){ g.meet=null; g.croiseT=7; }
      }else{
      if(g.croiseT>0) g.croiseT-=dt;
      else for(const o of G.guards){
        if(o===g||o.dead||o.state!=="PATROL"||o.meet||o.croiseT>0||o.coins) continue;
        if(Math.abs(o.pos.y-g.pos.y)>1) continue;
        if(Math.hypot(o.pos.x-g.pos.x,o.pos.z-g.pos.z)>2.6) continue;
        g.meet={t:2+Math.random()*1.6,o}; o.meet={t:g.meet.t,o:g}; break;
      }
      const path=g.def.path;
      if(path.length>1){
        if(g.waitT>0){ g.waitT-=dt; g.phase+=dt*0.8;
          if(g.idle==="look") g.yaw=g.restYaw+Math.sin((g.def.wait-g.waitT)*1.9)*0.6; }
        else{
          const w=path[g.wp%path.length];
          if(moveGuard(g,w[0],w[1],g.def.speed,dt)){ g.wp=(g.wp+1)%path.length; g.waitT=g.def.wait;
            g.restYaw=g.yaw; g.idle=["look","look","stretch","lean"][(Math.random()*4)|0]; }
        }
      }else g.yaw+=dt*0.35;
      }
    }else if(g.state==="INVESTIGATE"){
      if(visible){ g.poi={x:p.pos.x,z:p.pos.z}; g.fouille=null; }
      // Tant qu'il reste une cachette à fouiller, c'est elle qui mène ses pas :
      // sinon il serait rappelé vers son point d'enquête à chaque image.
      if(g.fouille&&g.fouille.length){
        const h=g.fouille[0];
        // dans un grand champ d'herbe, il fouille le coin le plus proche du soupçon, pas le milieu
        const fx=g.poi?clamp(g.poi.x,h.x-h.w/2+0.6,h.x+h.w/2-0.6):h.x, fz=g.poi?clamp(g.poi.z,h.z-h.d/2+0.6,h.z+h.d/2-0.6):h.z;
        if(moveGuard(g,fx,fz,g.def.speed*0.95*boost,dt)){
          g.fouilleT+=dt; g.picking=g.fouilleT>0.4;
          g.yaw+=Math.sin(g.fouilleT*3.4)*dt*2.6;
          if(g.fouilleT>1.5){ fouillerCachette(g,h); g.fouille.shift(); g.fouilleT=0; g.picking=false; }
        }
      }else{
        const arrived=g.poi?moveGuard(g,g.poi.x,g.poi.z,g.def.speed*1.18*boost,dt):true;
        if(arrived){
          if(!g.fouille){
            // arrivé sur place : il ira écarter les deux cachettes les plus proches
            g.fouille=g.poi?hidesNear(g.poi.x,g.poi.z,7).slice(0,2):[];
            g.fouilleT=0;
          }
          if(!g.fouille.length){
            g.searchT+=dt; g.yaw+=Math.sin(g.searchT*2.1)*dt*2.4;
            if(g.searchT>4.5&&g.aware<0.35){
              g.state="PATROL"; g.wp=nearestWaypoint(g); g.waitT=0; g.poi=null; g.fouille=null;
            }
          }
        }
      }
    }else{
      // Chaque unité réagit à l'alarme à sa manière :
      // la sentinelle ne quitte pas son poste et fouille l'horizon,
      // le voltigeur court droit sur la dernière position vue,
      // le sapeur avance lourdement mais rattrape de plus loin.
      if(visible){ g.poi={x:p.pos.x,z:p.pos.z}; g.searchT=0; }
      let arrived;
      if(g.def.kind==="guetteur"){
        const poste=g.def.path[g.wp%g.def.path.length];
        arrived=moveGuard(g,poste[0],poste[1],g.def.speed,dt);
        if(arrived&&!visible){ g.yaw+=Math.sin(VT*1.1+g.pos.x)*dt*1.9; g.searchT+=dt*0.55; }
      }else{
        const vite=g.def.kind==="eclaireur"?1.8:(g.def.brute?1.2:1.45);
        arrived=g.poi?moveGuard(g,g.poi.x,g.poi.z,g.def.speed*vite*boost,dt):true;
        if(arrived&&!visible){ g.searchT+=dt; g.yaw+=Math.sin(g.searchT*2.6)*dt*3; }
      }
      if(arrived&&!visible&&g.searchT>7){ g.state="INVESTIGATE"; g.searchT=0; g.fouille=null; }
      const catchD=g.def.brute?1.7:1.35;
      if(visible&&Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z)<catchD&&Math.abs(p.pos.y-g.pos.y)<2){
        endLevel(false,"Rattrapé par "+g.def.name.toLowerCase()+"."); return;
      }
    }

    const gy=groundAt(g.pos.x,g.pos.z,g.pos.y+0.4,G.boxes);
    g.pos.y=lerp(g.pos.y,gy,Math.min(1,dt*10));
    g.mesh.position.copy(g.pos);
    g.mesh.rotation.y=g.yaw;
    poseWalk(g.mesh,g.phase,g.state==="PATROL"?0.42:0.55);
    { // petite vie : respiration, regard, étirements, ramassage
      const u=g.mesh.userData, idle=g.state==="PATROL"&&g.waitT>0&&!g.coins;
      g.mesh.rotation.z=0;
      u.torso.scale.y=1+Math.sin(VT*2.2+g.pos.x)*0.014;
      u.headG.rotation.x=lerp(u.headG.rotation.x,g.picking?0.6:0,Math.min(1,dt*5));
      u.headG.rotation.y=idle&&g.idle==="look"?Math.sin(VT*1.3+g.pos.z)*0.45:lerp(u.headG.rotation.y,0,Math.min(1,dt*4));
      if(idle&&g.idle==="stretch"){ const k=Math.sin(clamp((g.def.wait-g.waitT)/g.def.wait,0,1)*Math.PI);
        u.armL.rotation.x=-2.8*k; u.armR.rotation.x=-2.8*k; }
      if(idle&&g.idle==="lean"){ g.mesh.rotation.z=0.08; }
      if(g.picking){ u.armR.rotation.x=-0.9; u.armL.rotation.x=-0.6; }
      g.mesh.scale.y=lerp(g.mesh.scale.y,g.picking?0.74:1,Math.min(1,dt*6));
    }

    if(g.aware>0.25){
      g.spr.visible=true;
      g.spr.material.map=(g.state==="ALERT"||g.aware>=1)?TEX_X:TEX_Q;
      g.spr.material.needsUpdate=true;
      g.spr.position.set(g.pos.x,g.pos.y+2.35,g.pos.z);
    }else g.spr.visible=false;
    if(g.marker) g.marker.position.set(g.pos.x,g.pos.y+2.95+Math.sin(VT*3)*0.08,g.pos.z);
    if(g.tag) g.tag.position.set(g.pos.x,g.pos.y+2.45,g.pos.z);

    if(g.aware>maxAware) maxAware=g.aware;
  }

  G.coneTick++;
  if(G.showCones&&G.coneTick%3===0) for(const g of G.guards) if(!g.dead) refreshCone(g);
  G.guards.forEach(g=>{g.cone.visible=G.showCones&&!g.dead;});
  G.player.detect=maxAware;
  if(maxAware>0.3&&maxAware<1&&Math.random()<0.06) sfx("tick");
}
function refreshCone(g){
  const N=g.coneN, half=g.def.fov*(g.picking?0.35:1)/2, R=g.def.range*(g.picking?0.45:1);
  const pts=[];
  for(let i=0;i<=N;i++){
    const a=-half+(2*half)*(i/N);
    const wx=Math.sin(g.yaw+a), wz=Math.cos(g.yaw+a);
    let t=R;
    for(const bx of G.boxes){
      if(bx.y1<g.pos.y+1.0||bx.y0>g.pos.y+1.8) continue;
      const h=rayBoxXZ(g.pos.x,g.pos.z,wx,wz,bx,t);
      if(h!==null&&h<t) t=h;
    }
    for(const s of G.smokes){
      const d=distPtSeg(s.x,s.z,g.pos.x,g.pos.z,g.pos.x+wx*t,g.pos.z+wz*t);
      if(d<s.r){ const dd=Math.hypot(s.x-g.pos.x,s.z-g.pos.z)-s.r; if(dd>0&&dd<t) t=dd; }
    }
    let ly=0;
    if(G.hills.length){
      const oeil=g.pos.y+1.62;
      for(let d=1;d<t;d+=1){ if(hAt(g.pos.x+wx*d,g.pos.z+wz*d)>oeil){ t=d; break; } }
      ly=Math.max(0,hAt(g.pos.x+wx*t,g.pos.z+wz*t)-g.pos.y);
    }
    pts.push([Math.sin(a)*t,Math.cos(a)*t,ly]);
  }
  const arr=g.cone.geometry.attributes.position.array;
  for(let i=0;i<N;i++){
    const o=i*9;
    arr[o]=0;arr[o+1]=0;arr[o+2]=0;
    arr[o+3]=pts[i][0];arr[o+4]=pts[i][2];arr[o+5]=pts[i][1];
    arr[o+6]=pts[i+1][0];arr[o+7]=pts[i+1][2];arr[o+8]=pts[i+1][1];
  }
  g.cone.geometry.attributes.position.needsUpdate=true;
  g.cone.geometry.computeBoundingSphere();
  g.cone.position.set(g.pos.x,g.pos.y+0.07,g.pos.z);
  g.cone.rotation.y=g.yaw;
  const c=g.state==="ALERT"?0xe0503c:(g.state==="INVESTIGATE"?0xf0a94b:0xf0d060);
  g.cone.material.color.setHex(c);
  g.cone.material.opacity=g.state==="ALERT"?0.62:(g.state==="INVESTIGATE"?0.46:0.34);
}

   14. Caméra
   ============================================================ */
function updateCamera(dt){
  const p=G.player;
  const tgt=new THREE.Vector3(p.pos.x,p.pos.y+(p.crouch?1.0:1.45),p.pos.z);
  const cp=Math.cos(G.camPitch);
  const dir=new THREE.Vector3(Math.sin(G.camYaw)*cp,Math.sin(G.camPitch),Math.cos(G.camYaw)*cp);
  // suivi automatique : sans le doigt sur l'écran, la caméra se replace derrière le joueur
  if(G.autoCam&&isTouch&&!lookPts.length&&!G.sync&&p.speedNow>1&&!p.climbing&&!p.gliding)
    G.camYaw+=angDelta(G.camYaw,p.yaw+Math.PI)*Math.min(1,dt*0.9);
  if(G.sync){ G.sync.t+=dt; G.camYaw+=dt*2.2; G.camPitch=lerp(G.camPitch,0.3,Math.min(1,dt*2)); if(G.sync.t>2.8) G.sync=null; }
  const acro=p.vault||p.saut||p.roll>0;
  G.camDistEff=lerp(G.camDistEff||G.camDist,
    G.slow>0?3.3:(G.sync?10:(acro?G.camDist*0.82:G.camDist)),Math.min(1,dt*6));
  let dist=G.camDistEff;
  const fovT=G.slow>0?50:62;
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov=lerp(camera.fov,fovT,Math.min(1,dt*6));camera.updateProjectionMatrix();}
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.type==="palm"||bx.type==="mast"||bx.type==="ora"||bx.type==="uru") continue;
    const t=rayBoxXZ(tgt.x,tgt.z,dir.x,dir.z,bx,dist);
    if(t!==null){
      const hy=tgt.y+dir.y*t;
      if(hy>bx.y0+0.1&&hy<bx.y1-0.05&&t<dist) dist=Math.max(1.6,t-0.35);
    }
  }
  const want=tgt.clone().addScaledVector(dir,dist);
  { const hy=hAt(want.x,want.z)+0.6; if(want.y<hy) want.y=hy; }
  camera.position.lerp(want,Math.min(1,dt*14));
  camera.lookAt(tgt);
  moon.target.position.set(p.pos.x,0,p.pos.z);
  moon.position.set(p.pos.x+34,52,p.pos.z+24);
}
function snapCamera(){
  const p=G.player, cp=Math.cos(G.camPitch);
  camera.fov=62; camera.updateProjectionMatrix();
  camera.position.set(p.pos.x+Math.sin(G.camYaw)*cp*G.camDist,
    p.pos.y+1.45+Math.sin(G.camPitch)*G.camDist,
    p.pos.z+Math.cos(G.camYaw)*cp*G.camDist);
  camera.lookAt(p.pos.x,p.pos.y+1.45,p.pos.z);
}

/* ============================================================
   15. Invites contextuelles
   ============================================================ */
function assassinationOn(g){
  if(g.frozen||g.pull) return null;
  const p=G.player;
  const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
  const dy=p.pos.y-g.pos.y;
  // suspendu au rebord : on l'attrape par la cheville et il passe par-dessus
  if(p.hang){
    const bx=p.hang.bx;
    return (Math.abs(g.pos.y-bx.y1)<0.45&&d<2.4&&insideBox(g.pos.x,g.pos.z,bx,0.6))
      ?{type:"rebord",label:"le tirer par-dessus le rebord"}:null;
  }
  if(p.gliding) return (dy>0.8&&dy<8&&d<3.4)?{type:"tyrolienne",label:"assassinat depuis la tyrolienne"}:null;
  // depuis l'eau : on le tire dans le lagon, et l'eau ne fait pas de bruit
  if(p.swim&&d<2.5&&Math.abs(dy)<1.7) return {type:"eau",label:"le noyer dans l'eau"};
  if(dy>1.7&&dy<7&&d<2.8) return {type:"aerien",label:"assassinat aérien"};
  if(-dy>2.2&&-dy<7.5&&d<3.9&&p.onGround&&g.aware<0.6){
    const bx=supportBox(g);
    if(bx&&Math.hypot(p.pos.x-clamp(p.pos.x,bx.minX,bx.maxX),p.pos.z-clamp(p.pos.z,bx.minZ,bx.maxZ))<0.95)
      return {type:"chute",label:"tirer dans le vide"};
  }
  if(Math.abs(dy)>1.3) return null;
  // dans la fumée, il ne voit rien : même un sapeur se prend de face
  if(d<2.2&&inSmoke(p.pos.x,p.pos.z)&&inSmoke(g.pos.x,g.pos.z))
    return {type:"fumee",label:"assassinat dans la fumée"};
  if(p.speedNow>4.2&&d<2.7&&g.aware<0.5&&!g.def.brute&&!p.carrying) return {type:"elan",label:"assassinat en pleine course"};
  if(d>2.0) return null;
  if(p.hidden) return {type:"embuscade",label:"assassinat depuis la cachette"};
  if(g.picking||g.poison>0) return {type:"dos",label:"assassinat par surprise"};
  const f=guardForward(g);
  const dot=((p.pos.x-g.pos.x)*f.x+(p.pos.z-g.pos.z)*f.z)/(d||1);
  if(g.def.brute){ return dot<-0.35?{type:"dos",label:"assassinat dans le dos"}:null; }
  if(dot<0.2||g.aware<0.4) return {type:"dos",label:"assassinat dans le dos"};
  return null;
}
function computePrompt(){
  const p=G.player; G.promptAction=null;

  if(p.carrying){
    const h=inHide(p.pos.x,p.pos.z);
    if(h&&h.kind!=="bush") G.promptAction={kind:"stash",text:HIDE_STASH[h.kind]||"dissimuler le corps"};
    else G.promptAction={kind:"drop",text:"déposer le corps"};
    return updatePrompt();
  }
  // assassinats
  let best=null,bd=1e9,info=null;
  for(const g of G.guards){
    if(g.dead) continue;
    const a=assassinationOn(g);
    if(!a) continue;
    const d=Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z);
    if(d<bd){bd=d;best=g;info=a;}
  }
  if(best&&(inTapu(p.pos.x,p.pos.z)||inTapu(best.pos.x,best.pos.z))){
    G.promptAction={kind:"tapu",text:"lieu tapu : on n'y verse pas le sang"}; return updatePrompt(); }
  if(best){
    let second=null;
    for(const o of (["chute","rebord","eau","tyrolienne"].includes(info.type)?[]:G.guards)){
      if(o===best||o.dead||o.frozen) continue;
      if(Math.hypot(o.pos.x-best.pos.x,o.pos.z-best.pos.z)<2.6&&
         Math.hypot(o.pos.x-p.pos.x,o.pos.z-p.pos.z)<3.4&&
         Math.abs(o.pos.y-best.pos.y)<1.2){ second=o; break; }
    }
    G.promptAction={kind:"kill",guard:best,type:second?"double":info.type,
      koOK:!best.def.isTarget&&!["chute","elan","rebord","eau"].includes(info.type),
      label:second?"double assassinat":info.label,second,
      text:(second?"double assassinat sur ":info.label+" sur ")+best.def.name.toLowerCase()};
    return updatePrompt();
  }
  // corps à emporter
  for(const g of G.guards){
    if(!g.dead||g.carried||g.stashed) continue;
    if(Math.hypot(p.pos.x-g.pos.x,p.pos.z-g.pos.z)<1.8&&Math.abs(p.pos.y-g.pos.y)<1.4){
      G.promptAction={kind:"carry",guard:g,text:"charger le corps"}; return updatePrompt();
    }
  }
  if(G.vista&&!G.vista.done&&Math.hypot(p.pos.x-G.vista.x,p.pos.z-G.vista.z)<1.7&&Math.abs(p.pos.y-G.vista.y)<0.6){
    G.promptAction={kind:"vista",text:"synchroniser le point de vue"}; return updatePrompt(); }
  for(const pk of G.pickups){
    if(pk.taken) continue;
    if(Math.hypot(p.pos.x-pk.x,p.pos.z-pk.z)<1.8&&p.pos.y<1.5){
      G.promptAction={kind:"pickup",pickup:pk,text:"prendre « "+pk.label+" »"}; return updatePrompt();
    }
  }
  for(const it of G.inter){
    if(it.done) continue;
    if(Math.hypot(p.pos.x-it.x,p.pos.z-it.z)<it.r){
      G.promptAction={kind:"inter",item:it,text:it.prompt}; return updatePrompt();
    }
  }
  for(const hz of G.hazards){
    if(hz.cut) continue;
    if(Math.hypot(p.pos.x-hz.px,p.pos.z-hz.pz)<1.7&&p.pos.y<1.5){
      G.promptAction={kind:"hazard",hazard:hz,text:"couper la corde du filet de noix de coco"}; return updatePrompt();
    }
  }
  for(const t of G.torches){
    if(!t.on) continue;
    if(Math.hypot(p.pos.x-t.x,p.pos.z-t.z)<1.9&&p.pos.y<1.5){
      G.promptAction={kind:"torch",torch:t,text:t.style==="lan"?"éteindre la lanterne":"éteindre le flambeau"}; return updatePrompt();
    }
  }
  updatePrompt();
}
const promptEl=document.getElementById("prompt");
function updatePrompt(){
  const a=G.promptAction;
  if(a){ promptEl.innerHTML=(a.kind==="tapu"?"":"<kbd>E</kbd>")+a.text+(a.koOK?'<span class="alt"><kbd>R</kbd>assommer</span>':'');
    promptEl.classList.add("on"); return; }
  const p=G.player;
  for(const r of G.ropes)
    for(const [from,to] of [[r.a,r.b],[r.b,r.a]])
      if(Math.hypot(p.pos.x-from.x,p.pos.z-from.z)<2&&Math.abs(p.pos.y-(from.y-0.2))<1.6&&ropeOK(p,from,to)){
        promptEl.innerHTML="<kbd>Espace</kbd>tyrolienne"; promptEl.classList.add("on"); return; }
  if(p.hang){
    promptEl.innerHTML='<kbd>Espace</kbd>se rétablir'+
      '<span class="alt"><kbd>Q</kbd><kbd>D</kbd>+<kbd>Espace</kbd>sauter au rebord voisin</span>'+
      '<span class="alt"><kbd>C</kbd>lâcher</span>';
    promptEl.classList.add("on"); return; }
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.y1<=p.pos.y+0.35||bx.y1>p.pos.y+2.35) continue;
    const px=p.pos.x+fx*0.8,pz=p.pos.z+fz*0.8;
    const cx=clamp(px,bx.minX,bx.maxX),cz=clamp(pz,bx.minZ,bx.maxZ);
    if(Math.hypot(px-cx,pz-cz)<0.75){
      promptEl.innerHTML="<kbd>Espace</kbd>grimper"; promptEl.classList.add("on"); return; }
  }
  if(!p.climbing&&wallClimb(p)){ promptEl.innerHTML="<kbd>Espace</kbd>escalader"; promptEl.classList.add("on"); return; }
  const pn=poleNear(p);
  if(pn&&!p.climbing&&(Math.abs(p.pos.y-pn.y1)<0.3||p.pos.y<pn.y1-0.5)){
    promptEl.innerHTML="<kbd>Espace</kbd>"+(Math.abs(p.pos.y-pn.y1)<0.3?"redescendre":(pn.type==="mast"?"grimper au mât":pn.type==="ora"?"grimper au ʻōrā":pn.type==="uru"?"grimper à l'arbre":"grimper au cocotier"));
    promptEl.classList.add("on"); return; }
  if(!p.climbing&&ledgeUnder(p)){
    promptEl.innerHTML="<kbd>Espace</kbd>se suspendre au rebord"; promptEl.classList.add("on"); return; }
  promptEl.classList.remove("on");
}

function updateHUD(dt){

  elBar.style.width=(d*100).toFixed(0)+"%";
  elBar.style.background=G.alarm>0?"#e0503c":(d>0.5?"#f0a94b":"#f0d060");

  else if(d>=0.75){elState.textContent="Repéré";elState.className="bad";}

function drawMini(){
  const lv=G.level;
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const bx of lv.boxes){minX=Math.min(minX,bx.minX);maxX=Math.max(maxX,bx.maxX);
    minZ=Math.min(minZ,bx.minZ);maxZ=Math.max(maxZ,bx.maxZ);}
  const W=mini.width,pad=10,span=Math.max(maxX-minX,maxZ-minZ)||1,s=(W-pad*2)/span;
  const ox=pad-minX*s+((span-(maxX-minX))*s)/2, oz=pad-minZ*s+((span-(maxZ-minZ))*s)/2;
  const X=x=>ox+x*s, Z=z=>oz+z*s;
  mctx.clearRect(0,0,W,W);
  if(G.hills.length){
    if(G.miniReliefFor!==lv){                // le relief ne bouge pas : on le peint une fois
      const cv=document.createElement("canvas"); cv.width=cv.height=W; const c2=cv.getContext("2d");
      for(let py=0;py<W;py+=4) for(let px=0;px<W;px+=4){
        const wx=(px+2-ox)/s, wz=(py+2-oz)/s, hy=hAt(wx,wz);
        if(hy<0.25) continue;
        c2.fillStyle="rgba("+(90+hy*8|0)+","+(130+hy*6|0)+",80,"+Math.min(0.55,0.12+hy*0.06).toFixed(2)+")";
        c2.fillRect(px,py,4,4);
      }
      G.miniRelief=cv; G.miniReliefFor=lv;
    }
    mctx.drawImage(G.miniRelief,0,0);
  }
  mctx.fillStyle="rgba(60,140,160,.35)";
  for(const w of lv.water||[]) mctx.fillRect(X(w.x-w.w/2),Z(w.z-w.d/2),w.w*s,w.d*s);
  for(const bx of lv.boxes){
    if(bx.type==="void"||bx.type==="chaume") continue;
    mctx.fillStyle=(bx.type==="palm"||bx.type==="mast"||bx.type==="ora"||bx.type==="uru")?"rgba(111,160,106,.8)":
      bx.type==="branch"?"rgba(140,180,120,.65)":(bx.y1<1.2?"rgba(255,255,255,.10)":
      "rgba(217,191,149,"+Math.min(0.75,0.18+bx.y1*0.04).toFixed(2)+")");
    mctx.fillRect(X(bx.minX),Z(bx.minZ),(bx.maxX-bx.minX)*s,(bx.maxZ-bx.minZ)*s);
  }
  mctx.fillStyle="rgba(111,143,106,.45)";
  for(const h of lv.hides) mctx.fillRect(X(h.x-h.w/2),Z(h.z-h.d/2),h.w*s,h.d*s);
  mctx.strokeStyle="rgba(240,169,75,.5)"; mctx.lineWidth=2;
  for(const r of G.ropes){mctx.beginPath();mctx.moveTo(X(r.a.x),Z(r.a.z));mctx.lineTo(X(r.b.x),Z(r.b.z));mctx.stroke();}
  for(const t of G.torches){
    mctx.fillStyle=t.on?"rgba(240,169,75,.75)":"rgba(120,110,95,.5)";
    mctx.beginPath();mctx.arc(X(t.x),Z(t.z),3,0,TAU);mctx.fill();
  }
  mctx.strokeStyle=mainObjectivesDone()?"#6f8f6a":"rgba(111,143,106,.35)";
  mctx.lineWidth=3; mctx.beginPath(); mctx.arc(X(lv.exit.x),Z(lv.exit.z),lv.exit.r*s,0,TAU); mctx.stroke();
  mctx.fillStyle="#f0a94b";
  G.pickups.forEach(pk=>{if(!pk.taken){mctx.beginPath();mctx.arc(X(pk.x),Z(pk.z),5,0,TAU);mctx.fill();}});
  G.guards.forEach(g=>{
    if(g.dead){
      if(g.stashed||g.carried) return;
      mctx.fillStyle="rgba(192,57,43,.55)";
      mctx.beginPath();mctx.arc(X(g.pos.x),Z(g.pos.z),4,0,TAU);mctx.fill(); return;
    }
    const c=g.def.isTarget?"#f0a94b":(g.state==="ALERT"?"#e0503c":(g.state==="INVESTIGATE"?"#f0d060":"#c9ab7c"));
    mctx.fillStyle=c;
    mctx.beginPath();mctx.arc(X(g.pos.x),Z(g.pos.z),g.def.isTarget?6:5,0,TAU);mctx.fill();
    mctx.strokeStyle=c;mctx.lineWidth=2;mctx.beginPath();
    mctx.moveTo(X(g.pos.x),Z(g.pos.z));
    mctx.lineTo(X(g.pos.x+Math.sin(g.yaw)*4.5),Z(g.pos.z+Math.cos(g.yaw)*4.5));mctx.stroke();
  });
  const p=G.player,a=p.yaw;
  mctx.fillStyle=p.hidden?"#6f8f6a":"#ffffff";
  mctx.beginPath();
  mctx.moveTo(X(p.pos.x+Math.sin(a)*6),Z(p.pos.z+Math.cos(a)*6));
  mctx.lineTo(X(p.pos.x+Math.sin(a+2.4)*4.5),Z(p.pos.z+Math.cos(a+2.4)*4.5));
  mctx.lineTo(X(p.pos.x+Math.sin(a-2.4)*4.5),Z(p.pos.z+Math.cos(a-2.4)*4.5));
  mctx.closePath();mctx.fill();
}

    '<div><span>Courir</span><b>Maj</b></div>'+
    '<div><span>S\'accroupir · plonger dans l\'eau</span><b>C</b></div>'+
    '<div><span>Escalader, grimper, sauter, corde</span><b>Espace</b></div>'+
    '<div><span>Se suspendre au rebord · se rétablir</span><b>Espace</b></div>'+
    '<div><span>Lâcher le rebord</span><b>C ou X</b></div>'+
    '<div><span>Se déplacer aux mains</span><b>Q et D</b></div>'+
    '<div><span>Sauter au rebord voisin</span><b>Q ou D + Espace</b></div>'+
    '<div><span>Franchir un muret, rouler</span><b>en courant, tout seul</b></div>'+
    '<div><span>Assassiner, agir, synchroniser</span><b>E</b></div>'+
    '<div><span>Assommer (sans tuer)</span><b>R</b></div>'+
    '<div><span>Siffler : attirer le plus proche</span><b>T</b></div>'+
    '<div><span>Manette</span><b>reconnue dès qu\'on y touche</b></div>'+
    '<div><span>Lâcher un corps</span><b>X</b></div>'+
    '<div><span>Choisir un outil</span><b>1 à 6</b></div>'+
    '<div><span>Lancer l\'outil</span><b>F</b></div>'+
    '<div><span>Caméra, zoom</span><b>souris, molette</b></div>'+
    '<div><span>Caméra sur mobile</span><b>glisser · deux doigts · double tape</b></div>'+
    '<div><span>Cônes de vision</span><b>V</b></div>'+
    '<div><span>Son</span><b>M</b></div>'+
    '<div><span>Graphismes complets / allégés</span><b>G</b></div>'+
    '<div><span>Pause</span><b>Échap</b></div>'+
    '</div>'+
    '<div class="codex"><h4>Le chemin passe par le haut</h4>'+
    '<b>Escalade</b> — les murs, les rochers, les tours de guet et la coque des navires se grimpent d\'une traite. '+
    '<b>Rebords</b> — tout ce qui s\'escalade a une corniche. Arrête-toi au bord d\'un toit, regarde le vide et appuie sur Espace : '+
    'tu te suspends par les mains. Q et D te déplacent le long du rebord et te font passer les angles ; Espace te rétablit, C te fait lâcher. '+
    'Si tu tombes le long d\'un mur, ta main trouve le rebord toute seule. Suspendu, le toit te cache de celui qui marche dessus. '+
    '<b>ʻŌrā</b> — le banian. Son tronc se grimpe comme un cocotier, et ses branches maîtresses portent un homme : on y court, on s\'y arrête, on y tend des cordes. '+
    '<b>Cocotiers et mâts</b> — on monte jusqu\'à la couronne ou la hune, où l\'on te voit mal ; des cordes de nape relient les sommets. '+
    '<b>Saut en course</b> — Espace en courant franchit un vide de trois mètres. Au bord d\'un toit, cours pour sauter, arrête-toi pour te suspendre. '+
    '<b>Franchissement</b> — un muret, une caisse, un bastingage : en courant, tu passes par-dessus sans t\'arrêter. Plus haut, il faut grimper. '+
    '<b>Roulade</b> — arrive lancé d\'une chute de moins de sept mètres et tu roules : aucun mal, presque aucun bruit. À l\'arrêt, la même chute fait du bruit et te sonne. '+
    '<b>De rebord en rebord</b> — suspendu, pousse Q ou D et appuie sur Espace : tu te jettes vers la corniche voisine. '+
    '<b>Points de vue</b> — au sommet le plus haut, synchronise-toi : l\'ʻōtaha te révèle tous les soldats. '+
    '<b>Saut de la foi</b> — dans le lagon, un bassin ou un tas de nī\'au, la chute est silencieuse.'+
    '<h4>Le fenua est ton allié</h4>'+
    '<b>Le lagon</b> — les soldats n\'y entrent pas ; accroupis-toi dans l\'eau pour plonger. '+
    '<b>Le marae</b> — lieu tapu : on n\'y verse pas le sang.'+
    '<h4>Six cachettes</h4>'+
    'L\'abri du pêcheur, le tas de nīʻau, le fourré, les tonneaux, la <b>pirogue retournée</b> et le <b>tas de filets</b>. '+
    'Sous la pirogue et derrière les tonneaux, on tient debout ; ailleurs il faut s\'accroupir. '+
    'Le nīʻau, l\'abri et les filets sont mous : on peut y tomber de haut sans bruit. '+
    '<b>Mais un garde qui enquête fouille les cachettes les plus proches</b> — et y trouve aussi les corps qu\'on y a glissés. '+
    'Se terrer sur place ne suffit plus : il faut s\'éloigner, ou monter.'+
    '<h4>Quatorze façons de frapper</h4>'+
    '<b>Dans le dos</b>, <b>aérien</b> (depuis un toit, un cocotier, une vergue), <b>embuscade</b> (abri de pêcheur, tas de nī\'au, tonneau, fourré), '+
    '<b>double</b>, <b>en pleine course</b> (bruyant), <b>dans le vide</b> (tire la sentinelle postée au bord), <b>depuis la corde</b>, '+
    '<b>par-dessus le rebord</b> (suspendu sous une corniche, attends qu\'il passe au-dessus de toi et tire-le par la cheville), '+
    '<b>noyade</b> (dans l\'eau, attrape celui qui longe la berge : le lagon ne fait aucun bruit), '+
    '<b>dans la fumée</b> (lance de la fumée : à l\'intérieur du nuage, il ne voit plus rien, et même un sapeur se prend de face), '+
    '<b>fronde</b>, <b>hora</b> (la cible titube puis tombe plus loin), <b>accident</b> (coupe un filet de noix de coco au-dessus d\'un soldat), '+
    'et <b>assommer</b> (R), sans tuer.'+
    '<h4>Les piastres</h4>Lance des pièces : les soldats se penchent pour ramasser et ne voient presque plus rien. '+
    'Même un sapeur se laisse alors prendre de face.'+
    '<h4>La garnison</h4>'+
    'Deux hommes qui se croisent en ronde s\'arrêtent et se font face un moment : la ronde s\'ouvre ailleurs. '+
    'À l\'alarme, chacun réagit selon son arme : le <b>voltigeur</b> court droit sur ta dernière position, '+
    'le <b>sapeur</b> avance lourdement mais te rattrape de plus loin, et la <b>sentinelle ne quitte pas son poste</b> — '+
    'elle reste en hauteur et fouille l\'horizon.'+
    '<h4>Sur téléphone</h4>Glisse <b>n\'importe où</b> sur l\'écran pour tourner la caméra — le manche et les boutons gardent la priorité. '+
    '<b>Deux doigts</b> règlent la distance. Un <b>double appui</b> remet la caméra derrière ton épaule. '+
    'La sensibilité, le sens du regard vertical et la caméra qui suit se règlent dans le menu Pause.</div>';
  sheet.className="sheet"; sheet.innerHTML=html;
  sheet.querySelectorAll(".lvl").forEach(btn=>btn.onclick=()=>showBrief(+btn.dataset.i));
}
function showBrief(i){
  G.phase="brief"; overlay.classList.remove("hidden"); hud.classList.add("hidden");
  const lv=LEVELS[i]();
  const arm=TOOLS.filter(t=>lv.tools[t.k]).map(t=>lv.tools[t.k]+" "+t.n.toLowerCase()).join(" · ");
  sheet.className="sheet";
  sheet.innerHTML='<h2><span style="color:var(--lantern);font-size:.5em;display:block;letter-spacing:.2em">Contrat '+(i+1)+'</span>'+lv.name+'</h2>'+
    '<p class="lede">'+lv.brief+'</p>'+
    '<ul class="tips">'+lv.objectives.map(o=>'<li>'+o.label+'</li>').join("")+'</ul>'+
    '<div class="rec"><span>Équipement</span><b>'+arm+'</b>'+
    '<span>Garnison</span><b>'+lv.guards.length+' hommes</b></div>'+
    '<div class="row"><button class="btn" id="go">Commencer</button>'+
    '<button class="btn ghost" id="back">Retour</button></div>';
  document.getElementById("go").onclick=()=>startLevel(i);
  document.getElementById("back").onclick=showMenu;
}
function startLevel(i){
  buildLevel(i); snapCamera();
  overlay.classList.add("hidden"); hud.classList.remove("hidden");
  if(isTouch){ tEl.classList.remove("hidden"); lookEl.classList.remove("hidden"); showTouchHint(); }
  G.phase="play"; sfx("good");
}
function pause(){
  if(G.phase!=="play") return;
  G.phase="pause"; overlay.classList.remove("hidden"); hideHint();
  if(document.exitPointerLock) document.exitPointerLock();
  const sensTxt=()=>"Sensibilité caméra : "+G.sens.toFixed(1).replace(".",",");
  sheet.className="sheet";
  sheet.innerHTML='<h2>Pause</h2><p class="lede">'+G.level.name+' · '+fmtTime(G.time)+'</p>'+
    '<div class="row"><button class="btn" id="res">Reprendre</button>'+
    '<button class="btn ghost" id="rs">Recommencer</button>'+
    '<button class="btn ghost" id="mn">Choisir un contrat</button></div>'+
    '<div class="row"><button class="btn ghost" id="q">Graphismes : '+(G.quality==="low"?"allégés":"complets")+'</button>'+
    '<button class="btn ghost" id="sn">'+sensTxt()+'</button>'+
    '<button class="btn ghost" id="iv">Regard vertical : '+(G.invY?"inversé":"normal")+'</button>'+
    '<button class="btn ghost" id="ac">Caméra qui suit : '+(G.autoCam?"oui":"non")+'</button></div>'+
    (isTouch?'<p class="tips" style="list-style:none;padding-left:0">Glisse n\'importe où pour regarder · deux doigts pour le zoom · double tape pour te remettre dans l\'axe.</p>':'');
  const qb=document.getElementById("q");
  qb.onclick=()=>{ setQuality(G.quality==="low"?"high":"low"); qb.textContent="Graphismes : "+(G.quality==="low"?"allégés":"complets"); };
  const sb=document.getElementById("sn");
  sb.onclick=()=>{ const steps=[0.6,0.8,1,1.3,1.7];
    G.sens=steps[(steps.indexOf(G.sens)+1)%steps.length]||1; store("fenua.sens",G.sens); sb.textContent=sensTxt(); };
  const ib=document.getElementById("iv");
  ib.onclick=()=>{ G.invY=!G.invY; store("fenua.invy",G.invY?"1":"0");
    ib.textContent="Regard vertical : "+(G.invY?"inversé":"normal"); };
  const ab=document.getElementById("ac");
  ab.onclick=()=>{ G.autoCam=!G.autoCam; store("fenua.autocam",G.autoCam?"1":"0");
    ab.textContent="Caméra qui suit : "+(G.autoCam?"oui":"non"); };
  document.getElementById("res").onclick=resume;
  document.getElementById("rs").onclick=()=>startLevel(G.levelIndex);
  document.getElementById("mn").onclick=showMenu;
}
function resume(){ overlay.classList.add("hidden"); G.phase="play"; }
function gradeOf(){
  if(G.alarmCount===0&&G.maxSeen<0.5&&G.bodiesFound===0) return "Tūpāpaʻu";
  if(G.alarmCount===0&&G.bodiesFound===0) return "Ombre";
  if(G.alarmCount===0) return "Silhouette";
  if(G.alarmCount<=1) return "Lame";
  return "Tempête";
}
function endLevel(win,reason){
  if(G.phase!=="play") return;
  G.phase="end"; overlay.classList.remove("hidden");
  if(document.exitPointerLock) document.exitPointerLock();
  const grade=gradeOf();
  let record=false;
  if(win){
    const prev=store(bestKey(G.levelIndex));
    const o=prev?JSON.parse(prev):null;
    if(!o||G.time<o.t){ store(bestKey(G.levelIndex),JSON.stringify({t:+G.time.toFixed(1),g:grade})); record=true; }
  }
  const kt=G.killTypes;
  const detail=[["dos","dans le dos"],["aerien","aériens"],["embuscade","en embuscade"],
    ["distance","à la fronde"],["double","doubles"],["elan","en course"],["chute","dans le vide"],
    ["tyrolienne","depuis la corde"],["rebord","par-dessus un rebord"],["eau","noyés"],
    ["fumee","dans la fumée"],["poison","empoisonnés"],["accident","accidents"]]
    .filter(d=>kt[d[0]]).map(d=>kt[d[0]]+" "+d[1]).join(" · ")||"aucune";
  sheet.className="sheet "+(win?"win":"lose");
  const nextI=G.levelIndex+1;
  sheet.innerHTML='<h2>'+(win?"Contrat rempli":"Contrat perdu")+'</h2>'+
    (win?'<div class="grade">'+grade+'</div>':'')+
    '<p class="lede">'+(win
      ? (G.maxSeen<0.5?"Personne ne t'a vu. Au camp, on parlera d'un tūpāpaʻu.":"Tu es sorti, mais le camp sait qu'une ombre est passée.")
        +(G.level.epilogue?"<br><br>"+G.level.epilogue:"")
      : reason)+'</p>'+
    '<div class="rec">'+
      '<span>Temps</span><b>'+fmtTime(G.time)+(record?" — record":"")+'</b>'+
      '<span>Éliminations</span><b>'+detail+'</b>'+
      '<span>Assommés</span><b>'+G.kos+'</b>'+
      (win&&G.kills===G.level.guards.filter(d=>d.isTarget).length?'<span>Mains propres</span><b>seules les cibles sont tombées</b>':'')+
      '<span>Corps dissimulés</span><b>'+G.bodiesHidden+' · '+G.bodiesFound+' découvert(s)</b>'+
      '<span>Alarmes</span><b>'+G.alarmCount+'</b>'+
    '</div>'+
    '<div class="row">'+
      (win&&nextI<LEVELS.length?'<button class="btn" id="nx">Contrat suivant</button>':'')+
      '<button class="btn '+(win&&nextI<LEVELS.length?"ghost":"")+'" id="rs">Recommencer</button>'+
      '<button class="btn ghost" id="mn">Choisir un contrat</button>'+
    '</div>';
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>showBrief(nextI);
  document.getElementById("rs").onclick=()=>startLevel(G.levelIndex);
  document.getElementById("mn").onclick=showMenu;
  sfx(win?"good":"kill");
}

/* ============================================================
   18. Boucle principale
   ============================================================ */
const clock=new THREE.Clock();
let objT=0, menuT=0;
function frame(){
  requestAnimationFrame(frame);
  const real=Math.min(clock.getDelta(),0.05);
  VT+=real;
  let dt=real;
  if(G.slow>0){ G.slow-=real; dt=real*0.32; }
  pollGamepad(real);
  if(G.phase==="play"&&G.player){
    G.time+=dt;
    updatePlayer(dt);
    if(G.phase!=="play"){renderer.render(scene,camera);return;}
    updateGuards(dt);
    if(G.phase!=="play"){renderer.render(scene,camera);return;}
    if(G.alarm>0) G.alarm=Math.max(0,G.alarm-dt);
    G.pickups.forEach(p=>{if(!p.taken){p.mesh.rotation.y+=dt*2;p.mesh.position.y=1.0+Math.sin(G.time*3)*0.09;}});
    if(G.exitRing){
      const ok=mainObjectivesDone();
      G.exitRing.material.opacity=ok?(0.55+Math.sin(VT*3.2)*0.3):0.18;
      G.exitRing.material.color.setHex(ok?0x9fd08a:0x5a6b58);
      G.exitBeam.material.opacity=lerp(G.exitBeam.material.opacity,ok?0.5+Math.sin(VT*2)*0.12:0,Math.min(1,real*3));
      if(ok&&Math.hypot(G.player.pos.x-G.level.exit.x,G.player.pos.z-G.level.exit.z)<G.level.exit.r
         &&G.player.pos.y<1.5){
        completeObjective(G.level.objectives.find(o=>o.exit).id);
        endLevel(true);
      }
    }
    computePrompt(); updateCamera(real); updateHUD(real);
    objT+=real; if(objT>0.5){objT=0;updateObjectivesUI();}
    updateFX(dt); updateRipples(dt); updateHazards(dt);
    updateLightPool(G.player.pos.x,G.player.pos.z);
  }else if(G.phase==="menu"||G.phase==="brief"){
    menuT+=real*0.045;
    if(camera.fov!==62){camera.fov=62;camera.updateProjectionMatrix();}
    camera.position.set(Math.cos(menuT)*40,21+Math.sin(menuT*0.7)*3,Math.sin(menuT)*40);
    camera.lookAt(0,3,0);
    updateLightPool(camera.position.x*0.35,camera.position.z*0.35);
  }
  G.torches.forEach((t,k)=>{ if(t.on){
    const f=0.92+Math.sin(VT*9+k*1.7)*0.1+Math.sin(VT*21+k)*0.05;
    t.flame.scale.set(f,0.9+Math.sin(VT*13+k)*0.14,f);} });
  updateEmbers(dt); updateFireflies(dt); animDecor();
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  moonSpr.position.copy(camera.position).add(MOON_DIR);
  renderer.render(scene,camera);
}

if(G.quality==="low") setQuality("low",true);
buildLevel(0);
hud.classList.add("hidden");
showMenu();
frame();
})();
</script>
