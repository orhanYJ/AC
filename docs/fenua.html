<style>
  :root{
    --night:#0f1f2a; --night-deep:#08141c;
    --stone:#d9bf95; --sand:#c8a86f;
    --lantern:#f0a94b; --blood:#c0392b; --sage:#5f9f93;
    --ui-text:#f3e9d6; --ui-dim:#a79c88;
    --panel:rgba(11,17,32,.72); --edge:rgba(240,169,75,.35);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ color-scheme:dark; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--night-deep);color:var(--ui-text);
    font-family:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hidden{display:none !important}

  #hud{position:fixed;inset:0;pointer-events:none}
  .panel{background:var(--panel);border:1px solid rgba(240,169,75,.18);border-radius:3px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #objectives{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
    max-width:min(58vw,290px);padding:9px 11px}
  #objectives h3{font-family:"Marcellus",Georgia,serif;margin:0 0 5px;font-size:12.5px;letter-spacing:.06em;color:var(--lantern);font-weight:400}
  #objlist{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.4}
  #objlist li{display:flex;gap:6px;align-items:flex-start}
  #objlist li .mk{width:11px;flex:none;color:var(--lantern)}
  #objlist li.done{color:var(--ui-dim);text-decoration:line-through}
  #objlist li.done .mk{color:var(--sage)}
  #objlist li.opt .mk{color:var(--ui-dim)}

  #topcenter{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    width:min(46vw,230px);text-align:center}
  #detectwrap{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  #detectbar{height:100%;width:0%;background:var(--lantern);transition:width .07s linear}
  #statetxt{font-size:11.5px;letter-spacing:.09em;margin-top:5px;color:var(--ui-dim);font-family:"Marcellus",Georgia,serif}
  #statetxt.warn{color:var(--lantern)} #statetxt.bad{color:var(--blood)}
  #tags{font-size:10.5px;margin-top:2px;letter-spacing:.06em;color:var(--ui-dim);min-height:14px}
  #tags .hide{color:var(--sage)} #tags .lit{color:var(--lantern)} #tags .body{color:var(--blood)}

  #stats{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
    padding:7px 10px;font-size:11.5px;text-align:right;line-height:1.55}
  #stats b{font-weight:600;color:var(--lantern);font-variant-numeric:tabular-nums}
  #levelname{font-family:"Marcellus",Georgia,serif;font-size:12px;color:var(--ui-dim)}

  #mini{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));width:140px;height:140px;
    background:var(--panel);border:1px solid rgba(240,169,75,.18);border-radius:3px}

  #prompt .alt{margin-left:14px;opacity:.85}
  #tools{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;pointer-events:auto}
  .tool{font:inherit;font-size:11px;cursor:pointer;background:transparent;color:var(--ui-dim);
    border:1px solid transparent;border-radius:3px;padding:5px 9px;line-height:1.25;text-align:center;min-width:58px}
  .tool .n{display:block;font-size:9.5px;opacity:.6}
  .tool b{display:block;font-weight:600;color:var(--ui-text);font-variant-numeric:tabular-nums}
  .tool.sel{border-color:var(--edge);background:rgba(240,169,75,.14);color:var(--ui-text)}
  .tool.empty{opacity:.35}

  #prompt{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    padding:7px 13px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .15s}
  #prompt.on{opacity:1}
  #prompt kbd{font:inherit;font-weight:600;color:var(--lantern);border:1px solid var(--edge);
    border-radius:3px;padding:0 5px;margin-right:6px}
  #toast{position:absolute;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    padding:7px 15px;font-size:12.5px;opacity:0;transition:opacity .3s;font-family:"Marcellus",Georgia,serif;white-space:nowrap}
  #toast.on{opacity:1}
  #vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    box-shadow:inset 0 0 140px 30px rgba(192,57,43,.55)}
  #vignette.on{opacity:1}

  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 0%,rgba(29,39,64,.25) 0%,rgba(11,17,32,.78) 70%);
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;z-index:10}
  .sheet{width:min(580px,100%);margin:auto;background:rgba(11,17,32,.66);border:1px solid rgba(240,169,75,.14);
    border-radius:4px;padding:clamp(18px,4vw,30px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  h1{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(28px,7vw,44px);margin:0 0 4px;line-height:1.1}
  h1 .sub{display:block;font-size:clamp(11px,3vw,14px);color:var(--lantern);letter-spacing:.22em;margin-bottom:10px}
  .lede{color:var(--ui-dim);font-size:14px;line-height:1.6;max-width:58ch;margin:0 0 18px}
  h2{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(22px,5.5vw,32px);margin:0 0 6px}
  .levels{display:grid;gap:7px;margin:0 0 18px}
  .lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.035);border:1px solid rgba(240,169,75,.16);border-radius:3px;
    padding:11px 13px;color:var(--ui-text);font:inherit;transition:background .15s,border-color .15s}
  .lvl:hover,.lvl:focus-visible{background:rgba(240,169,75,.1);border-color:var(--edge);outline:none}
  .lvl .num{font-family:"Marcellus",Georgia,serif;font-size:19px;color:var(--lantern);width:20px;flex:none}
  .lvl .t{font-family:"Marcellus",Georgia,serif;font-size:15.5px}
  .lvl .d{font-size:12px;color:var(--ui-dim);margin-top:2px}
  .lvl .best{margin-left:auto;font-size:11px;color:var(--sage);flex:none;text-align:right}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:3px 18px;
    font-size:12px;color:var(--ui-dim);border-top:1px solid rgba(240,169,75,.16);padding-top:13px}
  .keys div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .keys b{color:var(--ui-text);font-weight:600}
  .btn{font:inherit;font-size:14px;cursor:pointer;background:var(--lantern);color:#1a1205;border:0;
    border-radius:3px;padding:11px 22px;font-weight:600}
  .btn:hover{background:#ffbc60}
  .btn.ghost{background:transparent;color:var(--ui-text);border:1px solid var(--edge)}
  .btn.ghost:hover{background:rgba(240,169,75,.12)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .rec{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:13px;margin:14px 0 0;
    color:var(--ui-dim);border-top:1px solid rgba(240,169,75,.16);padding-top:13px}
  .rec b{color:var(--ui-text);font-weight:600;font-variant-numeric:tabular-nums}
  .tips{font-size:12.5px;color:var(--ui-dim);line-height:1.6;margin:12px 0 0;padding-left:18px}
  .grade{font-family:"Marcellus",Georgia,serif;font-size:clamp(30px,8vw,46px);color:var(--lantern);margin:2px 0 8px}
  .win h2{color:var(--lantern)} .lose h2{color:var(--blood)}
  .codex{border-top:1px solid rgba(240,169,75,.16);padding-top:13px;margin-top:16px;
    font-size:12.5px;color:var(--ui-dim);line-height:1.6}
  .codex h4{font-family:"Marcellus",Georgia,serif;font-weight:400;color:var(--ui-text);
    font-size:14px;margin:10px 0 3px}
  .codex b{color:var(--ui-text);font-weight:600}

  #touch{position:fixed;inset:0;z-index:5;pointer-events:none}
  #stick{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));
    bottom:calc(22px + env(safe-area-inset-bottom,0px));width:118px;height:118px;border-radius:50%;
    border:1px solid rgba(240,169,75,.3);background:rgba(11,17,32,.35);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(240,169,75,.45)}
  #tbtns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));
    bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;
    grid-template-columns:repeat(2,62px);pointer-events:auto}
  .tb{height:46px;border-radius:5px;border:1px solid rgba(240,169,75,.3);background:rgba(11,17,32,.55);
    color:var(--ui-text);font:inherit;font-size:10.5px;line-height:1.15;touch-action:none;cursor:pointer;padding:2px}
  .tb.on{background:rgba(240,169,75,.35)}
  /* le regard occupe tout l'écran mais se place SOUS le HUD et les manettes,
     qui reçoivent donc les appuis en premier */
  #look{position:fixed;inset:0;touch-action:none}
  #hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);max-width:min(80vw,330px);
    padding:14px 16px;font-size:13px;line-height:1.55;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
  #hint.on{opacity:1}
  #hint b{color:var(--lantern);font-weight:600}
  @media (hover:hover) and (pointer:fine){ #touch,#look{display:none} }
  @media (hover:none){
    /* la barre d'outils passe AU-DESSUS des boutons tactiles, qui mesurent 202 px de haut :
       sinon les deux derniers outils se retrouvent sous « Agir » et « Grimper » */
    #tools{bottom:calc(230px + env(safe-area-inset-bottom,0px))}
    #prompt{bottom:calc(296px + env(safe-area-inset-bottom,0px))}
    #mini{left:auto;bottom:auto;right:calc(12px + env(safe-area-inset-right,0px));
      top:calc(96px + env(safe-area-inset-top,0px));width:96px;height:96px}
  }
  @media (max-width:520px){ #mini{width:104px;height:104px} .tool{min-width:50px;font-size:10px;padding:4px 6px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="look" class="hidden"></div>

<div id="hud" class="hidden">
  <div id="objectives" class="panel"><h3>Contrat</h3><ul id="objlist"></ul></div>
  <div id="topcenter">
    <div id="detectwrap"><div id="detectbar"></div></div>
    <div id="statetxt">Dans l'ombre</div>
    <div id="tags"></div>
  </div>
  <div id="stats" class="panel">
    <div id="levelname"></div>
    <div><b id="time">0:00</b> écoulées</div>
    <div><b id="kills">0</b> éliminations</div>
  </div>
  <canvas id="mini" width="300" height="300"></canvas>
  <div id="tools" class="panel"></div>
  <div id="prompt" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="vignette"></div>
  <div id="hint" class="panel"></div>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button class="tb" id="tbRun">Courir</button>
    <button class="tb" id="tbCrouch">Accroupi</button>
    <button class="tb" id="tbTool">Outil ▸</button>
    <button class="tb" id="tbThrow">Lancer</button>
    <button class="tb" id="tbAct">Agir</button>
    <button class="tb" id="tbKO">Assommer</button>
    <button class="tb" id="tbClimb">Grimper</button>
    <button class="tb" id="tbWhistle">Siffler</button>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Si cdnjs ne répond pas, on retente par jsdelivr. document.write est voulu ici :
// il bloque l'analyse de la page le temps du chargement, ce dont le script du jeu a besoin.
if(!window.THREE)
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></scr'+'ipt>');
</script>
<script>
(function(){
"use strict";

// Ni cdnjs ni jsdelivr : on le dit, plutôt que de laisser un écran noir.
if(!window.THREE){
  document.getElementById("sheet").innerHTML=
    '<h1><span class="sub">L\'Ombre du Fenua</span>La bibliothèque 3D n\'a pas pu être chargée</h1>'+
    '<p class="lede">Le jeu a besoin de Three.js, servi par cdnjs ou par jsdelivr. Aucun des deux n\'a répondu.'+
    '<br><br>Vérifie ta connexion, puis recharge la page. Si tu utilises un bloqueur de publicité ou un '+
    'réseau d\'entreprise, il filtre peut-être ces deux adresses.</p>'+
    '<div class="row"><button class="btn" id="rl">Recharger la page</button></div>';
  document.getElementById("rl").onclick=()=>location.reload();
  return;
}

/* ============================================================
   0. Outils généraux
   ============================================================ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function angDelta(a,b){let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
function fmtTime(s){const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+String(r).padStart(2,"0");}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
// distance d'un point au segment, dans le plan horizontal
function distPtSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az, l2=dx*dx+dz*dz;
  if(l2<1e-8) return Math.hypot(px-ax,pz-az);
  const t=clamp(((px-ax)*dx+(pz-az)*dz)/l2,0,1);
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));
}

/* ============================================================
   1. Socle Three.js
   ============================================================ */
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
const TOUCH_DEV=matchMedia("(hover:none)").matches;
function basePR(){return Math.min(devicePixelRatio,TOUCH_DEV?1.5:2);}
renderer.setPixelRatio(basePR());
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;

const scene=new THREE.Scene();
const HORIZON=0x2e2b4a;
scene.background=new THREE.Color(HORIZON);
scene.fog=new THREE.Fog(HORIZON,40,140);
const camera=new THREE.PerspectiveCamera(62,1,0.1,440);

scene.add(new THREE.HemisphereLight(0x5b6fa6,0x221a12,0.42));
const moon=new THREE.DirectionalLight(0x9fb3e6,0.58);
moon.position.set(38,52,26); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
const sc=moon.shadow.camera;
sc.left=-46;sc.right=46;sc.top=46;sc.bottom=-46;sc.near=1;sc.far=140;
moon.shadow.bias=-0.0006; moon.shadow.normalBias=0.05;
scene.add(moon); scene.add(moon.target);
// appoint froid venu du côté opposé : il détache les silhouettes du fond sans éclairer la scène
const fill=new THREE.DirectionalLight(0x6f86c4,0.22);
fill.position.set(-34,26,-30); scene.add(fill);
const MOON_DIR=new THREE.Vector3(38,52,26).normalize().multiplyScalar(300);

// lumières ponctuelles, réaffectées chaque image aux torches les plus proches
const LIGHT_POOL=[];
for(let i=0;i<6;i++){const l=new THREE.PointLight(0xff9038,0,15,2);scene.add(l);LIGHT_POOL.push(l);}

function onResize(){renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener("resize",onResize);onResize();

/* ---- textures peintes dans un canvas ---- */
function canvasTex(w,h,draw){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return t;
}
function wrap(w,h,fn){for(const dx of [-w,0,w])for(const dy of [-h,0,h])fn(dx,dy);}
function speckle(x,w,h,n,a){
  for(let i=0;i<n;i++){
    x.fillStyle=Math.random()<.5?"rgba(0,0,0,"+(Math.random()*a)+")":"rgba(255,240,215,"+(Math.random()*a)+")";
    const s=1+Math.random()*2.2; x.fillRect(Math.random()*w,Math.random()*h,s,s);
  }
}
function plaster(base,brick){
  return canvasTex(512,512,(x,w,h)=>{
    x.fillStyle=base; x.fillRect(0,0,w,h);
    for(let i=0;i<55;i++){
      const r=24+Math.random()*90, px=Math.random()*w, py=Math.random()*h, dk=Math.random()<.55;
      wrap(w,h,(dx,dy)=>{
        const g=x.createRadialGradient(px+dx,py+dy,0,px+dx,py+dy,r);
        g.addColorStop(0,dk?"rgba(55,35,18,.13)":"rgba(255,245,225,.11)"); g.addColorStop(1,"rgba(0,0,0,0)");
        x.fillStyle=g; x.fillRect(px+dx-r,py+dy-r,r*2,r*2);
      });
    }
    // plâtre écaillé qui laisse voir la brique crue
    for(let k=0;k<2;k++){
      const cx=60+Math.random()*(w-120), cy=60+Math.random()*(h-120), rw=34+Math.random()*60, rh=24+Math.random()*40, rot=Math.random()*3;
      x.save(); x.beginPath(); x.ellipse(cx,cy,rw,rh,rot,0,TAU); x.clip();
      x.fillStyle=brick; x.fillRect(cx-rw-60,cy-rh-60,rw*2+120,rh*2+120);
      x.strokeStyle="rgba(35,22,10,.4)"; x.lineWidth=1.5;
      for(let yy=cy-rh-60,row=0;yy<cy+rh+60;yy+=13,row++){
        x.beginPath(); x.moveTo(cx-rw-60,yy); x.lineTo(cx+rw+60,yy); x.stroke();
        for(let xx=cx-rw-60+(row%2?13:0);xx<cx+rw+60;xx+=26){x.beginPath();x.moveTo(xx,yy);x.lineTo(xx,yy+13);x.stroke();}
      }
      x.restore();
      x.strokeStyle="rgba(45,28,14,.22)"; x.lineWidth=1.5;
      x.beginPath(); x.ellipse(cx,cy,rw,rh,rot,0,TAU); x.stroke();
    }
    x.strokeStyle="rgba(40,26,12,.38)"; x.lineWidth=1.3;
    for(let k=0;k<8;k++){
      let px=30+Math.random()*(w-60), py=20+Math.random()*(h-140); x.beginPath(); x.moveTo(px,py);
      for(let s=0;s<7;s++){px+=(Math.random()-.5)*24; py+=6+Math.random()*14; x.lineTo(px,py);} x.stroke();
    }
    for(let k=0;k<14;k++){                     // coulures de pluie, depuis le haut

    .replace('#include <common>','#include <common>\nattribute float aHerbe;\nvarying float vHerbe;\nvarying vec2 vUvH;')
    .replace('#include <uv_vertex>','#include <uv_vertex>\nvHerbe=aHerbe;\nvUvH=uv*46.0;');
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>','#include <common>\nuniform sampler2D tHerbe;\nvarying float vHerbe;\nvarying vec2 vUvH;')
    .replace('#include <map_fragment>',
      'vec4 texelColor=mix(texture2D(map,vUv),texture2D(tHerbe,vUvH),vHerbe);\n'+
      'texelColor=mapTexelToLinear(texelColor);\ndiffuseColor*=texelColor;');
};

    'transformed.x+=sin(uVent*1.6+ph)*'+amp.toFixed(3)+'*kv;\ntransformed.z+=cos(uVent*1.1+ph)*'+(amp*0.6).toFixed(3)+'*kv;\n#endif');

// les branches maîtresses : [angle, portée, hauteur], chacune une plateforme où l'on court
function limbs(out,x,z,arms,wd){
  arms.forEach(a=>{
    const ang=a[0], len=a[1], y=a[2], ex=x+Math.sin(ang)*len, ez=z+Math.cos(ang)*len;
    const alongX=Math.abs(Math.sin(ang))>Math.abs(Math.cos(ang));
    const w=alongX?len:wd, d=alongX?wd:len;
    const br=b((x+ex)/2,(z+ez)/2,w,d,y-0.7,y,"branch");
    br.tx=x; br.tz=z;                       // pour dessiner la branche depuis le tronc
    out.push(br);

/* ---- Relief ------------------------------------------------------------
   Les collines ne sont pas des boîtes : c'est une fonction de hauteur. Chaque
   colline est une bosse en cosinus, elliptique, avec un plateau facultatif au
   sommet (top, en fraction du rayon) et une ondulation douce. Quand deux
   collines se touchent, on garde la plus haute : elles se fondent en crête.
   Le joueur et les gardes marchent dessus, et elles coupent la vue.        */
function hillAt(x,z,hills){
  let y=0;
  if(!hills) return 0;
  for(let i=0;i<hills.length;i++){
    const H=hills[i];
    let dx=x-H.x, dz=z-H.z;
    if(H.rot){ const c=Math.cos(H.rot), sn=Math.sin(H.rot), t=dx*c-dz*sn; dz=dx*sn+dz*c; dx=t; }
    const r=Math.sqrt(dx*dx/(H.rx*H.rx)+dz*dz/(H.rz*H.rz));
    if(r>=1) continue;
    const top=H.top||0, t=r<=top?0:(r-top)/(1-top);
    let v=H.h*0.5*(1+Math.cos(Math.PI*t));
    v+=H.h*0.035*Math.sin(x*0.63+z*0.41)*Math.sin(x*0.37-z*0.71)*(1-t);
    if(v>y) y=v;
  }
  return y;
}
// Un escalier : des marches de moins de 40 cm, qu'on monte sans rien presser —
// les gardes aussi. (x,z) = pied ; dir = sens de la montée ("x+", "x-", "z+", "z-").
// Chaque marche doit faire au moins 50 cm de profondeur, sinon on bute.
function escalier(out,x,z,dir,len,h,w){
  const n=Math.max(2,Math.ceil(h/0.38)), st=len/n, ax=dir[0]==="x", sg=dir[1]==="+"?1:-1;
  for(let k=0;k<n;k++){
    const off=sg*st*(k+0.5);
    out.push(b(x+(ax?off:0),z+(ax?0:off),ax?st:w,ax?w:st,0,h*(k+1)/n,"marche"));
  }
}

function circleVsBoxes(pos,r,feetY,headY,boxes){
  for(let i=0;i<boxes.length;i++){
    const bx=boxes[i];
    if(bx.y1<=feetY+0.45) continue;
    if(bx.y0>=headY) continue;
    const cx=clamp(pos.x,bx.minX,bx.maxX), cz=clamp(pos.z,bx.minZ,bx.maxZ);
    const dx=pos.x-cx, dz=pos.z-cz, d2=dx*dx+dz*dz;
    if(d2>r*r) continue;
    if(d2>1e-8){ const d=Math.sqrt(d2),push=r-d; pos.x+=dx/d*push; pos.z+=dz/d*push; }
    else{
      const l=pos.x-bx.minX, ri=bx.maxX-pos.x, u=pos.z-bx.minZ, dn=bx.maxZ-pos.z;
      const m=Math.min(l,ri,u,dn);
      if(m===l)pos.x=bx.minX-r; else if(m===ri)pos.x=bx.maxX+r;
      else if(m===u)pos.z=bx.minZ-r; else pos.z=bx.maxZ+r;
    }
  }
}
// hauteur du relief sous (x,z) dans le niveau en cours
function hAt(x,z){ return G.hills.length?hillAt(x,z,G.hills):0; }
function groundAt(x,z,fromY,boxes,sansRelief){
  let g=sansRelief?0:hAt(x,z);
  for(let i=0;i<boxes.length;i++){
    const bx=boxes[i];
    if(x<bx.minX||x>bx.maxX||z<bx.minZ||z>bx.maxZ) continue;
    if(bx.y1>fromY+0.45) continue;
    if(bx.y1>g) g=bx.y1;
  }
  return g;
}
function insideBox(x,z,bx,m){return x>bx.minX-m&&x<bx.maxX+m&&z>bx.minZ-m&&z<bx.maxZ+m;}
function rayBoxXZ(ox,oz,dx,dz,bx,maxT){
  let tmin=0,tmax=maxT;
  if(Math.abs(dx)<1e-7){ if(ox<bx.minX||ox>bx.maxX) return null; }
  else{ let t1=(bx.minX-ox)/dx,t2=(bx.maxX-ox)/dx; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  if(Math.abs(dz)<1e-7){ if(oz<bx.minZ||oz>bx.maxZ) return null; }
  else{ let t1=(bx.minZ-oz)/dz,t2=(bx.maxZ-oz)/dz; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  return tmin>=0?tmin:null;
}
function rayBoxSpanXZ(ox,oz,dx,dz,bx,maxT){
  let tmin=0,tmax=maxT;
  if(Math.abs(dx)<1e-7){ if(ox<bx.minX||ox>bx.maxX) return null; }
  else{ let t1=(bx.minX-ox)/dx,t2=(bx.maxX-ox)/dx; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  if(Math.abs(dz)<1e-7){ if(oz<bx.minZ||oz>bx.maxZ) return null; }
  else{ let t1=(bx.minZ-oz)/dz,t2=(bx.maxZ-oz)/dz; if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return null; }
  return tmin<=tmax?[Math.max(tmin,0),tmax]:null;
}
function lineOfSight(ax,ay,az,bx2,by,bz,boxes){
  const dx=bx2-ax, dz=bz-az, dist=Math.hypot(dx,dz);
  if(dist<1e-4) return true;
  const nx=dx/dist, nz=dz/dist, lowest=Math.min(ay,by);
  if(G.hills.length){                       // une crête entre les deux yeux ?
    const n=Math.ceil(dist/1.1);
    for(let k=1;k<n;k++){ const t=k/n;
      if(hAt(ax+dx*t,az+dz*t)>ay+(by-ay)*t+0.05) return false; }
  }
  for(let i=0;i<boxes.length;i++){
    const bo=boxes[i];
    if(bo.y1<lowest-0.05) continue;
    const sp=rayBoxSpanXZ(ax,az,nx,nz,bo,dist-0.15);
    if(!sp||sp[0]>=dist-0.15) continue;
    const t2=Math.min(sp[1],dist-0.15);
    const h1=ay+(by-ay)*(sp[0]/dist), h2=ay+(by-ay)*(t2/dist);
    if(Math.min(h1,h2)<bo.y1-0.05&&Math.max(h1,h2)>bo.y0+0.05) return false;
  }
  return true;
}

// Un membre en deux segments articulés : le haut pivote à l'épaule ou à la
// hanche, le bas (« lower ») au coude ou au genou. Tout ce qu'on accroche à la
// main ou au pied va dans « lower » pour suivre le mouvement.
const UP=0.52;                                   // part du segment supérieur
function limb(w,h,d,mat,px,py,pz){
  const g=new THREE.Group(); g.position.set(px,py,pz);
  const up=h*UP;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,up,d),mat);
  m.position.y=-up/2; m.castShadow=true; g.add(m);
  const lo=new THREE.Group(); lo.position.y=-up; g.add(lo);
  const m2=new THREE.Mesh(new THREE.BoxGeometry(w*0.93,h-up,d*0.93),mat);
  m2.position.y=-(h-up)/2; m2.castShadow=true; lo.add(m2);
  g.lower=lo;
  return g;
}

/* Fusion de géométries : plusieurs pièces immobiles (boîtes, sphères, cylindres…)
   deviennent UN seul mesh, la couleur de chacune cuite dans les sommets. Sur
   téléphone, un garde passe ainsi de 37 objets à une douzaine.               */
const VC_MAT=new THREE.MeshLambertMaterial({vertexColors:true});
const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),
      _n=new THREE.Vector3(),_m3=new THREE.Matrix3(),_p=new THREE.Vector3(),_sc=new THREE.Vector3(),_c=new THREE.Color();
function mergeGeo(parts){
  const pos=[],nor=[],col=[],idx=[]; let base=0;
  for(const p of parts){
    const g=p.geo;
    _e.set(p.rx||0,p.ry||0,p.rz||0,"XYZ"); _q.setFromEuler(_e);
    _p.set(p.x||0,p.y||0,p.z||0); _sc.set(p.sx===undefined?1:p.sx,p.sy===undefined?1:p.sy,p.sz===undefined?1:p.sz);
    _m4.compose(_p,_q,_sc); _m3.getNormalMatrix(_m4); _c.setHex(p.color);
    const P=g.attributes.position, N=g.attributes.normal;
    for(let k=0;k<P.count;k++){
      _v.fromBufferAttribute(P,k).applyMatrix4(_m4); pos.push(_v.x,_v.y,_v.z);
      _n.fromBufferAttribute(N,k).applyMatrix3(_m3).normalize(); nor.push(_n.x,_n.y,_n.z);
      col.push(_c.r,_c.g,_c.b);
    }
    if(g.index){ const I=g.index; for(let k=0;k<I.count;k++) idx.push(I.getX(k)+base); }
    else for(let k=0;k<P.count;k++) idx.push(k+base);
    base+=P.count; g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  out.setIndex(idx); return out;
}
// un four : on lui confie les pièces immobiles d'un même parent, il n'en sort qu'un mesh
function baker(parent,shadow){
  const parts=[];
  return {
    add(geo,color,x,y,z,opt){ parts.push(Object.assign({geo,color,x,y,z},opt||{})); },
    flush(){ if(!parts.length) return null; const m=new THREE.Mesh(mergeGeo(parts),VC_MAT);
      m.castShadow=!!shadow; parent.add(m); parts.length=0; return m; }
  };
}

function poseWalk(mesh,phase,amt){
  const u=mesh.userData; if(!u||!u.legL) return;
  const s=Math.sin(phase)*amt;
  u.legL.rotation.x=s; u.legR.rotation.x=-s;
  u.armL.rotation.x=-s*0.8; u.armR.rotation.x=s*0.8;
  // le genou ne plie que vers l'arrière, le coude que vers l'avant
  u.legL.lower.rotation.x=Math.max(0,Math.sin(phase+2.2))*amt*2.1;
  u.legR.lower.rotation.x=Math.max(0,Math.sin(phase+2.2+Math.PI))*amt*2.1;
  u.armL.lower.rotation.x=-0.13-Math.max(0,-Math.sin(phase))*amt*0.9;
  u.armR.lower.rotation.x=-0.13-Math.max(0, Math.sin(phase))*amt*0.9;
}

let actx=null,muted=false;
function sfx(type){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const S=(ty,f1,f2,v,d)=>{o.type=ty;o.frequency.setValueAtTime(f1,t);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.01);};
    if(type==="tick") S("sine",760,null,.05,.08);
    else if(type==="alarm"){o.type="sawtooth";o.frequency.setValueAtTime(320,t);
      o.frequency.linearRampToValueAtTime(640,t+.35);g.gain.setValueAtTime(.09,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.7);o.start(t);o.stop(t+.72);}
    else if(type==="kill") S("triangle",210,70,.12,.25);
    else if(type==="good") S("sine",520,880,.08,.3);
    else if(type==="stone") S("square",420,180,.06,.13);
    else if(type==="knife") S("square",1200,500,.05,.12);
    else if(type==="smoke") S("sawtooth",180,60,.07,.5);
    else if(type==="boom") S("sawtooth",520,90,.11,.5);
    else if(type==="thud") S("sine",120,45,.11,.35);
    else if(type==="rope") S("sawtooth",300,900,.05,.5);
    else if(type==="siffle"){o.type="sine";o.frequency.setValueAtTime(880,t);
      o.frequency.linearRampToValueAtTime(1320,t+.12);o.frequency.linearRampToValueAtTime(1100,t+.3);
      g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.36);o.start(t);o.stop(t+.38);}
  }catch(e){}
}

function worldUV(geo,w,h,d,s){

/* ---- architecture : fenêtres, portes, créneaux ---- */
function collectWindows(bx,boxes,wins,doors){
  const h=bx.y1-bx.y0;
  if(bx.y0>0.1||h<3.8||bx.type==="crate"||Math.min(bx.w,bx.d)<3.2) return;
  const faces=[[1,0,bx.d,bx.maxX,bx.z],[-1,0,bx.d,bx.minX,bx.z],[0,1,bx.w,bx.x,bx.maxZ],[0,-1,bx.w,bx.x,bx.minZ]];
  const rows=[2.3]; if(h>5.3) rows.push(4.4); if(h>7.5) rows.push(6.5);
  const doorFace=Math.abs(Math.round(bx.x*3+bx.z*7))%4;
  faces.forEach((f,fi)=>{
    const nx=f[0],nz=f[1],len=f[2],cx=f[3],cz=f[4];
    const at=(off,out)=>[cx+(nz?off:0)+nx*out, cz+(nx?off:0)+nz*out];
    const blocked=(off,y)=>{const o=at(off,0.4);
      return boxes.some(q=>q!==bx&&q.y1>y-0.6&&q.y0<y+0.6&&insideBox(o[0],o[1],q,0.05));};
    const rot=nx?Math.PI/2:0;
    let doorOff=null;
    if(fi===doorFace&&len>=4&&!blocked(0,1.1)){
      doorOff=0; const p=at(0,0.08); doors.push({x:p[0],z:p[1],rot,nx,nz});
    }
    const n=Math.floor((len-1.4)/2.7); if(n<1) return;
    const step=len/(n+1);
    for(let k=1;k<=n;k++){
      const off=-len/2+step*k;
      rows.forEach(y=>{
        if(y>h-0.9) return;
        if(doorOff!==null&&y<3.5&&Math.abs(off-doorOff)<1.5) return;
        if(Math.random()<0.3||blocked(off,y)) return;
        const p=at(off,0.02);
        wins.push({x:p[0],y,z:p[1],rot,nx,nz,lit:Math.random()<0.22,shut:Math.random()<0.45});
      });
    }
  });
}
function collectMerlons(bx,out){
  const alongX=bx.w>bx.d, len=alongX?bx.w:bx.d, n=Math.floor(len/1.6);
  for(let k=0;k<n;k++){
    const off=-len/2+(k+0.5)*len/n;
    out.push({x:alongX?bx.x+off:bx.x, z:alongX?bx.z:bx.z+off, y:bx.y1+0.4,
      w:alongX?0.8:bx.w, d:alongX?bx.d:0.8});
  }
}

function hangLine(a,b){
  const A=new THREE.Vector3(a[0],a[1],a[2]), B=new THREE.Vector3(b[0],b[1],b[2]);
  const D=A.distanceTo(B), mid=A.clone().add(B).multiplyScalar(.5); mid.y-=D*0.09;
  const curve=new THREE.QuadraticBezierCurve3(A,mid,B);
  G.root.add(new THREE.Mesh(new THREE.TubeGeometry(curve,18,0.018,4,false),MAT.rope));
  const n=Math.max(3,Math.floor(D/1.1)), ang=-Math.atan2(B.z-A.z,B.x-A.x);
  for(let k=1;k<n;k++){
    const piv=new THREE.Group(); piv.rotation.order="YXZ";
    piv.position.copy(curve.getPoint(k/n)); piv.rotation.y=ang; G.root.add(piv);
    const str=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.2,3),MAT.rope);
    str.position.y=-0.1; piv.add(str);
    const col=[0xffb050,0xff7a3a,0xffd27a,0xe85a3a][k%4];
    const lan=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),new THREE.MeshBasicMaterial({color:col,toneMapped:false}));
    lan.scale.y=1.3; lan.position.y=-0.3; piv.add(lan);
    const gl=new THREE.Sprite(GLOW_SPR_MAT); gl.scale.set(0.9,0.9,1); gl.position.y=-0.3; piv.add(gl);
    G.anim.push({o:piv,k:Math.random()*TAU,type:"bob"});
  }
}
function gable(x,y,z,w,d,h,axis){
  const span=axis==="x"?d:w, len=axis==="x"?w:d;
  const sh=new THREE.Shape(); sh.moveTo(-span/2-0.35,0); sh.lineTo(span/2+0.35,0); sh.lineTo(0,h); sh.lineTo(-span/2-0.35,0);
  const geo=new THREE.ExtrudeGeometry(sh,{depth:len+0.5,bevelEnabled:false});
  geo.translate(0,0,-(len+0.5)/2);
  const m=new THREE.Mesh(geo,[MAT.wall2,MAT.tiles]);
  if(axis==="x") m.rotation.y=Math.PI/2;
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; G.root.add(m);
}

    [1,-1].forEach(sd=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(0.62,1.1,12,1,false,0,Math.PI),MAT.wood);

/* Le toit de chaume d'un fare se parcourt : des gradins invisibles de 40 cm
   épousent la pyramide, chacun à ±20 cm de la surface qu'on voit. On y monte en
   escaladant le mur de bambou, on court sur la pente, on saute d'un toit à l'autre. */
const FARE_RH=2.4;
function fareTerraces(bx,out){
  const st=0.4, A=(bx.w+1.4)/2, B=(bx.d+1.4)/2;
  for(let k=1;k*st<=FARE_RH+1e-6;k++){
    const f=1-(k-0.5)*st/FARE_RH; if(f<=0.05) break;
    out.push(b(bx.x,bx.z,2*A*f,2*B*f,bx.y1,bx.y1+k*st-0.02,"chaume"));
  }
}
function cliffCap(bx){

  const m=new THREE.Mesh(geo,wallMats("cliff")); m.position.set(bx.x,bx.y1+h/2,bx.z); m.receiveShadow=true; G.root.add(m);
  const n=Math.floor(Math.max(bx.w,bx.d)/7);

    const s=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),MAT.bush);
    s.position.set(bx.x+(bx.w>bx.d?t*bx.w:0),bx.y1+h+r*0.3,bx.z+(bx.w>bx.d?0:t*bx.d)); G.root.add(s); }
}
// Un gros bloc de rocher n'est pas une dalle : des éboulis au pied, une crête
// de broussaille et quelques blocs qui dépassent, pour casser la boîte.
function rockDecor(bx){
  if(Math.max(bx.w,bx.d)<8||bx.y1<5) return;
  const cail=[],buis=[];
  const per=2*(bx.w+bx.d), n=Math.floor(per/2.2);
  for(let k=0;k<n;k++){
    const t=(k+Math.random())/n*per; let x,z;             // un point sur le pourtour
    if(t<bx.w){x=bx.minX+t;z=bx.minZ;} else if(t<bx.w+bx.d){x=bx.maxX;z=bx.minZ+(t-bx.w);}
    else if(t<2*bx.w+bx.d){x=bx.maxX-(t-bx.w-bx.d);z=bx.maxZ;} else {x=bx.minX;z=bx.maxZ-(t-2*bx.w-bx.d);}
    const ox=x-bx.x, oz=z-bx.z, ol=Math.hypot(ox,oz)||1;
    const sz=0.5+Math.random()*1.1;
    cail.push({x:x+ox/ol*(0.4+Math.random()*1.4),y:sz*0.5,z:z+oz/ol*(0.4+Math.random()*1.4),s:sz,
      rx:Math.random()*3,ry:Math.random()*3,rz:Math.random()*3});
    if(k%2===0){ const bs=0.7+Math.random()*0.9;                          // et sur la crête
      buis.push({x:x-ox/ol*0.6,y:bx.y1+bs*0.3,z:z-oz/ol*0.6,sx:bs,sy:bs*0.6,sz:bs}); }
    if(k%3===0){ const r=0.8+Math.random()*1.2;                           // blocs en saillie sur la face
      cail.push({x:x+ox/ol*0.3,y:bx.y0+1.5+Math.random()*(bx.y1-bx.y0-3),z:z+oz/ol*0.3,s:r,
        rx:Math.random()*3,ry:Math.random()*3,rz:Math.random()*3}); }
  }
  batch(SPH0,MAT.rock,cail,true); leafBatch(buis,true);
}

function buildForest(lv){

  const floor=new THREE.MeshLambertMaterial({color:0x0e1a0f}), clumps=[];

    for(let k=0;k<80;k++){ const dist=1.5+Math.pow(Math.random(),1.5)*55, t=Math.random();
      const along=sx?(minZ-60+t*(maxZ-minZ+120)):(minX-60+t*(maxX-minX+120));
      const x=sx?(sx>0?maxX+dist:minX-dist):along, z=sz?(sz>0?maxZ+dist:minZ-dist):along;
      if(!wet(x,z)) clumps.push([x,z,1.6+dist*0.09+Math.random()*2.2]); }
    for(let k=0;k<4;k++){ const dist=3+Math.random()*16, t=(k+0.5)/4;
      const along=sx?(minZ+t*(maxZ-minZ)):(minX+t*(maxX-minX));
      const x=sx?(sx>0?maxX+dist:minX-dist):along, z=sz?(sz>0?maxZ+dist:minZ-dist):along;
      if(!wet(x,z)) palmTree(x,z,9+Math.random()*4,false,true); }
  });
  if(!clumps.length) return;

// Là où les soldats passent tous les soirs, le sable est tassé : on lit

let TEX_SENTIER=null;
function buildPaths(lv){
  if(G.quality==="low") return;
  TEX_SENTIER=TEX_SENTIER||canvasTex(64,64,(x,w,h)=>{
    const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(.5,"rgba(48,38,26,.38)"); g.addColorStop(1,"rgba(0,0,0,0)");
    x.fillStyle=g; x.fillRect(0,0,w,h);
    for(let i=0;i<300;i++){ x.fillStyle="rgba(30,24,16,"+(Math.random()*.2)+")";
      x.fillRect(Math.random()*w,h*0.3+Math.random()*h*0.4,1+Math.random()*3,1+Math.random()*2); }
  });

  const segs=[];
  lv.guards.forEach(gd=>{
    if(gd.y) return;                              // seules les rondes au sol marquent le sol
    const P=gd.path;
    for(let k=0;k<P.length;k++){
      const A=P[k], B=P[(k+1)%P.length];
      const L=Math.hypot(B[0]-A[0],B[1]-A[1]);
      if(L<1.5) continue;
      if(hillAt((A[0]+B[0])/2,(A[1]+B[1])/2,lv.hills)>0.08||hillAt(A[0],A[1],lv.hills)>0.08||hillAt(B[0],B[1],lv.hills)>0.08) continue;
      segs.push({x:(A[0]+B[0])/2,y:0.025,z:(A[1]+B[1])/2,
        rx:-Math.PI/2,ry:Math.atan2(B[0]-A[0],B[1]-A[1]),sx:1.5,sy:L,sz:1});
    }
  });
  if(!segs.length) return;
  const geo=new THREE.PlaneGeometry(1,1); geo.userData.shared=true;
  const im=new THREE.InstancedMesh(geo,mat,segs.length), d=new THREE.Object3D();
  segs.forEach((o,k)=>{ d.position.set(o.x,o.y,o.z); d.rotation.set(0,o.ry,0,"YXZ");
    d.rotateX(-Math.PI/2); d.scale.set(o.sx,o.sy,1); d.updateMatrix(); im.setMatrixAt(k,d.matrix); });

}
/* Ce qui pousse où : de l'herbe près de la jungle, des falaises, des arbres et
   sur les collines, des prairies en taches irrégulières, du sable nu au bord
   de l'eau. Renvoie la part d'herbe (0 à 1) et une teinte de sommet.        */
function fondSources(lv){
  const lis=[],arb=[];
  lv.boxes.forEach(q=>{
    if(q.type==="jungle"||q.type==="cliff") lis.push(q);
    else if(q.type==="palm"||q.type==="ora"||q.type==="uru") arb.push(q);
  });
  return {lis,arb,pr:lv.prairies||[],eau:lv.water||[],hills:lv.hills||[]};
}
const _fc=new THREE.Color();
function fondAt(S,x,z){
  let hb=0.5+0.5*Math.sin(x*0.071+z*0.043)*Math.sin(x*0.052-z*0.089)+0.18*Math.sin(x*0.31+z*0.27);
  hb=clamp((hb-0.62)*2.2,0,0.7);                        // prairies spontanées, en taches
  for(const q of S.lis){ const dx=Math.max(q.minX-x,0,x-q.maxX), dz=Math.max(q.minZ-z,0,z-q.maxZ);
    const d=Math.hypot(dx,dz); if(d<7) hb=Math.max(hb,0.95*(1-d/7)); }
  for(const q of S.arb){ const d=Math.hypot(x-q.x,z-q.z); if(d<4.5) hb=Math.max(hb,0.8*(1-d/4.5)); }
  for(const q of S.pr){ const d=Math.hypot((x-q.x)/q.rx,(z-q.z)/(q.rz||q.rx)); if(d<1) hb=Math.max(hb,0.95*Math.min(1,(1-d)*2.5)); }
  const hy=hillAt(x,z,S.hills);
  if(hy>0) hb=Math.max(hb,Math.min(0.92,hy*0.9));
  let mouille=0;
  for(const w of S.eau){ const dx=Math.max(Math.abs(x-w.x)-w.w/2,0), dz=Math.max(Math.abs(z-w.z)-w.d/2,0), d=Math.hypot(dx,dz);
    if(d<4) hb*=d/4; if(d<1.6) mouille=Math.max(mouille,1-d/1.6); }
  // teinte : sable mouillé plus sombre, herbe plus fraîche, roche sur les fortes pentes
  const v=0.9+0.1*Math.sin(x*0.19+z*0.23)*Math.sin(x*0.13-z*0.17);
  _fc.setRGB(v,v,v);
  if(mouille) _fc.multiplyScalar(1-0.32*mouille);
  if(S.hills.length&&hy>0.2){
    const sl=Math.hypot(hillAt(x+0.5,z,S.hills)-hillAt(x-0.5,z,S.hills),hillAt(x,z+0.5,S.hills)-hillAt(x,z-0.5,S.hills));
    if(sl>0.85){ const k=Math.min(1,(sl-0.85)*1.4); hb*=1-k*0.8; _fc.setRGB(v*(1-0.35*k),v*(1-0.36*k),v*(1-0.3*k)); }
  }
  return hb;
}
// Remplit les attributs d'une géométrie de sol (plan couché ou relief) : uv comme le
// grand plan de 220 m, part d'herbe et teinte.
function paintGround(geo,S){
  const P=geo.attributes.position, uv=geo.attributes.uv, n=P.count;
  const hb=new Float32Array(n), col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const x=P.getX(i), z=P.getZ(i);
    hb[i]=fondAt(S,x,z); col[i*3]=_fc.r; col[i*3+1]=_fc.g; col[i*3+2]=_fc.b;
    uv.setXY(i,(x+110)/220,(110-z)/220);
  }
  uv.needsUpdate=true;
  geo.setAttribute("aHerbe",new THREE.BufferAttribute(hb,1));
  geo.setAttribute("color",new THREE.BufferAttribute(col,3));
}
function buildGround(lv){
  const S=fondSources(lv);
  const seg=G.quality==="low"?60:110;
  const geo=new THREE.PlaneGeometry(220,220,seg,seg); geo.rotateX(-Math.PI/2);
  paintGround(geo,S);
  const gr=new THREE.Mesh(geo,MAT.terrain); gr.receiveShadow=true; G.root.add(gr);
  // les collines : une seule nappe, modelée sur hillAt, qui plonge sous le sol à leur pied
  const H=lv.hills; if(!H||!H.length) return S;
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  H.forEach(q=>{ const r=Math.max(q.rx,q.rz); x0=Math.min(x0,q.x-r); x1=Math.max(x1,q.x+r); z0=Math.min(z0,q.z-r); z1=Math.max(z1,q.z+r); });
  const st=G.quality==="low"?1.3:0.8, nx=Math.ceil((x1-x0)/st), nz=Math.ceil((z1-z0)/st);
  const tg=new THREE.PlaneGeometry(nx*st,nz*st,nx,nz); tg.rotateX(-Math.PI/2); tg.translate((x0+x1)/2,0,(z0+z1)/2);
  const P=tg.attributes.position;
  for(let i=0;i<P.count;i++){ const y=hillAt(P.getX(i),P.getZ(i),H); P.setY(i,y>0.03?y:-0.08); }
  tg.computeVertexNormals(); paintGround(tg,S);
  const tm=new THREE.Mesh(tg,MAT.terrain); tm.receiveShadow=true; tm.castShadow=true; G.root.add(tm);
  return S;
}
/* Herbe : les hautes herbes où l'on se cache, les touffes des prairies et des
   collines, et des buissons là où l'herbe est drue. Tout en deux ou trois lots. */
let BRIN_GEO=null;
function buildHerbe(lv,S){
  if(!BRIN_GEO){
    const a=new THREE.PlaneGeometry(1,1); a.translate(0,0.5,0);
    const b2=a.clone(); b2.rotateY(Math.PI/2);
    const c=a.clone(); c.rotateY(Math.PI/4);
    BRIN_GEO=mergeUV([a,b2,c]); BRIN_GEO.userData.shared=true;
  }
  const bas=G.quality==="low";
  const touffes=[], buis=[];
  const libre=(x,z)=>!inWaterLv(lv,x,z,0.4)&&!lv.boxes.some(q=>q.y0<0.5&&q.y1>0.3&&q.type!=="marche"
    &&x>q.minX-0.3&&x<q.maxX+0.3&&z>q.minZ-0.3&&z<q.maxZ+0.3);
  // les hautes herbes des cachettes : drues, à hauteur de hanche
  lv.hides.filter(h=>h.kind==="herbe").forEach(h=>{
    const n=Math.round(h.w*h.d*(bas?1.6:3.2));
    for(let k=0;k<n;k++){ const x=h.x+(Math.random()-.5)*h.w, z=h.z+(Math.random()-.5)*h.d;
      const sz=0.95+Math.random()*0.4;
      touffes.push({x,y:hillAt(x,z,S.hills)-0.02,z,sx:sz*1.1,sy:sz,sz:sz*1.1,ry:Math.random()*TAU}); }
    // une bordure plus basse, pour que le champ ne s'arrête pas au cordeau
    for(let k=0;k<n*0.3;k++){ const a=Math.random()*TAU, x=h.x+Math.cos(a)*(h.w/2+Math.random()*1.2), z=h.z+Math.sin(a)*(h.d/2+Math.random()*1.2);
      if(!libre(x,z)) continue; const sz=0.4+Math.random()*0.4;
      touffes.push({x,y:hillAt(x,z,S.hills)-0.02,z,sx:sz,sy:sz,sz:sz,ry:Math.random()*TAU}); }
  });
  // les prairies et les pentes : des touffes plus basses, là où fondAt voit de l'herbe
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  lv.boxes.forEach(q=>{ if(q.type==="void") return; x0=Math.min(x0,q.minX); x1=Math.max(x1,q.maxX); z0=Math.min(z0,q.minZ); z1=Math.max(z1,q.maxZ); });
  const essais=Math.round((x1-x0)*(z1-z0)*(bas?0.12:0.42));
  for(let k=0;k<essais;k++){
    const x=x0+Math.random()*(x1-x0), z=z0+Math.random()*(z1-z0), hb=fondAt(S,x,z);
    if(hb<0.35||Math.random()>hb) continue;
    if(!libre(x,z)) continue;
    const sz=0.3+Math.random()*0.45*hb;
    touffes.push({x,y:hillAt(x,z,S.hills)-0.02,z,sx:sz,sy:sz*(0.8+Math.random()*0.5),sz:sz,ry:Math.random()*TAU});
    if(hb>0.72&&Math.random()<(bas?0.02:0.06)){ const bs=0.5+Math.random()*0.9;
      buis.push({x:x+0.3,y:hillAt(x,z,S.hills)+bs*0.45,z,sx:bs*1.2,sy:bs*0.8,sz:bs}); }
  }
  // les buissons posés à la main
  (DECO[G.levelIndex]||[]).filter(d=>d.t==="buissons").forEach(d=>{
    for(let k=0;k<(d.n||6);k++){ const a=Math.random()*TAU, r=Math.random()*(d.r||3), x=d.x+Math.cos(a)*r, z=d.z+Math.sin(a)*r;
      const bs=0.6+Math.random()*1.1;
      buis.push({x,y:hillAt(x,z,S.hills)+bs*0.45,z,sx:bs*1.25,sy:bs*0.85,sz:bs,ry:Math.random()*3}); }
  });
  const fr=[];
  buis.forEach(q=>{ for(let k=0;k<3;k++) fr.push({x:q.x,y:q.y-q.sy*0.2,z:q.z,s:0.45*q.sx,
    rx:0.7+Math.random()*0.6,ry:Math.random()*TAU}); });
  batch(BRIN_GEO,MAT.brin,touffes,false);
  leafBatch(buis,!bas); batch(LEAF_GEO,MAT.leaf,fr);
}
// fusion simple de plans (position, normale, uv) en une géométrie
function mergeUV(list){
  const pos=[],nor=[],uv=[],idx=[]; let base=0;
  list.forEach(g=>{ const P=g.attributes.position,N=g.attributes.normal,U=g.attributes.uv;
    for(let i=0;i<P.count;i++){ pos.push(P.getX(i),P.getY(i),P.getZ(i)); nor.push(N.getX(i),N.getY(i),N.getZ(i)); uv.push(U.getX(i),U.getY(i)); }
    const I=g.index; for(let i=0;i<I.count;i++) idx.push(I.getX(i)+base); base+=P.count; });
  const o=new THREE.BufferGeometry();
  o.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  o.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  o.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2)); o.setIndex(idx); return o;
}
function inWaterLv(lv,x,z,m){ return (lv.water||[]).some(w=>Math.abs(x-w.x)<w.w/2+m&&Math.abs(z-w.z)<w.d/2+m); }
function collectSpikes(bx,out){
  const alongX=bx.w>bx.d, len=alongX?bx.w:bx.d, n=Math.floor(len/0.46);

    out.push({x:alongX?bx.x+off:bx.x,z:alongX?bx.z:bx.z+off,y:bx.y1+0.25}); }
}
function buildSpikes(list){

function buildWater(lv){

function buildMountains(lv){
  const seas=(lv.ocean||[]).map(oc=>Math.atan2(oc.x,oc.z));
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,fog:false});
  let k=0;
  for(let a=0.2;a<TAU;a+=TAU/13){
    if(seas.some(sa=>Math.abs(angDelta(a,sa))<1.25)) continue;
    const r=190+((k*53)%70), h=80+((k*37)%90), rad=50+((k*29)%45); k++;

    for(let i=0;i<p.count;i++){ const y=p.getY(i), t=(y+h/2)/h;

let PALM_ACC=null;                  // palmes et fûts des cocotiers de l'arrière-plan
function palmTree(x,z,h,straight,cheap){
  if((cheap||straight)&&PALM_ACC){
    // fût droit (cocotiers de jeu, ou de l'arrière-plan) : tout part dans trois lots
    PALM_ACC.futs.push({x,y:h/2,z,sx:cheap?0.21:0.23,sy:h,sz:cheap?0.21:0.23});
    for(let k=0;k<(cheap?7:10);k++) PALM_ACC.palmes.push({x,y:h,z,s:1,
      rx:0.95+Math.random()*0.5,ry:k/(cheap?7:10)*TAU+Math.random()*0.3});
    if(!cheap) for(let k=0;k<3;k++) PALM_ACC.cocos.push({x:x+Math.cos(k*2.1)*0.22,y:h-0.2,z:z+Math.sin(k*2.1)*0.22,s:0.13});

  for(let k=0;k<segs;k++){
    const t0=k/segs, t1=(k+1)/segs, o0=t0*t0*lean, o1=t1*t1*lean;
    const a=new THREE.Vector3(Math.cos(dir)*o0,t0*h,Math.sin(dir)*o0);
    const b2=new THREE.Vector3(Math.cos(dir)*o1,t1*h,Math.sin(dir)*o1);

  }
  if(!cheap) for(let k=0;k<3;k++){ const c=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6),MAT.wood);

/* ʻōrā : un banian, plusieurs fûts soudés, des racines qui retombent

function oraTree(bx){
  const h=bx.y1, R=Math.min(bx.w,bx.d)/2, g=new THREE.Group(); g.position.set(bx.x,0,bx.z);
  for(let k=0;k<6;k++){                     // le tronc : six fûts soudés
    const a=k/5*TAU, r=k?R*0.66:0, rad=k?R*0.34:R*0.5;
    const t=new THREE.Mesh(new THREE.CylinderGeometry(rad*0.82,rad*1.25,h,8),MAT.bark);
    t.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);
    t.rotation.z=k?(Math.random()-.5)*0.06:0; t.castShadow=true; g.add(t);
  }
  const bl=new THREE.Mesh(new THREE.SphereGeometry(R*1.5,12,8),MAT.bark);  // contrefort au pied
  bl.scale.y=0.42; bl.position.y=0.1; bl.castShadow=true; g.add(bl);
  G.root.add(g); G.anim.push({o:g,k:Math.random()*TAU,type:"palm"});
  const roots=[],feet=[],crown=[];
  for(let k=0;k<7;k++){                     // racines aériennes, toutes n'atteignent pas le sol
    const a=k/7*TAU+Math.random()*0.5, rr=R*1.5+Math.random()*2.4;
    const bas=Math.random()<0.55?0:h*(0.15+Math.random()*0.25);
    const haut=h*(0.72+Math.random()*0.2), hh=haut-bas;
    const rx=bx.x+Math.cos(a)*rr, rz=bx.z+Math.sin(a)*rr;
    roots.push({x:rx,y:bas+hh/2,z:rz,sx:0.09,sy:hh,sz:0.09,rz:(Math.random()-.5)*0.14});
    if(!bas) feet.push({x:rx,y:0.25,z:rz,sx:0.28,sy:0.5,sz:0.28});
  }
  for(let k=0;k<11;k++){                    // la couronne, large et basse
    const a=k/11*TAU+Math.random()*0.35, rr=2+Math.random()*2.6, sz=1.9+Math.random()*1.1;
    crown.push({x:bx.x+Math.cos(a)*rr,y:h-0.4+Math.random()*1.8,z:bx.z+Math.sin(a)*rr,
      sx:sz,sy:sz*0.66,sz:sz});

  m.position.set(bx.x,(bx.y0+bx.y1)/2,bx.z); m.castShadow=true; m.receiveShadow=true; G.root.add(m);
  const mur=side=>boxes.some(q=>q!==bx&&(q.type==="stone"||q.type==="wood")&&q.y1>bx.y1&&(
    side==="x-"?Math.abs(q.maxX-bx.minX)<0.35&&q.maxZ>bx.minZ&&q.minZ<bx.maxZ:
    side==="x+"?Math.abs(q.minX-bx.maxX)<0.35&&q.maxZ>bx.minZ&&q.minZ<bx.maxZ:
    side==="z-"?Math.abs(q.maxZ-bx.minZ)<0.35&&q.maxX>bx.minX&&q.minX<bx.maxX:
                Math.abs(q.minZ-bx.maxZ)<0.35&&q.maxX>bx.minX&&q.minX<bx.maxX));
  const post=[],rail=[];
  [["x-",bx.minX,null],["x+",bx.maxX,null],["z-",null,bx.minZ],["z+",null,bx.maxZ]].forEach(([sd,fx,fz])=>{
    if(mur(sd)) return;

function animDecor(){

/* Un lot d'objets identiques en un seul appel de rendu : indispensable sur
   téléphone, où c'est le nombre d'objets, pas les triangles, qui coûte.     */
function batch(geo,mat,list,shadow){
  if(!list.length) return null;
  const im=new THREE.InstancedMesh(geo,mat,list.length), d=new THREE.Object3D();
  list.forEach((o,k)=>{
    d.position.set(o.x,o.y,o.z);
    d.rotation.set(o.rx||0,o.ry||0,o.rz||0);
    const u=o.s===undefined?1:o.s;
    d.scale.set(o.sx===undefined?u:o.sx,o.sy===undefined?u:o.sy,o.sz===undefined?u:o.sz);
    d.updateMatrix(); im.setMatrixAt(k,d.matrix);
  });
  im.instanceMatrix.needsUpdate=true; im.castShadow=!!shadow; im.receiveShadow=true;
  G.root.add(im); return im;
}
// deux lots de feuillage (deux verts), donc deux appels quelle que soit la quantité
function leafBatch(list,shadow){
  batch(SPH1,MAT.bush ,list.filter((_,k)=>k%2===0),shadow);
  batch(SPH1,MAT.bush2,list.filter((_,k)=>k%2===1),shadow);

function ropeOK(p,from,to){
  const dx=to.x-from.x, dz=to.z-from.z, l=Math.hypot(dx,dz)||1;
  return to.y<=from.y+0.5&&(dx*Math.sin(p.yaw)+dz*Math.cos(p.yaw))/l>0.3;

const POLE={palm:1.3,mast:1.3,ora:1.9,uru:1.4};
function poleNear(p){
  return G.boxes.find(bx=>POLE[bx.type]&&Math.hypot(p.pos.x-bx.x,p.pos.z-bx.z)<POLE[bx.type]
    &&p.pos.y>=bx.y0-0.3&&p.pos.y<=bx.y1+0.3);

function palmClimb(p){
  const pb=poleNear(p); if(!pb) return false;
  if(Math.abs(p.pos.y-pb.y1)<0.3){
    const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw), tx=pb.x+fx*0.85, tz=pb.z+fz*0.85;
    const gy=groundAt(tx,tz,pb.y1-0.5,G.boxes);
    p.climbing={t:0,dur:0.35+0.17*(pb.y1-gy),from:p.pos.clone(),to:new THREE.Vector3(tx,gy,tz),tree:true};
    sfx("rope"); return true;
  }
  if(p.pos.y<pb.y1-0.5){
    p.yaw=Math.atan2(pb.x-p.pos.x,pb.z-p.pos.z);
    p.climbing={t:0,dur:0.35+0.2*(pb.y1-p.pos.y),from:p.pos.clone(),to:new THREE.Vector3(pb.x,pb.y1,pb.z),tree:true};

function wallClimb(p){
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw), px=p.pos.x+fx*0.8, pz=p.pos.z+fz*0.8;
  let wall=null,bd=1e9;

    if(!CLIMBABLE[bx.type]||isRingWall(bx)||bx.y1<=p.pos.y+2.35||bx.y0>p.pos.y+1.2) continue;
    const cx=clamp(px,bx.minX,bx.maxX), cz=clamp(pz,bx.minZ,bx.maxZ), d=Math.hypot(px-cx,pz-cz);

  let ox=p.pos.x-cx, oz=p.pos.z-cz; const ol=Math.hypot(ox,oz)||1; ox/=ol; oz/=ol;
  const from=new THREE.Vector3(cx+ox*0.4,p.pos.y,cz+oz*0.4);
  const ins=wall.type==="fare"?0.3:0.8;       // sous le chaume, on s'arrête au bord du premier gradin
  const tx=clamp(cx-ox*ins,wall.minX+0.35,wall.maxX-0.35), tz=clamp(cz-oz*ins,wall.minZ+0.35,wall.maxZ-0.35);
  const ty=Math.max(wall.y1,groundAt(tx,tz,wall.y1+0.3,G.boxes));
  p.yaw=Math.atan2(-ox,-oz);
  p.climbing={t:0,dur:0.45+0.26*(ty-p.pos.y),from,to:new THREE.Vector3(tx,ty,tz),tree:true,wall:true};
  p.vy=0; sfx("stone");
}
/* ---- Franchissement -----------------------------------------------------
   Un muret, une caisse, un bastingage : en courant, on passe par-dessus d'un
   appui de main sans s'arrêter. Au-delà, c'est de l'escalade.              */
const VAULT_MAX=1.35;
const SLOPE_MAX=1.2;                       // au-delà (environ 50°), une pente ne se monte plus à pied
function lowObstacle(p,fx,fz){
  const px=p.pos.x+fx*0.7, pz=p.pos.z+fz*0.7;
  let best=null,bd=1e9;
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.type==="palm"||bx.type==="mast"||bx.type==="ora") continue;
    const h=bx.y1-p.pos.y;
    if(h<0.55||h>VAULT_MAX) continue;
    const cx=clamp(px,bx.minX,bx.maxX), cz=clamp(pz,bx.minZ,bx.maxZ);
    const d=Math.hypot(px-cx,pz-cz);
    if(d>0.55||d>=bd) continue;
    // il faut de la place pour retomber de l'autre côté
    const lx=p.pos.x+fx*2.2, lz=p.pos.z+fz*2.2;
    if(groundAt(lx,lz,bx.y1+0.3,G.boxes)>bx.y1+0.05) continue;
    bd=d; best=bx;
  }
  return best;
}
function startVault(p,bx,fx,fz){
  const to=new THREE.Vector3(p.pos.x+fx*2.1,0,p.pos.z+fz*2.1);
  to.y=groundAt(to.x,to.z,bx.y1+0.3,G.boxes);
  p.vault={t:0,dur:0.42,from:p.pos.clone(),to,haut:bx.y1+0.35};
  p.noGrab=0.5; sfx("stone"); makeNoise(p.pos.x,p.pos.z,5,0.12);
}

/* ---- Rebords ------------------------------------------------------------
   Tout ce qui s'escalade a désormais une corniche : on s'y suspend par les
   mains, on se déplace de côté, on passe les angles, on se rétablit sur le
   toit ou on lâche. Suspendu, on n'est pas visible de celui qui marche
   au-dessus : le toit lui coupe la vue.                                    */
const HANG_DROP=1.85;                       // les mains au rebord, les pieds dans le vide
const LEDGE_MIN=2.6;                        // plus bas, on enjambe au lieu de se suspendre
const FACE_N={"x-":[-1,0],"x+":[1,0],"z-":[0,-1],"z+":[0,1]};
const hangYaw=side=>Math.atan2(-FACE_N[side][0],-FACE_N[side][1]);
const hangAxisX=side=>side==="z-"||side==="z+";
function hangSpan(bx,side){
  return hangAxisX(side)?[bx.minX+0.35,bx.maxX-0.35]:[bx.minZ+0.35,bx.maxZ-0.35];
}
function hangPos(h){
  const bx=h.bx, n=FACE_N[h.side], sp=hangSpan(bx,h.side), u=clamp(h.u,sp[0],sp[1]);
  return n[0]
    ? new THREE.Vector3(bx.x+n[0]*(bx.w/2+0.34),bx.y1-HANG_DROP,u)
    : new THREE.Vector3(u,bx.y1-HANG_DROP,bx.z+n[1]*(bx.d/2+0.34));
}
function hangable(bx){
  return CLIMBABLE[bx.type]&&bx.type!=="fare"&&!isRingWall(bx)&&bx.y1>=LEDGE_MIN
    &&Math.min(bx.w,bx.d)>0.9&&Math.max(bx.w,bx.d)>1.4;
}
// la face de bx dont on est le plus près, vue du dehors
function faceOutside(bx,x,z,reach){
  let best=null;
  for(const side in FACE_N){
    const n=FACE_N[side];
    const d=n[0]?(n[0]>0?x-bx.maxX:bx.minX-x):(n[1]>0?z-bx.maxZ:bx.minZ-z);
    if(d<-0.2||d>reach) continue;
    const u=n[0]?z:x, lo=n[0]?bx.minZ:bx.minX, hi=n[0]?bx.maxZ:bx.maxX;
    if(u<lo-0.25||u>hi+0.25) continue;
    if(!best||d<best.d) best={side,d,u};
  }
  return best;
}
// un rebord à portée de main, pendant qu'on descend le long d'un mur
function ledgeGrab(x,y,z){
  let best=null,bd=1e9;
  for(const bx of G.boxes){
    if(!hangable(bx)) continue;
    const drop=bx.y1-y;
    if(drop<1.35||drop>2.3) continue;
    const f=faceOutside(bx,x,z,0.85);
    if(f&&f.d<bd){bd=f.d;best={bx,side:f.side,u:f.u};}
  }
  return best;
}
// le rebord du toit où l'on se tient, dans la direction du regard
function ledgeUnder(p){
  if(!p.onGround||p.carrying||p.speedNow>2.2) return null;
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  for(const bx of G.boxes){
    if(!hangable(bx)||Math.abs(bx.y1-p.pos.y)>0.35) continue;
    if(!insideBox(p.pos.x,p.pos.z,bx,0.4)) continue;
    for(const side in FACE_N){
      const n=FACE_N[side];
      if(fx*n[0]+fz*n[1]<0.45) continue;              // il faut regarder vers le vide
      const d=n[0]?(n[0]>0?bx.maxX-p.pos.x:p.pos.x-bx.minX)
                  :(n[1]>0?bx.maxZ-p.pos.z:p.pos.z-bx.minZ);
      if(d<-0.15||d>1.05) continue;
      const h={bx,side,u:n[0]?p.pos.z:p.pos.x}, sp=hangSpan(bx,side);
      if(h.u<sp[0]-0.3||h.u>sp[1]+0.3) continue;
      return h;
    }
  }
  return null;
}
function startHang(p,h){
  p.hang=h; p.climbing=null; p.gliding=null; p.vy=0; p.onGround=false; p.crouch=false;
  p.pos.copy(hangPos(h)); p.yaw=hangYaw(h.side); p.noGrab=0; sfx("stone");
}
function releaseHang(){
  const p=G.player; if(!p.hang) return;
  const n=FACE_N[p.hang.side];
  p.pos.x+=n[0]*0.2; p.pos.z+=n[1]*0.2;
  p.hang=null; p.vy=-1; p.onGround=false; p.fallFrom=p.pos.y; p.noGrab=0.3;
}
function hangPullUp(p){
  const h=p.hang, bx=h.bx, n=FACE_N[h.side];
  const to=new THREE.Vector3(
    clamp(p.pos.x-n[0]*1,bx.minX+0.45,bx.maxX-0.45),bx.y1,
    clamp(p.pos.z-n[1]*1,bx.minZ+0.45,bx.maxZ-0.45));
  p.hang=null; p.climbing={t:0,dur:0.42,from:p.pos.clone(),to,tree:true,wall:true};
  p.vy=0; sfx("stone");
}
// passer l'angle : on bascule sur la face perpendiculaire, sans lâcher
const CORNER={
  "z+":{hi:"x+",lo:"x-",u:bx=>bx.maxZ-0.35},
  "z-":{hi:"x+",lo:"x-",u:bx=>bx.minZ+0.35},
  "x+":{hi:"z+",lo:"z-",u:bx=>bx.maxX-0.35},
  "x-":{hi:"z+",lo:"z-",u:bx=>bx.minX+0.35}
};
function hangShimmy(h,du){
  const sp=hangSpan(h.bx,h.side), u=h.u+du;
  if(u>sp[1]+0.02||u<sp[0]-0.02){
    const c=CORNER[h.side], ns=u>sp[1]?c.hi:c.lo;
    const nsp=hangSpan(h.bx,ns), nu=c.u(h.bx);
    if(nu>=nsp[0]-0.02&&nu<=nsp[1]+0.02){ h.side=ns; h.u=clamp(nu,nsp[0],nsp[1]); sfx("tick"); return; }
  }
  h.u=clamp(u,sp[0],sp[1]);
}
/* Sauter d'un rebord à l'autre : suspendu, Q ou D pousse vers le côté, et si
   une corniche attend à portée sur un AUTRE bâtiment, on s'y jette.
   Sans direction, Espace se contente de rétablir sur le toit.              */
function ledgeJump(p,dir){
  const h=p.hang, yaw=hangYaw(h.side);
  const rx=Math.cos(yaw), rz=-Math.sin(yaw);          // « à droite » du grimpeur
  const dx=rx*dir, dz=rz*dir;
  let best=null,bd=1e9;
  for(const bx of G.boxes){
    if(bx===h.bx||!hangable(bx)) continue;
    if(Math.abs(bx.y1-h.bx.y1)>2.6) continue;         // pas plus d'un étage d'écart
    for(const side in FACE_N){
      const n=FACE_N[side];
      if(n[0]*dx+n[1]*dz>-0.3) continue;              // la face doit nous regarder
      const cible={bx,side,u:n[0]?p.pos.z:p.pos.x};
      const q=hangPos(cible);
      const ecart=(q.x-p.pos.x)*dx+(q.z-p.pos.z)*dz;  // devant nous, du bon côté
      if(ecart<0.6||ecart>4.4) continue;
      const lat=Math.abs((q.x-p.pos.x)*dz-(q.z-p.pos.z)*dx);
      if(lat>1.6) continue;
      const d=Math.hypot(q.x-p.pos.x,q.z-p.pos.z);
      if(d<bd){ bd=d; best={cible,q}; }
    }
  }
  if(!best) return false;
  p.hang=null;
  p.saut={t:0,dur:0.1+bd*0.075,from:p.pos.clone(),to:best.q,cible:best.cible};
  sfx("rope"); return true;
}

function setupFireflies(lv){
  G.fireflies=null;

function updateLightPool(cx,cz){

  src.sort((a,b)=>a.d-b.d);
  const max=G.quality==="low"?2:LIGHT_POOL.length;
  const cut=src[max]?Math.sqrt(src[max].d):1e9;
  for(let k=0;k<LIGHT_POOL.length;k++){

  }
}

  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xcbb38a,size:0.09,transparent:true,depthWrite:false}));
  G.root.add(pts); G.fx.push({pts,vel,t:0});
}
function updateFX(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i]; f.t+=dt;
    const a=f.pts.geometry.attributes.position;
    for(let k=0;k<f.vel.length;k++){
      f.vel[k].y-=(f.g===undefined?6:f.g)*dt;
      a.array[k*3]+=f.vel[k].x*dt; a.array[k*3+1]=Math.max(0.05,a.array[k*3+1]+f.vel[k].y*dt); a.array[k*3+2]+=f.vel[k].z*dt;
    }
    a.needsUpdate=true;
    f.pts.material.opacity=Math.max(0,(f.g===undefined?1:0.5)*(1-f.t/0.9));
    if(f.t>0.9){ G.root.remove(f.pts); f.pts.geometry.dispose(); G.fx.splice(i,1); }
  }
}

   8. Lumière
   ============================================================ */
function lightAt(x,z){
  let l=0;
  for(const t of G.torches){
    if(!t.on) continue;
    const d=Math.hypot(x-t.x,z-t.z);
    if(d<t.r) l=Math.max(l,1-d/t.r);
  }
  for(const g of G.guards){
    if(g.dead||!g.def.torch) continue;
    const d=Math.hypot(x-g.pos.x,z-g.pos.z);
    if(d<8) l=Math.max(l,(1-d/8)*0.9);
  }
  return Math.min(1,l);
}
const inSmoke=(x,z)=>G.smokes.some(s=>s.t>0.3&&Math.hypot(x-s.x,z-s.z)<s.r);
function smokeBlocks(ax,az,bx,bz){
  for(const s of G.smokes){
    if(s.t<0.25) continue;
    if(distPtSeg(s.x,s.z,ax,az,bx,bz)<s.r) return true;
  }
  return false;
}

function stickPos(t){
  const r=stick.getBoundingClientRect();
  let dx=(t.clientX-(r.left+r.width/2))/(r.width/2);
  let dy=(t.clientY-(r.top+r.height/2))/(r.height/2);
  const l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;}
  touch.move.x=dx; touch.move.y=dy;
  knob.style.transform="translate("+(dx*34)+"px,"+(dy*34)+"px)";
}

  for(const t of e.changedTouches) if(t.identifier===stickId) stickPos(t);},{passive:false});

  stickId=null;touch.move.x=touch.move.y=0;knob.style.transform="";}}

/* ---- Regard tactile ----------------------------------------------------
   Glisser n'importe où sur l'écran tourne la caméra : la zone couvre toute la
   surface, mais elle est placée SOUS le HUD et les manettes, qui reçoivent donc
   les appuis en premier. Deux doigts règlent la distance, un double appui
   remet la caméra derrière l'épaule.                                       */
const lookEl=document.getElementById("look");
let lookPts=[], lookPrev=null, pinchRef=0, lastTapT=0;
G.sens=parseFloat(store("fenua.sens"))||1;
G.invY=store("fenua.invy")==="1";
G.autoCam=store("fenua.autocam")!=="0";
const lookMid=()=>{ let x=0,y=0; for(const t of lookPts){x+=t.x;y+=t.y;} 
  return {x:x/lookPts.length,y:y/lookPts.length}; };
const lookSpan=()=>lookPts.length<2?0:Math.hypot(lookPts[0].x-lookPts[1].x,lookPts[0].y-lookPts[1].y);
function recentreCamera(){
  if(!G.player) return;
  G.camYaw=G.player.yaw+Math.PI; G.camPitch=0.35; toast("Caméra replacée derrière l'épaule");
}
lookEl.addEventListener("touchstart",e=>{
  e.preventDefault();
  for(const t of e.changedTouches) lookPts.push({id:t.identifier,x:t.clientX,y:t.clientY});
  lookPrev=lookMid(); pinchRef=lookSpan();
  if(lookPts.length===1){
    const now=performance.now();
    if(now-lastTapT<290) recentreCamera();
    lastTapT=now;
  }
},{passive:false});
lookEl.addEventListener("touchmove",e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const i=lookPts.findIndex(q=>q.id===t.identifier);
    if(i>=0){ lookPts[i].x=t.clientX; lookPts[i].y=t.clientY; }
  }
  if(!lookPts.length) return;
  const mid=lookMid();
  if(lookPrev&&G.phase==="play"){
    // le pas est rapporté à la taille de l'écran : même ressenti sur téléphone et tablette
    const k=2.8*G.sens/Math.min(innerWidth,innerHeight);
    G.camYaw-=(mid.x-lookPrev.x)*k;
    G.camPitch=clamp(G.camPitch+(mid.y-lookPrev.y)*k*0.8*(G.invY?-1:1),-0.3,1.15);
  }
  lookPrev=mid;
  const span=lookSpan();
  if(span&&pinchRef&&G.phase==="play") G.camDist=clamp(G.camDist*(pinchRef/span),3.2,12);
  pinchRef=span;
},{passive:false});
function lookEnd(e){
  for(const t of e.changedTouches){
    const i=lookPts.findIndex(q=>q.id===t.identifier); if(i>=0) lookPts.splice(i,1);
  }
  lookPrev=lookPts.length?lookMid():null; pinchRef=lookSpan();
}
lookEl.addEventListener("touchend",lookEnd); lookEl.addEventListener("touchcancel",lookEnd);

const PAD={on:false,mx:0,my:0,run:false,prev:{}};
function pollGamepad(dt){
  const pads=navigator.getGamepads?navigator.getGamepads():[]; let gp=null;
  for(const q of pads) if(q&&q.connected){gp=q;break;}
  if(!gp){ if(PAD.on){PAD.on=false;PAD.mx=PAD.my=0;PAD.run=false;} return; }
  if(!PAD.on){ PAD.on=true; toast("Manette reconnue"); }
  const dz=v=>Math.abs(v)<0.18?0:v;
  PAD.mx=dz(gp.axes[0]||0); PAD.my=dz(gp.axes[1]||0);
  const lx=dz(gp.axes[2]||0), ly=dz(gp.axes[3]||0);
  if(G.phase==="play"){
    G.camYaw-=lx*dt*2.8*G.sens;
    G.camPitch=clamp(G.camPitch+ly*dt*2*G.sens*(G.invY?-1:1),-0.3,1.15);
  }
  const b=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5));
  const press=(i,fn)=>{ const now=b(i); if(now&&!PAD.prev[i]) fn(); PAD.prev[i]=now; };
  PAD.run=b(7)||b(5);
  if(G.phase==="play"){
    press(0,tryClimb); press(2,tryAction); press(3,tryKO);
    press(1,()=>{ if(G.player.hang) releaseHang(); else G.player.crouch=!G.player.crouch; });
    press(4,cycleTool); press(6,useTool); press(13,siffler);
    press(12,()=>{ if(G.player.hang) releaseHang(); else dropBody(); });
    press(9,pause);
  }else if(G.phase==="pause"){ press(9,resume); press(1,resume); }
  else{ for(const i of [0,1,2,3,4,5,6,7,9,12,13]) PAD.prev[i]=b(i); }
}

function inHide(x,z){

    if(x>h.x-h.w/2&&x<h.x+h.w/2&&z>h.z-h.d/2&&z<h.z+h.d/2) return h;

function makeNoise(x,z,radius,bump){
  for(const g of G.guards){
    if(g.dead) continue;
    const d=Math.hypot(g.pos.x-x,g.pos.z-z);
    if(d<radius){
      g.aware=clamp(g.aware+bump*(1-d/radius),0,0.85);
      if(g.state!=="ALERT"){ g.state="INVESTIGATE"; g.poi={x,z}; g.searchT=0; }
    }
  }

/* Siffler : le garde le plus proche vient voir, sans donner l'alarme. Depuis une
   cachette, c'est l'embuscade toute prête — mais s'il arrive avant le coup, il
   fouille la cachette. Quatre secondes entre deux sifflements.              */
function siffler(){
  const p=G.player; if(G.phase!=="play"||p.lunge||p.stun>0) return;
  if(p.siffleT>0) return;
  p.siffleT=4; sfx("siffle");
  let best=null,bd=12;
  for(const g of G.guards){
    if(g.dead||g.state==="ALERT"||g.frozen||g.pull||g.poison>0||g.picking) continue;
    if(Math.abs(g.pos.y-p.pos.y)>3) continue;
    const d=Math.hypot(g.pos.x-p.pos.x,g.pos.z-p.pos.z); if(d<bd){bd=d;best=g;}
  }
  if(!best){ toast("Personne à portée du sifflement"); return; }
  best.state="INVESTIGATE"; best.poi={x:p.pos.x,z:p.pos.z}; best.searchT=0;
  best.aware=Math.max(best.aware,0.35); best.coins=null; best.meet=null; best.fouille=null;
  toast(best.def.name+" a entendu siffler — il vient voir");
}
function selectTool(k){ if(G.tool!==k){G.tool=k;updateToolsUI();} }
function cycleTool(){
  const i=TOOLS.findIndex(t=>t.k===G.tool);
  for(let s=1;s<=TOOLS.length;s++){
    const t=TOOLS[(i+s)%TOOLS.length];
    if(G.tools[t.k]>0){selectTool(t.k);return;}
  }
  selectTool(TOOLS[(i+1)%TOOLS.length].k);
}
function tryClimb(){
  const p=G.player; if(p.climbing||p.gliding||p.saut||p.vault||p.stun>0) return;
  if(p.hang){
    // suspendu : avec une direction, on se jette vers la corniche voisine ;
    // sans direction, on se rétablit sur le toit
    let dir=0;
    if(K.KeyA||K.ArrowLeft) dir-=1;
    if(K.KeyD||K.ArrowRight) dir+=1;
    if(Math.abs(touch.move.x)>0.4) dir+=touch.move.x;
    if(Math.abs(PAD.mx)>0.4) dir+=PAD.mx;
    if(dir&&ledgeJump(p,clamp(dir,-1,1)>0?1:-1)) return;
    hangPullUp(p); return;
  }
  // tyrolienne prioritaire
  for(const r of G.ropes){
    for(const [from,to] of [[r.a,r.b],[r.b,r.a]]){
      if(Math.hypot(p.pos.x-from.x,p.pos.z-from.z)<2&&Math.abs(p.pos.y-(from.y-0.2))<1.6&&ropeOK(p,from,to)){
        if(p.carrying){toast("Impossible avec un corps sur l'épaule");return;}
        p.gliding={t:0,dur:Math.max(0.7,from.distanceTo(to)/11),from:p.pos.clone(),
          to:new THREE.Vector3(to.x,to.y,to.z)};
        sfx("rope"); return;
      }
    }
  }
  if(p.carrying){toast("Impossible de grimper avec un corps");return;}
  const fx=Math.sin(p.yaw),fz=Math.cos(p.yaw);
  let best=null,bestD=1e9;
  for(const bx of G.boxes){
    if(bx.type==="void"||bx.y1<=p.pos.y+0.35||bx.y1>p.pos.y+2.35) continue;
    const px=p.pos.x+fx*0.8, pz=p.pos.z+fz*0.8;
    const cx=clamp(px,bx.minX,bx.maxX), cz=clamp(pz,bx.minZ,bx.maxZ);
    const d=Math.hypot(px-cx,pz-cz);
    if(d<0.75&&d<bestD){bestD=d;best=bx;}
  }
  if(best){
    const tx=clamp(p.pos.x+fx*1.5,best.minX+0.45,best.maxX-0.45);
    const tz=clamp(p.pos.z+fz*1.5,best.minZ+0.45,best.maxZ-0.45);
    p.climbing={t:0,dur:0.55,from:p.pos.clone(),to:new THREE.Vector3(tx,best.y1,tz)};
    p.vy=0; sfx("stone");
  }else{
    const w=wallClimb(p);
    if(w) startWallClimb(p,w);
    else if(palmClimb(p)){}
    else{
      // au bord d'un toit et à l'arrêt : on se suspend plutôt que de sauter
      const le=ledgeUnder(p);
      if(le) startHang(p,le);
      else if(p.onGround&&!p.swim){ const run=p.speedNow>4.2; p.vy=run?6.3:5.0; p.onGround=false; p.noGrab=0.4; }
    }
  }
}
function throwDir(){ return new THREE.Vector3(-Math.sin(G.camYaw),0,-Math.cos(G.camYaw)); }
function useTool(){
  const p=G.player;
  if(p.carrying){toast("Les mains sont prises");return;}
  const k=G.tool;
  if(!G.tools[k]){toast("Plus de "+TOOLS.find(t=>t.k===k).n.toLowerCase());return;}
  if(k==="knife") return throwKnife(false);
  if(k==="dart") return throwKnife(true);
  G.tools[k]--; updateToolsUI();
  const dir=throwDir();
  const mat=k==="smoke"?MAT.steel:(k==="coins"?MAT.gold:MAT.wood);
  const m=new THREE.Mesh(new THREE.SphereGeometry(k==="stone"?0.11:0.16,6,5),mat);
  m.position.set(p.pos.x,p.pos.y+1.3,p.pos.z); G.root.add(m);
  G.projectiles.push({kind:k,mesh:m,vel:new THREE.Vector3(dir.x*13,4.4,dir.z*13),t:0,landed:false,fuse:0});
  sfx("stone");
}
function throwKnife(dart){
  const p=G.player;
  const dir=throwDir(), range=dart?15:18;
  // visée assistée : la cible la plus proche dans un cône devant
  let best=null,bd=1e9;
  for(const g of G.guards){
    if(g.dead||g.poison>0) continue;
    const dx=g.pos.x-p.pos.x, dz=g.pos.z-p.pos.z, d=Math.hypot(dx,dz);
    if(d>range||d<0.6) continue;
    const dot=(dx*dir.x+dz*dir.z)/d;
    if(dot<0.9) continue;
    if(!lineOfSight(p.pos.x,chestY(),p.pos.z,g.pos.x,g.pos.y+1.3,g.pos.z,G.boxes)) continue;
    if(d<bd){bd=d;best=g;}
  }
  if(!best){toast("Aucune cible en ligne de mire");return;}
  G.tools[dart?"dart":"knife"]--; updateToolsUI();
  const m=new THREE.Mesh(dart?new THREE.BoxGeometry(0.03,0.03,0.26):new THREE.SphereGeometry(0.07,8,6),dart?MAT.bambooPole:MAT.pebble);
  m.position.set(p.pos.x,chestY(),p.pos.z); G.root.add(m);
  G.projectiles.push({kind:dart?"dart":"knife",mesh:m,target:best,t:0,
    from:m.position.clone(),dur:Math.max(0.12,bd/(dart?40:34))});
  sfx("knife");
}

function supportBox(g){

function startTakedown(a,ko){
  const p=G.player, g=a.guard;
  if(a.type==="chute"||a.type==="rebord"||a.type==="eau"){
    // tiré par la cheville : il tombe — ou il coule — à côté de l'assassin
    const to=new THREE.Vector3(p.pos.x,0,p.pos.z);
    if(a.type==="chute"){
      const bx=supportBox(g);
      let ox=p.pos.x-clamp(p.pos.x,bx.minX,bx.maxX), oz=p.pos.z-clamp(p.pos.z,bx.minZ,bx.maxZ);
      const ol=Math.hypot(ox,oz)||1;
      to.set(p.pos.x+ox/ol*0.9,0,p.pos.z+oz/ol*0.9);
    }
    to.y=a.type==="eau"?0:groundAt(to.x,to.z,p.pos.y+0.5,G.boxes);
    g.frozen=true;
    g.pull={t:0,dur:a.type==="chute"?0.7:0.85,from:g.pos.clone(),to,
            type:a.type,label:a.label,arc:a.type==="eau"?-0.25:0.6};
    p.yaw=Math.atan2(g.pos.x-p.pos.x,g.pos.z-p.pos.z);
    p.grabT=0.8; p.stun=0.8; G.slow=0.7;
    sfx("rope"); return;
  }
  const aerial=a.type==="aerien"||a.type==="tyrolienne";
  let dx=p.pos.x-g.pos.x, dz=p.pos.z-g.pos.z; const dl=Math.hypot(dx,dz)||1; dx/=dl; dz/=dl;
  const to=new THREE.Vector3(g.pos.x+dx*0.65,g.pos.y,g.pos.z+dz*0.65);
  const second=ko?null:a.second;
  g.frozen=true; if(second) second.frozen=true;
  p.yaw=Math.atan2(g.pos.x-p.pos.x,g.pos.z-p.pos.z);
  p.lunge={t:0,dur:aerial?0.5:(a.type==="elan"?0.28:0.22),from:p.pos.clone(),to,arc:aerial?0.9:0.12,
    pending:{g,type:ko?"ko":a.type,label:ko?"assommé":a.label,second}};
  p.climbing=null; p.gliding=null;
  G.slow=ko?0.35:(aerial?0.85:0.55); p.bladeT=ko?0:0.9; sfx(ko?"thud":"knife");
}
function tryKO(){
  if(G.phase!=="play"||!G.player||G.player.lunge) return;

  if(!a||a.kind!=="kill") return;
  if(!a.koOK){ toast(a.guard.def.isTarget?"Une cible ne s'assomme pas":"Impossible de l'assommer ainsi"); return; }
  startTakedown(a,true); G.promptAction=null; updatePrompt();

/* ---- charges suspendues : l'accident parfait ---- */
function buildHazards(list){
  G.hazards=list.map(hz=>{
    const ang=Math.atan2(hz.x-hz.px,hz.z-hz.pz), len=Math.hypot(hz.x-hz.px,hz.z-hz.pz);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,5.4,8),MAT.wood);
    post.position.set(hz.px,2.7,hz.pz); post.castShadow=true; G.root.add(post);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,len+0.5),MAT.wood);
    arm.position.set((hz.px+hz.x)/2+Math.sin(ang)*0.25,5.2,(hz.pz+hz.z)/2+Math.cos(ang)*0.25);
    arm.rotation.y=ang; arm.castShadow=true; G.root.add(arm);
    const brace=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,1.4),MAT.wood);
    brace.rotation.order="YXZ"; brace.rotation.set(-0.78,ang,0);
    brace.position.set(hz.px+Math.sin(ang)*0.5,4.7,hz.pz+Math.cos(ang)*0.5); G.root.add(brace);
    const cleat=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.3,0.1),MAT.iron);
    cleat.position.set(hz.px+Math.sin(ang)*0.16,1.1,hz.pz+Math.cos(ang)*0.16); G.root.add(cleat);
    const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1,4),MAT.rope); G.root.add(rope);
    const load=new THREE.Group();
    const cr=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9),MAT.crate); cr.castShadow=true; load.add(cr);
    for(let k=0;k<9;k++){ const j=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),MAT.trunk);
      j.position.set((Math.random()-.5)*0.8,0.3+Math.random()*0.4,(Math.random()-.5)*0.8); j.castShadow=true; load.add(j); }
    const net=new THREE.Mesh(new THREE.IcosahedronGeometry(0.78,1),NET); net.position.y=0.15; load.add(net);
    load.position.set(hz.x,3.6,hz.z); G.root.add(load);
    return {x:hz.x,z:hz.z,px:hz.px,pz:hz.pz,load,rope,y:3.6,vy:0,cut:false,done:false};
  });
}
function cutHazard(h){ h.cut=true; sfx("rope"); toast("La corde cède…"); }
function updateHazards(dt){
  for(const h of G.hazards){
    if(h.cut&&!h.done){
      h.vy-=19*dt; h.y+=h.vy*dt;
      if(h.y<=0.45){
        h.y=0.45; h.done=true; sfx("boom"); makeNoise(h.x,h.z,9,0.3);
        let n=0;
        for(const g of G.guards){
          if(g.dead||g.pos.y>1) continue;
          if(Math.hypot(g.pos.x-h.x,g.pos.z-h.z)<1.9){ killGuard(g,"accident","accident"); n++; }
        }
        const p=G.player;
        if(Math.hypot(p.pos.x-h.x,p.pos.z-h.z)<1.3&&p.pos.y<1){ p.stun=0.9; toast("Tu as failli y passer"); }
        else if(!n) toast("La charge s'écrase… sur personne");
        h.load.rotation.set(0.15,h.load.rotation.y,0.25);
      }
    }
    h.load.position.y=h.y;
    if(!h.cut) h.load.rotation.y=Math.sin(VT*0.6+h.x)*0.15;
    h.rope.visible=!h.cut;
    const top=5.1, bot=h.y+0.75;
    h.rope.scale.y=Math.max(0.01,top-bot); h.rope.position.set(h.x,(top+bot)/2,h.z);
  }
  for(let i=G.coinPiles.length-1;i>=0;i--){
    const c=G.coinPiles[i]; c.t+=dt;
    if(c.t>14){ G.root.remove(c.mesh); G.coinPiles.splice(i,1); }
  }
}
function dropBody(){
  const p=G.player; if(!p.carrying) return;

  g.pos.set(p.pos.x,p.pos.y,p.pos.z);
  g.mesh.position.copy(g.pos); g.mesh.rotation.set(0,g.yaw,Math.PI/2.1);
  g.carried=false; p.carrying=null; toast("Corps déposé");
